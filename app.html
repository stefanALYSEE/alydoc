<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>alyDoc – Mail ablegen</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
      background:#F2F2F7;color:#000;font-size:14px;
      -webkit-font-smoothing:antialiased;
    }
    :root{
      --bg:#F2F2F7;
      --surface:#FFFFFF;
      --pri:#007AFF;
      --blue:#007AFF;
      --grn:#34C759;
      --org:#FF9F0A;
      --red:#FF3B30;
      --sep:rgba(60,60,67,.18);
      --label:#000;
      --secondary:#636366;
      --tertiary:#AEAEB2;
      --mut:#636366;
      --dbx:#0061FF;
      --fill:rgba(120,120,128,.12);
    }

    /* ── NAV BAR ───────────────────────────────────────── */
    .nav-bar{
      background:rgba(242,242,247,.95);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-bottom:.5px solid var(--sep);
      padding:10px 16px;
      display:flex;align-items:center;gap:10px;
      position:sticky;top:0;z-index:10;
    }
    .nav-logo{
      width:30px;height:30px;
      background:linear-gradient(145deg,#FF9F0A,#FF5500);
      border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:700;color:#fff;letter-spacing:-.3px;flex-shrink:0;
      box-shadow:0 2px 6px rgba(255,100,0,.28);
    }
    .nav-title{font-size:17px;font-weight:600;letter-spacing:-.3px;flex:1}
    .nav-right{text-align:right;flex-shrink:0}
    .nav-user{font-size:11px;color:var(--secondary);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-version{font-size:9px;color:var(--tertiary)}

    /* ── SCREENS ───────────────────────────────────────── */
    .screen{padding:16px;display:none}
    .screen.active{display:block}

    /* ── SECTION LABEL ─────────────────────────────────── */
    .section-label{
      font-size:12px;font-weight:500;color:var(--secondary);
      text-transform:uppercase;letter-spacing:.5px;
      margin:0 4px 6px;
    }

    /* ── CARD ──────────────────────────────────────────── */
    .card{background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:16px}

    /* ── MAIL CARD ─────────────────────────────────────── */
    .mail-subject-row{padding:12px 14px 8px}
    .mail-subject{font-weight:600;font-size:14px;line-height:1.35;color:var(--label)}
    .mail-meta-row{
      display:flex;align-items:flex-start;gap:7px;
      padding:7px 14px;font-size:12px;color:var(--secondary);
      border-top:.5px solid var(--sep);
    }
    .mail-meta-row i{margin-top:1px;width:12px;color:var(--tertiary);flex-shrink:0}
    .att-list{border-top:.5px solid var(--sep)}
    .att-header-row{
      padding:8px 14px 4px;
      font-size:11px;font-weight:600;color:var(--secondary);
      text-transform:uppercase;letter-spacing:.4px;
    }
    .att-item{
      display:flex;align-items:center;gap:8px;
      padding:7px 14px;font-size:12px;color:var(--secondary);
      border-top:.5px solid var(--sep);
    }
    .att-item i{color:var(--pri);width:14px;flex-shrink:0}

    /* ── BUTTONS ───────────────────────────────────────── */
    .btn{
      display:flex;align-items:center;justify-content:center;gap:7px;
      width:100%;padding:14px 16px;
      border-radius:12px;border:none;cursor:pointer;
      font-size:15px;font-weight:600;letter-spacing:-.1px;
      transition:opacity .15s,transform .1s;
      -webkit-font-smoothing:antialiased;
    }
    .btn:active:not(:disabled){opacity:.8;transform:scale(.98)}
    .btn-primary{background:var(--pri);color:#fff}
    .btn-primary:not(:disabled):hover{background:#0066dd}
    .btn-primary:disabled{background:rgba(0,122,255,.3);cursor:not-allowed}
    .btn-success{background:var(--grn);color:#fff}
    .btn-success:not(:disabled):hover{background:#28a541}
    .btn-success:disabled{background:rgba(52,199,89,.3);cursor:not-allowed}
    .btn-tonal{background:rgba(0,122,255,.1);color:var(--pri)}
    .btn-tonal:hover{background:rgba(0,122,255,.16)}
    .btn+.btn{margin-top:8px}

    /* ── SEARCH ────────────────────────────────────────── */
    .search-wrap{position:relative;margin-bottom:8px}
    .search-wrap .search-icon{
      position:absolute;left:10px;top:50%;transform:translateY(-50%);
      color:var(--tertiary);font-size:12px;pointer-events:none;
    }
    .search-wrap input{
      width:100%;padding:9px 32px 9px 30px;
      background:var(--surface);border:none;border-radius:10px;
      font-size:14px;color:var(--label);outline:none;
      -webkit-font-smoothing:antialiased;
    }
    .search-wrap input::placeholder{color:var(--tertiary)}
    .clear-search{
      position:absolute;right:8px;top:50%;transform:translateY(-50%);
      width:16px;height:16px;border-radius:50%;
      background:rgba(60,60,67,.22);border:none;
      cursor:pointer;color:#fff;font-size:9px;
      display:flex;align-items:center;justify-content:center;padding:0;
    }

    /* ── FOLDER TREE ───────────────────────────────────── */
    .tree-wrap{
      background:var(--surface);border-radius:12px;
      max-height:48vh;min-height:200px;
      overflow-y:auto;margin-bottom:8px;
    }
    .tree-item{
      display:flex;align-items:center;gap:7px;
      padding:9px 12px;cursor:pointer;
      border-bottom:.5px solid var(--sep);
      user-select:none;transition:background .1s;font-size:13px;
    }
    .tree-item:last-child{border-bottom:none}
    .tree-item:hover{background:rgba(0,122,255,.05)}
    .tree-item:active{background:rgba(0,0,0,.04)}
    .tree-item.selected{background:rgba(0,122,255,.09)}
    .tree-item.selected .name{color:var(--pri);font-weight:600}
    .tree-item .chevron{
      width:14px;height:14px;
      display:flex;align-items:center;justify-content:center;
      color:var(--tertiary);font-size:10px;flex-shrink:0;
    }
    .tree-item i.fa-folder,
    .tree-item i.fa-folder-open{color:#FF9F0A;font-size:13px;width:15px;flex-shrink:0}
    .tree-item i.fa-dropbox{color:var(--dbx);font-size:13px;width:15px;flex-shrink:0}
    .tree-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── NEW FOLDER ────────────────────────────────────── */
    #new-folder-wrap{display:flex;gap:6px;margin-bottom:16px}
    #new-folder-name{
      flex:1;padding:9px 12px;
      background:var(--surface);border:none;border-radius:10px;
      font-size:13px;color:var(--label);outline:none;
    }
    #new-folder-name::placeholder{color:var(--tertiary)}
    .btn-icon{
      padding:9px 14px;border-radius:10px;
      background:rgba(0,122,255,.1);color:var(--pri);
      border:none;cursor:pointer;
      font-size:13px;font-weight:500;
      display:flex;align-items:center;gap:5px;white-space:nowrap;
    }
    .btn-icon:hover{background:rgba(0,122,255,.16)}

    /* ── SELECTED FOLDER ───────────────────────────────── */
    .sel-folder{
      display:flex;align-items:center;gap:8px;
      background:rgba(52,199,89,.1);border-radius:10px;
      padding:10px 14px;font-size:13px;
      color:#1c8c3e;font-weight:500;margin-bottom:16px;
    }
    .sel-folder i{color:var(--grn)}

    /* ── OPTIONS ───────────────────────────────────────── */
    .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14px;cursor:pointer;border-bottom:.5px solid var(--sep)}
    .opt:last-child{border-bottom:none}
    .opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);cursor:pointer}
    .opt label{cursor:pointer;flex:1}

    /* ── STATUS ────────────────────────────────────────── */
    .status{
      display:flex;align-items:flex-start;gap:8px;
      padding:11px 14px;border-radius:12px;
      font-size:13px;margin-bottom:12px;line-height:1.4;
    }
    .status i{margin-top:1px;flex-shrink:0}
    .status.info{background:rgba(0,122,255,.1);color:#0055b8}
    .status.success{background:rgba(52,199,89,.12);color:#1c8c3e}
    .status.error{background:rgba(255,59,48,.1);color:#c0200f}
    .status.warn{background:rgba(255,149,0,.1);color:#9a4e00}

    /* ── PROGRESS ──────────────────────────────────────── */
    .progress{background:rgba(120,120,128,.16);border-radius:100px;height:4px;overflow:hidden;margin:8px 0 4px}
    .progress-bar{height:100%;background:var(--pri);border-radius:100px;transition:width .3s}

    /* ── LOGIN ─────────────────────────────────────────── */
    .login-card{background:var(--surface);border-radius:16px;padding:28px 20px 24px;text-align:center;margin-top:8px}
    .login-icon{font-size:52px;color:var(--dbx);margin-bottom:14px}
    .login-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
    .login-desc{font-size:14px;color:var(--secondary);line-height:1.5;margin-bottom:22px}

    /* ── SPINNER ───────────────────────────────────────── */
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin .8s linear infinite;display:inline-block}
  </style>
</head>
<body>

<nav class="nav-bar">
  <div class="nav-logo">aly</div>
  <div class="nav-title">alyDoc</div>
  <div class="nav-right">
    <div class="nav-user" id="user-name"></div>
    <div class="nav-version">v4.0</div>
  </div>
</nav>

<!-- SCREEN: Loading -->
<div class="screen active" id="scr-loading">
  <div style="text-align:center;padding:52px 20px;color:var(--secondary)">
    <i class="fas fa-circle-notch spin" style="font-size:32px;color:var(--pri);margin-bottom:14px;display:block"></i>
    <div style="font-size:14px">Wird geladen…</div>
  </div>
</div>

<!-- SCREEN: Login -->
<div class="screen" id="scr-login">
  <div class="login-card">
    <div class="login-icon"><i class="fab fa-dropbox"></i></div>
    <div class="login-title">alyDoc verbinden</div>
    <p class="login-desc">Verbinde deinen Dropbox-Account, um Mails direkt abzulegen.</p>
    <button class="btn btn-primary" onclick="signIn()">
      <i class="fab fa-dropbox"></i> Mit Dropbox verbinden
    </button>
  </div>
</div>

<!-- SCREEN: Main -->
<div class="screen" id="scr-main">

  <div class="section-label">Aktuelle Mail</div>
  <div class="card" id="mail-card">
    <div class="mail-subject-row">
      <div class="mail-subject" id="mail-subject">–</div>
    </div>
    <div class="mail-meta-row">
      <i class="fas fa-person"></i><span id="mail-from">–</span>
    </div>
    <div class="mail-meta-row" style="border-bottom:none">
      <i class="fas fa-calendar"></i><span id="mail-date">–</span>
    </div>
    <div class="att-list" id="att-list" style="display:none">
      <div class="att-header-row">Anhänge</div>
      <div id="att-items"></div>
    </div>
  </div>

  <div class="section-label">Zielordner</div>
  <div class="search-wrap">
    <i class="fas fa-magnifying-glass search-icon"></i>
    <input type="text" id="folder-search" placeholder="Ordner suchen…" oninput="filterFolders(this.value)">
    <button class="clear-search" onclick="clearSearch()" style="display:none" id="clear-btn">✕</button>
  </div>

  <div class="tree-wrap" id="folder-tree">
    <div style="padding:28px;text-align:center;color:var(--secondary);font-size:13px">
      <i class="fas fa-circle-notch spin" style="color:var(--pri)"></i> Ordner werden geladen…
    </div>
  </div>

  <div id="new-folder-wrap">
    <input type="text" id="new-folder-name" placeholder="Neuer Ordner…">
    <button class="btn-icon" onclick="createNewFolder()">
      <i class="fas fa-folder-plus"></i> Anlegen
    </button>
  </div>

  <div class="sel-folder" id="sel-folder" style="display:none">
    <i class="fas fa-folder-open"></i>
    <span id="sel-folder-name">–</span>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="opt">
      <input type="checkbox" id="opt-attachments">
      <label for="opt-attachments">Anhänge separat ablegen</label>
    </div>
  </div>

  <div id="status-box" style="display:none"></div>

  <div id="progress-wrap" style="display:none">
    <div class="progress"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div style="font-size:11px;color:var(--secondary);text-align:center;margin-bottom:10px" id="progress-label"></div>
  </div>

  <button class="btn btn-success" id="btn-ablegen" onclick="ablegen()" disabled>
    <i class="fas fa-inbox"></i> In alyDoc ablegen
  </button>
  <button class="btn btn-tonal" onclick="refreshFolders()">
    <i class="fas fa-arrow-rotate-right"></i> Ordner neu laden
  </button>

</div>

<!-- SCREEN: Success -->
<div class="screen" id="scr-success">
  <div style="text-align:center;padding:44px 20px">
    <i class="fas fa-check-circle" style="font-size:64px;color:var(--grn);margin-bottom:14px;display:block"></i>
    <div style="font-weight:700;font-size:19px;letter-spacing:-.3px;margin-bottom:8px">Abgelegt!</div>
    <div style="font-size:13px;color:var(--secondary);margin-bottom:24px;line-height:1.5" id="success-msg"></div>
    <button class="btn btn-primary" onclick="showScreen('scr-main')">
      <i class="fas fa-inbox"></i> Nächste Mail
    </button>
  </div>
</div>

<script>
// ── CONFIG (Dropbox OAuth 2 + PKCE) ─────────────────────────────────────────
const DROPBOX_APP_KEY='2gz5l15uzq63ppy';
const API_BASE='https://api.dropboxapi.com/2';
const CONTENT_BASE='https://content.dropboxapi.com/2';

// ── STATE ───────────────────────────────────────────────────────────────────
// folders: Liste {path, name, displayName, parentPath}
// path = Dropbox-Pfad ('/Alysee_GmbH/...' oder '' für Root)
let folders=[], expandedIds={'':true}, selectedFolderPath=null, selectedFolderName='';
let mailItem=null;
let accessToken=null, refreshToken=null, tokenExpiresAt=0;
// Bei Dropbox-Business: Team-Namespace-ID, damit list_folder/upload Team-Root statt Member-Folder sehen
let rootNsId=null;

// ── OFFICE.JS INIT ───────────────────────────────────────────────────────────
Office.onReady(info=>{
  if(info.host===Office.HostType.Outlook){
    mailItem=Office.context.mailbox.item;
    loadMailInfo();
    try{
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged,()=>{
        mailItem=Office.context.mailbox.item;
        refreshMailInfo();
      });
    }catch(e){console.warn('ItemChanged handler not supported:',e);}
  }
  initAuth();
});

// ── MAIL INFO ────────────────────────────────────────────────────────────────
function loadMailInfo(){
  if(!mailItem)return;
  document.getElementById('mail-subject').textContent=mailItem.subject||'(kein Betreff)';
  const from=mailItem.from;
  document.getElementById('mail-from').textContent=from?(from.displayName||from.emailAddress):'–';
  const d=mailItem.dateTimeCreated?new Date(mailItem.dateTimeCreated):new Date();
  document.getElementById('mail-date').textContent=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const atts=mailItem.attachments||[];
  if(atts.length>0){
    const list=document.getElementById('att-items');
    atts.forEach(a=>{
      const icon=a.attachmentType==='item'?'fa-envelope':'fa-paperclip';
      list.innerHTML+=`<div class="att-item"><i class="fas ${icon}"></i><span>${a.name}</span><span style="margin-left:auto;font-size:10px;color:#aaa">${formatSize(a.size)}</span></div>`;
    });
    document.getElementById('att-list').style.display='block';
  }
}

function refreshMailInfo(){
  mailItem=Office.context.mailbox.item;
  if(!mailItem)return;
  document.getElementById('mail-subject').textContent=mailItem.subject||'(kein Betreff)';
  const from=mailItem.from;
  document.getElementById('mail-from').textContent=from?(from.displayName||from.emailAddress):'–';
  const d=mailItem.dateTimeCreated?new Date(mailItem.dateTimeCreated):new Date();
  document.getElementById('mail-date').textContent=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const list=document.getElementById('att-items');
  list.innerHTML='';
  const atts=mailItem.attachments||[];
  if(atts.length>0){
    atts.forEach(a=>{
      const icon=a.attachmentType==='item'?'fa-envelope':'fa-paperclip';
      list.innerHTML+=`<div class="att-item"><i class="fas ${icon}"></i><span>${a.name}</span><span style="margin-left:auto;font-size:10px;color:#aaa">${formatSize(a.size)}</span></div>`;
    });
    document.getElementById('att-list').style.display='block';
  } else {
    document.getElementById('att-list').style.display='none';
  }
}

function formatSize(bytes){
  if(!bytes)return'';
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return Math.round(bytes/1024)+'KB';
  return(bytes/(1024*1024)).toFixed(1)+'MB';
}

// ── AUTH (Dropbox) ───────────────────────────────────────────────────────────
async function initAuth(){
  // Token aus localStorage wiederherstellen
  try{
    accessToken=localStorage.getItem('alydoc_dbx_token')||null;
    refreshToken=localStorage.getItem('alydoc_dbx_refresh')||null;
    tokenExpiresAt=parseInt(localStorage.getItem('alydoc_dbx_expires')||'0');
    rootNsId=localStorage.getItem('alydoc_dbx_root_ns')||null;
    const user=localStorage.getItem('alydoc_dbx_user');
    if(user)document.getElementById('user-name').textContent=user;
  }catch{}

  if(!accessToken){
    showScreen('scr-login');
    return;
  }
  showScreen('scr-main');
  try{
    const lastPath=localStorage.getItem('alydoc_lastFolder');
    const lastName=localStorage.getItem('alydoc_lastFolderName');
    if(lastPath!==null&&lastName)selectFolder(lastPath,lastName);
  }catch{}
  // ZUERST UserInfo holen, damit rootNsId gesetzt ist BEVOR Folder-Calls rausgehen
  try{
    await fetchUserInfo();
  }catch{
    const ok=await tryRefreshToken();
    if(!ok){clearAuth();showScreen('scr-login');return;}
    try{await fetchUserInfo();}catch{clearAuth();showScreen('scr-login');return;}
  }
  loadFolders();
}

async function fetchUserInfo(){
  const r=await fetch(API_BASE+'/users/get_current_account',{
    method:'POST',
    headers:{'Authorization':'Bearer '+accessToken}
  });
  if(!r.ok)throw new Error('User-Info fehlgeschlagen: '+r.status);
  const data=await r.json();
  const name=(data.name&&data.name.display_name)||data.email||'';
  document.getElementById('user-name').textContent=name;
  try{localStorage.setItem('alydoc_dbx_user',name);}catch{}
  // Team-Account-Erkennung: bei Dropbox Business root_info.root_namespace_id != home_namespace_id
  if(data.root_info&&data.root_info.root_namespace_id){
    rootNsId=String(data.root_info.root_namespace_id);
    try{localStorage.setItem('alydoc_dbx_root_ns',rootNsId);}catch{}
  } else {
    rootNsId=null;
    try{localStorage.removeItem('alydoc_dbx_root_ns');}catch{}
  }
  return data;
}

async function tryRefreshToken(){
  if(!refreshToken)return false;
  try{
    const body=new URLSearchParams();
    body.set('grant_type','refresh_token');
    body.set('refresh_token',refreshToken);
    body.set('client_id',DROPBOX_APP_KEY);
    const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:body.toString()
    });
    if(!r.ok)return false;
    const data=await r.json();
    if(!data.access_token)return false;
    accessToken=data.access_token;
    tokenExpiresAt=Date.now()+(data.expires_in||14400)*1000;
    try{
      localStorage.setItem('alydoc_dbx_token',accessToken);
      localStorage.setItem('alydoc_dbx_expires',tokenExpiresAt.toString());
    }catch{}
    return true;
  }catch{return false;}
}

async function ensureToken(){
  // Wenn weniger als 60s Restzeit → refreshen
  if(tokenExpiresAt&&tokenExpiresAt-Date.now()<60000){
    await tryRefreshToken();
  }
  return accessToken;
}

function clearAuth(){
  accessToken=null;refreshToken=null;tokenExpiresAt=0;rootNsId=null;
  try{
    localStorage.removeItem('alydoc_dbx_token');
    localStorage.removeItem('alydoc_dbx_refresh');
    localStorage.removeItem('alydoc_dbx_expires');
    localStorage.removeItem('alydoc_dbx_user');
    localStorage.removeItem('alydoc_dbx_root_ns');
  }catch{}
}

function signIn(){
  const baseUrl=window.location.href.replace(/\/[^/]*$/,'/');
  const authUrl=baseUrl+'auth.html';

  if(Office.context.ui&&Office.context.ui.displayDialogAsync){
    Office.context.ui.displayDialogAsync(authUrl,{height:65,width:45,promptBeforeOpen:false},result=>{
      if(result.status===Office.AsyncResultStatus.Failed){
        showStatus('Dialog konnte nicht geöffnet werden: '+result.error.message,'error');
        return;
      }
      const dialog=result.value;
      dialog.addEventHandler(Office.EventType.DialogMessageReceived,arg=>{
        dialog.close();
        try{
          const msg=JSON.parse(arg.message);
          if(msg.type==='auth_success'&&msg.token){
            onTokenReceived(msg.token,msg.refresh,msg.expires_in);
          } else {
            showStatus('Anmeldung fehlgeschlagen: '+(msg.error||'unbekannt'),'error');
          }
        }catch(e){
          showStatus('Anmeldung fehlgeschlagen: '+e.message,'error');
        }
      });
      dialog.addEventHandler(Office.EventType.DialogEventReceived,arg=>{
        if(arg.error===12006)console.log('Dialog vom Nutzer geschlossen');
      });
    });
  } else {
    // Fallback: Outside Outlook → window.open
    const popup=window.open(authUrl,'alydoc_auth','width=480,height=650');
    const onMsg=(e)=>{
      try{
        const msg=typeof e.data==='string'?JSON.parse(e.data):e.data;
        if(msg&&msg.type==='auth_success'&&msg.token){
          window.removeEventListener('message',onMsg);
          if(popup)popup.close();
          onTokenReceived(msg.token,msg.refresh,msg.expires_in);
        }
      }catch{}
    };
    window.addEventListener('message',onMsg);
  }
}

async function onTokenReceived(token,refresh,expiresIn){
  accessToken=token;
  refreshToken=refresh||null;
  tokenExpiresAt=Date.now()+(parseInt(expiresIn||14400))*1000;
  try{
    localStorage.setItem('alydoc_dbx_token',accessToken);
    if(refreshToken)localStorage.setItem('alydoc_dbx_refresh',refreshToken);
    localStorage.setItem('alydoc_dbx_expires',tokenExpiresAt.toString());
  }catch{}
  showScreen('scr-main');
  // ZUERST UserInfo (setzt rootNsId für Team-Accounts), DANN Folder laden
  try{await fetchUserInfo();}catch{}
  loadFolders();
}

// ── DROPBOX API HELPERS ──────────────────────────────────────────────────────
function pathRootHeader(){
  // Bei Team-Accounts: Header zwingt API auf Team-Root statt Member-Folder
  return rootNsId ? {'Dropbox-API-Path-Root':JSON.stringify({'.tag':'namespace_id','namespace_id':rootNsId})} : {};
}

async function dbxRpc(path,arg){
  await ensureToken();
  const r=await fetch(API_BASE+path,{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+accessToken,
      'Content-Type':'application/json',
      ...pathRootHeader()
    },
    body:JSON.stringify(arg||null)
  });
  if(r.status===401){
    if(await tryRefreshToken()){
      return dbxRpc(path,arg);
    }
    throw new Error('Nicht authentifiziert (401)');
  }
  const text=await r.text();
  let data; try{data=text?JSON.parse(text):{};}catch{data={raw:text};}
  if(!r.ok)throw new Error('Dropbox '+path+' '+r.status+': '+(data.error_summary||text));
  return data;
}

async function dbxUpload(path,bytesOrString,mode){
  await ensureToken();
  const arg={path:path,mode:mode||'add',autorename:true,mute:false,strict_conflict:false};
  let body=bytesOrString;
  if(typeof body==='string')body=new TextEncoder().encode(body);
  const r=await fetch(CONTENT_BASE+'/files/upload',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+accessToken,
      'Dropbox-API-Arg':JSON.stringify(arg),
      'Content-Type':'application/octet-stream',
      ...pathRootHeader()
    },
    body:body
  });
  if(r.status===401){
    if(await tryRefreshToken())return dbxUpload(path,bytesOrString,mode);
    throw new Error('Nicht authentifiziert (401)');
  }
  const text=await r.text();
  let data; try{data=text?JSON.parse(text):{};}catch{data={raw:text};}
  if(!r.ok)throw new Error('Upload '+r.status+': '+(data.error_summary||text));
  return data;
}

// ── FOLDER LOADING (Lazy) ────────────────────────────────────────────────────
let loadedParents=new Set();

async function loadFolders(){
  try{
    folders=[];
    loadedParents=new Set();
    const kids=await listFolders('');
    kids.forEach(f=>{
      folders.push({path:f.path_lower,displayPath:f.path_display,name:f.name,displayName:f.name,parentPath:''});
    });
    loadedParents.add('');
    renderTree();
  }catch(e){
    document.getElementById('folder-tree').innerHTML='<div style="padding:12px;color:var(--red);font-size:12px"><i class="fas fa-exclamation-triangle"></i> Fehler: '+e.message+'</div>';
  }
}

async function loadChildren(parentPath){
  if(loadedParents.has(parentPath))return;
  loadedParents.add(parentPath);
  const parent=folders.find(f=>f.path===parentPath);
  const parentDisplay=parent?parent.displayName:'';
  const kids=await listFolders(parentPath);
  kids.forEach(f=>{
    if(folders.some(x=>x.path===f.path_lower))return;
    const displayName=parentDisplay?parentDisplay+' / '+f.name:f.name;
    folders.push({path:f.path_lower,displayPath:f.path_display,name:f.name,displayName,parentPath});
  });
}

async function listFolders(parentPath){
  // parentPath: '' für Root, sonst Dropbox-Pfad mit führendem '/'
  try{
    const out=[];
    let res=await dbxRpc('/files/list_folder',{path:parentPath,recursive:false,include_non_downloadable_files:false});
    while(true){
      for(const e of (res.entries||[])){
        if(e['.tag']==='folder')out.push(e);
      }
      if(!res.has_more)break;
      res=await dbxRpc('/files/list_folder/continue',{cursor:res.cursor});
    }
    out.sort((a,b)=>a.name.localeCompare(b.name,'de'));
    return out;
  }catch(e){
    console.warn('listFolders failed',parentPath,e);
    return[];
  }
}

function refreshFolders(){
  document.getElementById('folder-tree').innerHTML='<div style="padding:28px;text-align:center;color:var(--mut);font-size:13px"><i class="fas fa-circle-notch spin" style="color:var(--pri)"></i> Ordner werden geladen…</div>';
  folders=[];expandedIds={'':true};loadedParents=new Set();
  loadFolders();
}

// ── TREE RENDERING ────────────────────────────────────────────────────────────
function renderTree(search){
  if(search===undefined)search=document.getElementById('folder-search').value||'';
  const tree=document.getElementById('folder-tree');
  const searchLow=search.toLowerCase().trim();

  const childrenOf=pp=>folders.filter(f=>f.parentPath===pp);

  const matchesSearch=f=>{
    if(!searchLow)return true;
    return f.displayName.toLowerCase().includes(searchLow)||f.name.toLowerCase().includes(searchLow);
  };
  const hasMatchingDesc=f=>{
    if(matchesSearch(f))return true;
    return childrenOf(f.path).some(c=>hasMatchingDesc(c));
  };

  let html='';
  const rootExp=expandedIds['']!==false;
  const rootSel=selectedFolderPath==='';
  html+=`<div class="tree-item ${rootSel?'selected':''}" onclick="folderClick('','Dropbox')" style="font-weight:500;cursor:pointer">
    <span class="chevron"><i class="fas fa-chevron-${rootExp?'down':'right'}"></i></span>
    <i class="fab fa-dropbox"></i>
    <span class="name">Dropbox (Root)</span>
  </div>`;

  function renderNode(parentPath, depth){
    const kids=childrenOf(parentPath);
    kids.forEach(f=>{
      if(searchLow&&!hasMatchingDesc(f))return;
      const myKids=childrenOf(f.path);
      const hasKids=myKids.length>0;
      const mayHaveKids=hasKids||!loadedParents.has(f.path);
      const isExp=expandedIds[f.path];
      const isSel=selectedFolderPath===f.path;
      const pl=10+depth*18;
      const dn=f.displayName.replace(/'/g,"\\'");
      const pp=f.path.replace(/'/g,"\\'");
      html+=`<div class="tree-item ${isSel?'selected':''}" style="padding-left:${pl}px" onclick="folderClick('${pp}','${dn}')">
        ${mayHaveKids?`<i class="fas fa-chevron-${isExp?'down':'right'}" style="width:14px;font-size:10px;flex-shrink:0"></i>`:'<span style="width:14px;flex-shrink:0"></span>'}
        <i class="fas fa-folder${isExp?'-open':''}"></i>
        <span class="name">${f.name}</span>
        ${isSel?'<i class="fas fa-check-circle" style="color:var(--blue);font-size:11px"></i>':''}
      </div>`;
      if(isExp)renderNode(f.path,depth+1);
    });
  }

  if(rootExp)renderNode('',1);
  tree.innerHTML=html;
}

async function folderClick(path,name){
  selectedFolderPath=path;
  selectedFolderName=name;
  try{localStorage.setItem('alydoc_lastFolder',path);localStorage.setItem('alydoc_lastFolderName',name);}catch{}
  document.getElementById('sel-folder').style.display='flex';
  document.getElementById('sel-folder-name').textContent=name;
  document.getElementById('btn-ablegen').disabled=false;
  if(expandedIds[path]){
    expandedIds[path]=false;
  } else {
    expandedIds[path]=true;
    if(!loadedParents.has(path))await loadChildren(path);
  }
  renderTree();
}

async function toggleExpand(path){
  expandedIds[path]=!expandedIds[path];
  if(expandedIds[path]&&!loadedParents.has(path))await loadChildren(path);
  renderTree();
}

function selectFolder(path,name){
  selectedFolderPath=path;
  selectedFolderName=name;
  try{localStorage.setItem('alydoc_lastFolder',path);localStorage.setItem('alydoc_lastFolderName',name);}catch{}
  document.getElementById('sel-folder').style.display='flex';
  document.getElementById('sel-folder-name').textContent=name;
  document.getElementById('btn-ablegen').disabled=false;
  renderTree();
}

function filterFolders(val){
  document.getElementById('clear-btn').style.display=val?'block':'none';
  renderTree(val);
}
function clearSearch(){
  document.getElementById('folder-search').value='';
  document.getElementById('clear-btn').style.display='none';
  renderTree('');
}

async function createNewFolder(){
  const input=document.getElementById('new-folder-name');
  const name=input.value.trim();
  if(!name){input.focus();return;}
  const parentPath=selectedFolderPath===null?'':selectedFolderPath;
  try{
    const newPath=parentPath+'/'+name;
    const r=await dbxRpc('/files/create_folder_v2',{path:newPath,autorename:false});
    const meta=r.metadata;
    const parentFolder=folders.find(f=>f.path===parentPath);
    const displayName=parentFolder?(parentFolder.displayName+' / '+meta.name):meta.name;
    folders.push({path:meta.path_lower,displayPath:meta.path_display,name:meta.name,displayName,parentPath});
    expandedIds[parentPath]=true;
    selectFolder(meta.path_lower,displayName);
    input.value='';
    renderTree(document.getElementById('folder-search').value);
    showStatus('Ordner "'+meta.name+'" erstellt','success');
  }catch(e){
    showStatus('Ordner konnte nicht erstellt werden: '+e.message,'error');
  }
}

// ── ABLEGEN ───────────────────────────────────────────────────────────────────
async function ablegen(){
  if(selectedFolderPath===null||!mailItem)return;
  const saveAtts=document.getElementById('opt-attachments').checked;

  document.getElementById('btn-ablegen').disabled=true;
  document.getElementById('progress-wrap').style.display='block';
  showStatus('Mail wird abgelegt…','info');

  try{
    setProgress(10,'Mail-Inhalt und Anhänge werden gelesen…');
    const emlContent=await getEmlContent();

    setProgress(40,'Token wird geprüft…');
    if(!accessToken)throw new Error('Kein Dropbox-Token! Bitte Panel schließen und neu öffnen.');
    await ensureToken();

    setProgress(50,'Wird in Dropbox gespeichert…');
    const subject=mailItem.subject||'Mail';
    const created=mailItem.dateTimeCreated?new Date(mailItem.dateTimeCreated):new Date();
    const dateStr=created.toISOString().slice(0,10).replace(/-/g,'_');
    const safeSubject=subject.replace(/[/\\:*?"<>|]/g,'_').substring(0,60);
    const fileName=dateStr+'_'+safeSubject+'.eml';
    const targetPath=(selectedFolderPath||'')+'/'+fileName;

    const uploadResult=await dbxUpload(targetPath,emlContent);
    setProgress(70,'EML gespeichert: '+(uploadResult.path_display||targetPath));

    if(saveAtts&&mailItem.attachments&&mailItem.attachments.length>0){
      setProgress(72,'Anhänge werden separat gespeichert…');
      const atts=mailItem.attachments;
      for(let i=0;i<atts.length;i++){
        const att=atts[i];
        setProgress(72+Math.round((i/atts.length)*18),'Anhang: '+att.name);
        await saveAttachment(att,selectedFolderPath||'');
      }
    }

    setProgress(100,'Fertig!');

    const attCount=mailItem.attachments?mailItem.attachments.length:0;
    let msg='✓ Abgelegt in: '+selectedFolderName;
    msg+='<br><small>Datei: '+(uploadResult.name||fileName)+'</small>';
    msg+='<br><small>Pfad: '+(uploadResult.path_display||targetPath)+'</small>';
    if(attCount)msg+='<br>'+attCount+' Anhang/Anhänge';
    showStatus(msg,'success');

    document.getElementById('btn-ablegen').disabled=false;
    document.getElementById('progress-wrap').style.display='none';
    refreshMailInfo();

  }catch(e){
    console.error(e);
    showStatus('Fehler: '+e.message,'error');
    document.getElementById('btn-ablegen').disabled=false;
    document.getElementById('progress-wrap').style.display='none';
  }
}

async function getEmlContent(){
  const from=mailItem.from;
  const to=mailItem.to||[];
  const cc=mailItem.cc||[];
  const subject=mailItem.subject||'';
  const date=mailItem.dateTimeCreated?new Date(mailItem.dateTimeCreated).toUTCString():new Date().toUTCString();
  const boundary='__alyDoc_'+Date.now()+'__';
  const mixedBoundary='__alyDoc_mixed_'+Date.now()+'__';

  const htmlBody=await new Promise((resolve,reject)=>{
    mailItem.body.getAsync(Office.CoercionType.Html,result=>{
      if(result.status===Office.AsyncResultStatus.Failed){reject(new Error(result.error.message));return;}
      resolve(result.value||'');
    });
  });

  const textBody=await new Promise((resolve)=>{
    mailItem.body.getAsync(Office.CoercionType.Text,result=>{
      if(result.status===Office.AsyncResultStatus.Failed){resolve('');return;}
      resolve(result.value||'');
    });
  });

  const attachments=[];
  const atts=mailItem.attachments||[];
  for(const att of atts){
    try{
      const content=await new Promise((resolve,reject)=>{
        mailItem.getAttachmentContentAsync(att.id,r=>{
          if(r.status===Office.AsyncResultStatus.Failed){reject(new Error(r.error.message));return;}
          resolve(r.value);
        });
      });
      let base64Data='';
      if(content.format===Office.AttachmentContentFormat.Base64){
        base64Data=content.content;
      } else {
        base64Data=btoa(unescape(encodeURIComponent(content.content)));
      }
      attachments.push({name:att.name,mimeType:att.contentType||'application/octet-stream',base64:base64Data});
    }catch(e){console.warn('Anhang konnte nicht geladen werden:',att.name,e);}
  }

  function encodeHeader(str){
    if(/^[\x20-\x7E]*$/.test(str))return str;
    return '=?UTF-8?B?'+btoa(unescape(encodeURIComponent(str)))+'?=';
  }
  function formatAddr(r){return(r.displayName?encodeHeader(r.displayName)+' ':'')+' <'+(r.emailAddress||'')+'>';}

  let eml='From: '+(from?formatAddr(from):'')+'\r\n';
  eml+='To: '+to.map(formatAddr).join(', ')+'\r\n';
  if(cc.length)eml+='Cc: '+cc.map(formatAddr).join(', ')+'\r\n';
  eml+='Subject: '+encodeHeader(subject)+'\r\n';
  eml+='Date: '+date+'\r\n';
  eml+='MIME-Version: 1.0\r\n';

  if(attachments.length>0){
    eml+='Content-Type: multipart/mixed; boundary="'+mixedBoundary+'"\r\n\r\n';
    eml+='--'+mixedBoundary+'\r\n';
    eml+='Content-Type: multipart/alternative; boundary="'+boundary+'"\r\n\r\n';
    eml+='--'+boundary+'\r\n';
    eml+='Content-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
    eml+=btoa(unescape(encodeURIComponent(textBody)))+'\r\n';
    eml+='--'+boundary+'\r\n';
    eml+='Content-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
    eml+=btoa(unescape(encodeURIComponent(htmlBody)))+'\r\n';
    eml+='--'+boundary+'--\r\n';
    for(const att of attachments){
      eml+='\r\n--'+mixedBoundary+'\r\n';
      eml+='Content-Type: '+att.mimeType+'; name="'+encodeHeader(att.name)+'"\r\n';
      eml+='Content-Disposition: attachment; filename="'+encodeHeader(att.name)+'"\r\n';
      eml+='Content-Transfer-Encoding: base64\r\n\r\n';
      const b64=att.base64;
      for(let i=0;i<b64.length;i+=76){eml+=b64.substring(i,i+76)+'\r\n';}
    }
    eml+='--'+mixedBoundary+'--\r\n';
  } else {
    eml+='Content-Type: multipart/alternative; boundary="'+boundary+'"\r\n\r\n';
    eml+='--'+boundary+'\r\n';
    eml+='Content-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
    eml+=btoa(unescape(encodeURIComponent(textBody)))+'\r\n';
    eml+='--'+boundary+'\r\n';
    eml+='Content-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n';
    eml+=btoa(unescape(encodeURIComponent(htmlBody)))+'\r\n';
    eml+='--'+boundary+'--\r\n';
  }

  return eml;
}

async function saveAttachment(att,folderPath){
  return new Promise((resolve)=>{
    mailItem.getAttachmentContentAsync(att.id,async result=>{
      if(result.status===Office.AsyncResultStatus.Failed){resolve();return;}
      try{
        const content=result.value;
        let data;
        if(content.format===Office.AttachmentContentFormat.Base64){
          data=Uint8Array.from(atob(content.content),c=>c.charCodeAt(0));
        } else {
          data=new TextEncoder().encode(content.content);
        }
        const safeName=att.name.replace(/[/\\:*?"<>|]/g,'_');
        await dbxUpload((folderPath||'')+'/'+safeName,data);
        resolve();
      }catch(e){console.warn('Anhang Fehler:',e);resolve();}
    });
  });
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='scr-main'){
    document.getElementById('status-box').style.display='none';
    document.getElementById('progress-wrap').style.display='none';
    document.getElementById('btn-ablegen').disabled=(selectedFolderPath===null);
  }
}

function showStatus(msg,type){
  const icons={info:'fa-info-circle',success:'fa-check-circle',error:'fa-exclamation-circle',warn:'fa-exclamation-triangle'};
  const box=document.getElementById('status-box');
  box.style.display='flex';
  box.className='status '+type;
  box.innerHTML=`<i class="fas ${icons[type]||'fa-info-circle'}"></i><span>${msg}</span>`;
}

function setProgress(pct,label){
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-label').textContent=label;
}
