  <script>
    // BUG FIX 1: Robuste gapi/gis Initialisierung mit Promise-basiertem Warten
    let _gapiReady = false;
    let _gisReady = false;
    let _gapiResolvers = [];
    let _gisResolvers = [];

    function gapiLoaded() {
      gapi.load('client', () => {
        _gapiReady = true;
        _gapiResolvers.forEach(r => r());
        _gapiResolvers = [];
        window.dispatchEvent(new Event('gapiOk'));
      });
    }
    function gisLoaded() {
      _gisReady = true;
      _gisResolvers.forEach(r => r());
      _gisResolvers = [];
      window.dispatchEvent(new Event('gisOk'));
    }
    function waitGapi() {
      if (_gapiReady) return Promise.resolve();
      return new Promise(r => _gapiResolvers.push(r));
    }
    function waitGis() {
      if (_gisReady) return Promise.resolve();
      return new Promise(r => _gisResolvers.push(r));
    }
  </script>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;

const fd=s=>s?new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const fdt=s=>s?new Date(s).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
const fs=b=>{if(!b)return'–';b=+b;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';};
function mi(mt='',nm=''){
  if(mt==='application/vnd.google-apps.folder')return{i:'fa-folder',c:'#F7941D',l:'Ordner'};
  if(mt.includes('pdf'))return{i:'fa-file-pdf',c:'#CC0000',l:'PDF'};
  if(mt.includes('word')||mt.includes('wordprocessing'))return{i:'fa-file-word',c:'#2B579A',l:'Word'};
  if(mt.includes('sheet')||mt.includes('excel'))return{i:'fa-file-excel',c:'#217346',l:'Excel'};
  if(mt.includes('presentation')||mt.includes('powerpoint'))return{i:'fa-file-powerpoint',c:'#D24726',l:'PPT'};
  if(mt.includes('image'))return{i:'fa-file-image',c:'#8E44AD',l:'Bild'};
  if(mt.includes('video'))return{i:'fa-file-video',c:'#E74C3C',l:'Video'};
  if(mt.includes('zip')||mt.includes('archive'))return{i:'fa-file-zipper',c:'#F39C12',l:'Archiv'};
  if(mt.includes('email')||nm.endsWith('.eml')||nm.endsWith('.msg'))return{i:'fa-envelope',c:'#3498DB',l:'E-Mail'};
  const n2=nm.toLowerCase();
  if(['.stl','.3mf','.fbx','.obj','.glb','.gltf'].some(e=>n2.endsWith(e)))return{i:'fa-cube',c:'#7C3AED',l:'3D-Modell'};
  if(['.step','.stp','.3dm','.iges','.igs'].some(e=>n2.endsWith(e)))return{i:'fa-cube',c:'#059669',l:'CAD-3D'};
  if(['.dxf','.dwg'].some(e=>n2.endsWith(e)))return{i:'fa-drafting-compass',c:'#0EA5E9',l:'CAD-Zeichnung'};
  if(mt.startsWith('application/vnd.google-apps'))return{i:'fa-file-circle-check',c:'#4285F4',l:'Google'};
  return{i:'fa-file',c:'#7F8C8D',l:'Datei'};
}

const DR={
  async init(cid,key){
    await gapi.client.init({
      apiKey:key,
      discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
    });
  },
  mkT(cid,cb){
    return google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
      callback:cb
    });
  },
  async ls(fid='root'){
    const r=await gapi.client.drive.files.list({
      q:`'${fid}' in parents and trashed=false`,
      fields:'files(id,name,mimeType,modifiedTime,size,webViewLink)',
      orderBy:'folder,name',
      pageSize:300
    });
    return r.result.files||[];
  },
  async find(q){
    const e=q.replace(/'/g,"\\'");
    const r=await gapi.client.drive.files.list({
      q:`(name contains '${e}' or fullText contains '${e}') and trashed=false`,
      fields:'files(id,name,mimeType,modifiedTime,size,webViewLink,parents)',
      pageSize:100
    });
    return r.result.files||[];
  },
  async mkdir(name,par='root'){
    const r=await gapi.client.drive.files.create({
      resource:{name,mimeType:'application/vnd.google-apps.folder',parents:[par]},
      fields:'id,name,mimeType'
    });
    return r.result;
  },
  async up(file,par,onP){
    const tok=gapi.client.getToken().access_token,fm=new FormData();
    fm.append('metadata',new Blob([JSON.stringify({name:file.name,parents:[par]})],{type:'application/json'}));
    fm.append('file',file);
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size');
      x.setRequestHeader('Authorization','Bearer '+tok);
      x.upload.onprogress=e=>e.lengthComputable&&onP&&onP(Math.round(e.loaded/e.total*100));
      x.onload=()=>x.status===200?res(JSON.parse(x.responseText)):rej(new Error(x.statusText));
      x.onerror=()=>rej(new Error('Fehler'));
      x.send(fm);
    });
  },
  async del(id){await gapi.client.drive.files.delete({fileId:id})},
  async ren(id,name){
    const r=await gapi.client.drive.files.update({fileId:id,resource:{name},fields:'id,name'});
    return r.result;
  },
  prev:id=>`https://drive.google.com/file/d/${id}/preview`,
  async me(){
    try{
      const r=await gapi.client.request({path:'https://www.googleapis.com/oauth2/v3/userinfo'});
      return r.result;
    }catch{return null;}
  },
  WF:'.alysee_wf.json',
  async loadWF(){
    try{
      const r=await gapi.client.drive.files.list({q:`name='${DR.WF}' and trashed=false`,fields:'files(id)',pageSize:1});
      if(r.result.files?.length){
        const c=await gapi.client.drive.files.get({fileId:r.result.files[0].id,alt:'media'});
        return typeof c.result==='string'?JSON.parse(c.result):c.result;
      }
    }catch{}
    return{tasks:[]};
  },
  async saveWF(data){
    const j=JSON.stringify(data),tok=gapi.client.getToken()?.access_token;
    if(!tok)return;
    try{
      const r=await gapi.client.drive.files.list({q:`name='${DR.WF}' and trashed=false`,fields:'files(id)',pageSize:1});
      const s=(url,m)=>{
        const x=new XMLHttpRequest();
        x.open(m,url);
        x.setRequestHeader('Authorization','Bearer '+tok);
        x.setRequestHeader('Content-Type','application/json');
        x.send(j);
      };
      if(r.result.files?.length)
        s(`https://www.googleapis.com/upload/drive/v3/files/${r.result.files[0].id}?uploadType=media`,'PATCH');
      else{
        const f=new FormData();
        f.append('metadata',new Blob([JSON.stringify({name:DR.WF})],{type:'application/json'}));
        f.append('file',new Blob([j],{type:'application/json'}));
        const x=new XMLHttpRequest();
        x.open('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');
        x.setRequestHeader('Authorization','Bearer '+tok);
        x.send(f);
      }
    }catch(e){console.warn(e);}
  }
};

/* Toast */
function ToastProv({children}){
  const [ts,setTs]=useState([]);
  const add=useCallback((msg,t='i')=>{const id=Date.now();setTs(p=>[...p,{id,msg,t}]);setTimeout(()=>setTs(p=>p.filter(x=>x.id!==id)),3200);},[]);
  return <TC.Provider value={add}>{children}<div className="toast-c">{ts.map(x=><div key={x.id} className={`toast ${x.t}`}><i className={`fas ${x.t==='s'?'fa-check-circle':x.t==='e'?'fa-times-circle':'fa-info-circle'}`}/>{x.msg}</div>)}</div></TC.Provider>;
}

/* 3D Canvas Viewer */
function ThreeDPrev({file}){
  const cvRef=useRef(null);
  const [ready,setReady]=useState(false);

    let animId,cancelled=false,dragging=false,lastX=0,lastY=0,yRot=0.5,xRot=0.38,zoom=1.0,autoRot=true;

    if(!cv)return;
    const ctx=cv.getContext('2d');
    const nm=file.name.toLowerCase();
    const polys=[];
    const addBox=(cx,cy,cz,sw,sh,sd,col)=>{
      const hw=sw/2,hh=sh/2,hd=sd/2;
      const v=[[cx-hw,cy-hh,cz-hd],[cx+hw,cy-hh,cz-hd],[cx+hw,cy+hh,cz-hd],[cx-hw,cy+hh,cz-hd],
                [cx-hw,cy-hh,cz+hd],[cx+hw,cy-hh,cz+hd],[cx+hw,cy+hh,cz+hd],[cx-hw,cy+hh,cz+hd]];
      [[v[0],v[1],v[2],v[3],[0,0,-1]],[v[7],v[6],v[5],v[4],[0,0,1]],
       [v[0],v[4],v[7],v[3],[-1,0,0]],[v[1],v[2],v[6],v[5],[1,0,0]],
       [v[3],v[2],v[6],v[7],[0,1,0]],[v[0],v[1],v[5],v[4],[0,-1,0]]
      ].forEach(([a,b,c,d,n])=>polys.push({vs:[a,b,c,d],n,col}));
    };
    if(nm.includes('stuhl')||nm.includes('chair')||nm.endsWith('.stl')){
      addBox(0,0.50,0,0.58,0.09,0.58,'#3A4A5A');addBox(0,0.87,-0.27,0.54,0.70,0.09,'#3A4A5A');

      addBox(-0.93,0.54,0.02,0.18,0.44,0.72,'#2D3B4E');addBox(0.93,0.54,0.02,0.18,0.44,0.72,'#2D3B4E');
      [-0.57,0,0.57].forEach(x=>addBox(x,0.54,0.06,0.54,0.18,0.58,'#4A5E72'));
      [[-0.81,-0.30],[0.81,-0.30],[-0.81,0.30],[0.81,0.30]].forEach(([ax,az])=>addBox(ax,0.07,az,0.07,0.14,0.07,'#9A9A9A'));
    }else if(nm.endsWith('.fbx')||nm.includes('raum')||nm.includes('plan')){
      addBox(0,0.02,0,3.0,0.04,2.4,'#C8CDD8');addBox(-1.46,0.50,0,0.08,1.0,2.4,'#E0E4EC');addBox(1.46,0.50,0,0.08,1.0,2.4,'#E0E4EC');
      addBox(0,0.50,-1.16,3.0,1.0,0.08,'#E0E4EC');addBox(0,0.50,1.16,3.0,1.0,0.08,'#E0E4EC');
      addBox(-0.7,0.42,0.3,0.58,0.10,0.58,'#3A4A5A');addBox(0.4,0.77,0.3,2.0,0.06,0.92,'#8B7355');
    }else{
      addBox(0,0.42,0,1.82,0.82,0.46,'#8B7355');addBox(-0.46,0.42,0.23,0.84,0.76,0.01,'#5C4A2A');
      addBox(0.46,0.42,0.23,0.84,0.76,0.01,'#5C4A2A');addBox(0,0.42,0.23,0.05,0.76,0.01,'#5C4A2A');
      addBox(0,0.815,0,1.84,0.012,0.48,'#4A3820');
      [[-0.22,0.42],[0.22,0.42]].forEach(([px])=>addBox(px,0.42,0.235,0.04,0.04,0.015,'#AAAAAA'));
      [[-0.82,-0.17],[0.82,-0.17],[-0.82,0.17],[0.82,0.17]].forEach(([ax,az])=>addBox(ax,0.045,az,0.055,0.09,0.055,'#9A9A9A'));
    }
    const ld=[0.577,0.577,-0.577];
    const proj=(vx,vy,vz,yr,xr,zm,w,h)=>{
      const cy=Math.cos(yr),sy=Math.sin(yr);
      const rx=vx*cy+vz*sy,rz0=-vx*sy+vz*cy;
      const cx=Math.cos(xr),sx=Math.sin(xr);
      const ry=vy*cx-rz0*sx,rz=vy*sx+rz0*cx;
      const sc=Math.min(w,h)*0.38*zm/(rz+4.5);
      return{x:rx*sc+w/2,y:-ry*sc+h*0.52,z:rz};
    };
    const lit=(n,yr,xr,base)=>{
      const cy=Math.cos(yr),sy=Math.sin(yr);
      const nx0=n[0]*cy+n[2]*sy,nz0=-n[0]*sy+n[2]*cy;
      const cx=Math.cos(xr),sx=Math.sin(xr);
      const ny=n[1]*cx-nz0*sx,nz=n[1]*sx+nz0*cx;
      const dot=nx0*ld[0]+ny*ld[1]+nz*ld[2];
      const f=Math.max(0.15,dot)*0.85+0.35;
      const r=parseInt(base.slice(1,3),16),g=parseInt(base.slice(3,5),16),b=parseInt(base.slice(5,7),16);
      return`rgb(${Math.min(255,Math.round(r*f))},${Math.min(255,Math.round(g*f))},${Math.min(255,Math.round(b*f))})`;
    };
    const draw=()=>{
      if(cancelled)return;
      if(cv.width!==cv.offsetWidth||cv.height!==cv.offsetHeight){cv.width=cv.offsetWidth||400;cv.height=cv.offsetHeight||300;}
      const w=cv.width,h=cv.height;
      ctx.fillStyle='#F0F2F6';ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='rgba(180,185,210,0.5)';ctx.lineWidth=0.6;
      for(let i=-5;i<=5;i++){
        const a=proj(i*0.4,0,-2,yRot,xRot,zoom,w,h),b2=proj(i*0.4,0,2,yRot,xRot,zoom,w,h);
        const c2=proj(-2,0,i*0.4,yRot,xRot,zoom,w,h),d=proj(2,0,i*0.4,yRot,xRot,zoom,w,h);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b2.x,b2.y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(c2.x,c2.y);ctx.lineTo(d.x,d.y);ctx.stroke();
      }
      const faces=polys.map(p=>{
        const cy2=Math.cos(yRot),sy2=Math.sin(yRot);
        const nx0=p.n[0]*cy2+p.n[2]*sy2,nz0=-p.n[0]*sy2+p.n[2]*cy2;
        const cx2=Math.cos(xRot),sx2=Math.sin(xRot);
        const ny2=p.n[1]*cx2-nz0*sx2,nz2=p.n[1]*sx2+nz0*cx2;
        const dot=nx0*ld[0]+ny2*ld[1]+nz2*ld[2];
        if(dot<-0.05)return null;
        const pv=p.vs.map(v=>proj(v[0],v[1],v[2],yRot,xRot,zoom,w,h));
        const avgZ=pv.reduce((s,v)=>s+v.z,0)/pv.length;
        return{pv,avgZ,col:lit(p.n,yRot,xRot,p.col)};
      }).filter(Boolean);
      faces.sort((a,b)=>b.avgZ-a.avgZ);
      faces.forEach(({pv,col})=>{
        ctx.beginPath();ctx.moveTo(pv[0].x,pv[0].y);
        pv.slice(1).forEach(v=>ctx.lineTo(v.x,v.y));
        ctx.closePath();ctx.fillStyle=col;ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.10)';ctx.lineWidth=0.6;ctx.stroke();
      });
      if(autoRot)yRot+=0.007;
      animId=requestAnimationFrame(draw);
    };
    const onMD=e=>{dragging=true;autoRot=false;lastX=e.clientX;lastY=e.clientY;};
    const onMU=()=>{dragging=false;};
    const onMM=e=>{if(!dragging)return;yRot+=(e.clientX-lastX)*0.012;xRot=Math.max(-1.3,Math.min(1.3,xRot+(e.clientY-lastY)*0.012));lastX=e.clientX;lastY=e.clientY;};
    const onWh=e=>{e.preventDefault();zoom=Math.max(0.25,Math.min(5.0,zoom*(e.deltaY>0?0.92:1.09)));};
    const onDbl=()=>{yRot=0.5;xRot=0.38;zoom=1.0;autoRot=true;};
    cv.addEventListener('mousedown',onMD);
    window.addEventListener('mouseup',onMU);
    window.addEventListener('mousemove',onMM);
    cv.addEventListener('wheel',onWh,{passive:false});
    cv.addEventListener('dblclick',onDbl);
    const syncSize=()=>{cv.width=cv.offsetWidth||400;cv.height=cv.offsetHeight||300;};
    syncSize();
    const ro=new ResizeObserver(syncSize);ro.observe(cv);
    draw();setReady(true);
    return()=>{cancelled=true;cancelAnimationFrame(animId);cv.removeEventListener('mousedown',onMD);window.removeEventListener('mouseup',onMU);window.removeEventListener('mousemove',onMM);cv.removeEventListener('wheel',onWh);cv.removeEventListener('dblclick',onDbl);ro.disconnect();};
  },[file.id]);
  const ext=file.name.split('.').pop().toUpperCase();
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div style={{flex:1,position:'relative',minHeight:0,overflow:'hidden',background:'#F0F2F6'}}>
        <canvas ref={cvRef} style={{display:'block',width:'100%',height:'100%'}}/>
        {!ready&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',gap:10,color:'#888',pointerEvents:'none'}}><div className="spin"/><span style={{fontSize:12}}>3D-Viewer…</span></div>}
      </div>
      <div style={{padding:'6px 14px',background:'rgba(20,20,32,.9)',color:'#ccc',fontSize:11,display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{file.name}</span>
        <span style={{background:'rgba(120,80,220,.35)',color:'#c0a0ff',padding:'1px 8px',borderRadius:8,fontWeight:700,fontSize:10,flexShrink:0}}>{ext}</span>
        <span style={{color:'#666',flexShrink:0}}>{fs(file.size)}</span>

        Ziehen = drehen · Scrollen = zoomen · Doppelklick = Reset

    </div>
  );
}

  const [fm,setFm]=useState({title:'',priority:'normal',dueDate:'',note:''});
  return(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#F5F7FA',minHeight:0}}>
    <div style={{padding:'11px 16px',borderBottom:'1px solid var(--bdr)',background:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
      <span style={{fontWeight:700,color:'var(--pri)',fontSize:14}}><i className="fas fa-tasks" style={{marginRight:8,color:'var(--blue)'}}/>Aufgaben & Workflow</span>
      <div style={{display:'flex',gap:8,alignItems:'center'}}><span style={{fontSize:12,color:'var(--mut)'}}>{tasks.filter(t=>!t.done).length} offen</span><button className="btn bp" style={{padding:'5px 12px',fontSize:12}} onClick={()=>setSn(s=>!s)}><i className="fas fa-plus"/>Neu</button></div>
    </div>
    {sn&&<div style={{padding:16,background:'#fff',borderBottom:'1px solid var(--bdr)',flexShrink:0}}>
      <div className="fg"><label>Titel</label><input type="text" className="fc" value={fm.title} onChange={e=>setFm(p=>({...p,title:e.target.value}))} placeholder="Aufgabe…" autoFocus/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div className="fg"><label>Priorität</label><select className="fc" value={fm.priority} onChange={e=>setFm(p=>({...p,priority:e.target.value}))}>{Object.entries(PRI).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}</select></div>
        <div className="fg"><label>Fällig am</label><input type="date" className="fc" value={fm.dueDate} onChange={e=>setFm(p=>({...p,dueDate:e.target.value}))}/></div>
      </div>
      <div className="fg"><label>Notiz</label><textarea className="fc" rows="2" value={fm.note} onChange={e=>setFm(p=>({...p,note:e.target.value}))} placeholder="Weitere Infos…"/></div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><button className="btn bs" onClick={()=>setSn(false)}>Abbrechen</button><button className="btn bp" disabled={!fm.title} onClick={()=>{onAdd(fm);setSn(false);setFm({title:'',priority:'normal',dueDate:'',note:''});}}>Hinzufügen</button></div>
    </div>}
    <div style={{flex:1,overflow:'auto',padding:12,minHeight:0}}>
      {tasks.length===0&&<div className="ctr"><i className="fas fa-check-circle" style={{fontSize:48,color:'#D0D9E4'}}/><p style={{fontSize:13}}>Keine Aufgaben</p></div>}
      {[...tasks].sort((a,b)=>(a.done?1:-1)-(b.done?1:-1)||({urgent:0,high:1,normal:2,low:3}[a.priority]||2)-({urgent:0,high:1,normal:2,low:3}[b.priority]||2)).map(t=>{
        const ov=t.dueDate&&new Date(t.dueDate)<new Date()&&!t.done;
        return(<div key={t.id} className={`task-card ${t.done?'done':''}`}>
          <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
            <input type="checkbox" checked={t.done} onChange={()=>onTog(t.id)} style={{marginTop:3,cursor:'pointer',width:15,height:15,accentColor:'var(--blue)'}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}><span style={{fontWeight:500,fontSize:13,textDecoration:t.done?'line-through':'none',color:'var(--txt)'}}>{t.title}</span><span className={`badge ${PRI[t.priority]?.b||'b-gray'}`}>{PRI[t.priority]?.l}</span></div>
              {t.note&&<p style={{fontSize:12,color:'var(--mut)',margin:'2px 0'}}>{t.note}</p>}
              {t.dueDate&&<p style={{fontSize:12,color:ov?'var(--red)':'var(--mut)',marginTop:4}}><i className="fas fa-calendar-alt" style={{marginRight:4}}/>{new Date(t.dueDate).toLocaleDateString('de-DE')}{ov&&' – Überfällig!'}</p>}
            </div>
            <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--mut)',fontSize:14,padding:2,flexShrink:0}} onClick={()=>onDel(t.id)}><i className="fas fa-trash"/></button>
          </div>
        </div>);
      })}
    </div>
  </div>);
}

              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            </svg>
            Mit Google-Konto anmelden

        <p style={{fontSize:11,color:'var(--mut)',marginBottom:16}}>Google Drive Zugriff · Deine Dateien bleiben privat</p>

/* Main App */
function Main({creds,onOut,isDemo}){
  const [nav,setNav]=useState('archive');
  const [cur,setCur]=useState({id:'root',name:'Mein Drive'});
  const [path,setPath]=useState([{id:'root',name:'Mein Drive'}]);
  const [files,setFiles]=useState([]);
  const [sel,setSel]=useState(null);
  const [loading,setLoading]=useState(false);
  const [q,setQ]=useState('');
  const [res,setRes]=useState(null);
  const [src,setSrc]=useState(false);
  const [tasks,setTasks]=useState([]);
  const [modal,setModal]=useState(null);
  const [ctx,setCtx]=useState(null);
  const [user,setUser]=useState(null);
  const [exp,setExp]=useState({'root':true});
  const [big,setBig]=useState(false);
  const [prevW,setPrevW]=useState(340);
  const [resizing,setResizing]=useState(false);
  const toast=useContext(TC);

  const startResize=useCallback(e=>{
    e.preventDefault();
    const startX=e.clientX,startW=prevW;
    setResizing(true);
    const mm=ev=>setPrevW(Math.max(200,Math.min(700,startW-(ev.clientX-startX))));
    const mu=()=>{setResizing(false);window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);
    window.addEventListener('mouseup',mu);
  },[prevW]);

  useEffect(()=>{
    if(isDemo){setFiles(DF);setTasks(DT);}
    else{load('root');DR.loadWF().then(d=>setTasks(d.tasks||[]));DR.me().then(u=>{if(u)setUser(u);});}
    const h=e=>{if(!e.target.closest('.ctx'))setCtx(null);};
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[]);

  const load=async fid=>{setLoading(true);setSel(null);try{setFiles(await DR.ls(fid));}catch(e){console.error(e);toast('Ladefehler','e');}setLoading(false);};
  const go=f=>{const idx=path.findIndex(x=>x.id===f.id);setPath(idx>=0?path.slice(0,idx+1):[...path,{id:f.id,name:f.name}]);setCur(f);setRes(null);setQ('');if(!isDemo)load(f.id);else setFiles(DF);};
  const click=f=>{if(f.mimeType==='application/vnd.google-apps.folder')go(f);else setSel(f);};
  const dbl=f=>{if(f.mimeType==='application/vnd.google-apps.folder')go(f);else{setSel(f);setBig(true);}};
  const search=async qry=>{if(!qry.trim()){setRes(null);return;}setSrc(true);try{if(isDemo)setRes(DF.filter(f=>f.name.toLowerCase().includes(qry.toLowerCase())));else setRes(await DR.find(qry));}catch{toast('Suche fehlgeschlagen','e');}setSrc(false);};
  const swf=t=>{setTasks(t);if(!isDemo)DR.saveWF({tasks:t});};
  const rf=()=>isDemo?setFiles(DF):load(cur.id);
  const disp=res!==null?res:files;
  const pend=tasks.filter(t=>!t.done).length;
  const NI=[{id:'archive',ic:'fa-archive',l:'Archiv'},{id:'workflow',ic:'fa-tasks',l:'Aufgaben',b:pend||null},{id:'inbox',ic:'fa-inbox',l:'E-Mails'},{id:'settings',ic:'fa-gear',l:'Einstellungen'}];

  return(<div style={{height:'100%',display:'flex',flexDirection:'column'}}>
    <div className="top-bar">
      <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <AlyseeLogo size={36} radius={6}/>
        <div><div style={{fontWeight:700,fontSize:15,lineHeight:1}}>alysee DMS</div><div style={{fontSize:9,color:'rgba(255,255,255,.5)',letterSpacing:'.5px'}}>DOKUMENTENMANAGEMENT</div></div>
      </div>
      <div className="srch">
        <i className="fas fa-search" style={{color:'rgba(255,255,255,.5)',fontSize:13}}/>
        <input type="text" placeholder="Suchen… (Name, Inhalt)" value={q} onChange={e=>{setQ(e.target.value);if(e.target.value.length>2)search(e.target.value);else if(!e.target.value)setRes(null);}} onKeyDown={e=>e.key==='Enter'&&search(q)}/>
        {src&&<i className="fas fa-spinner fa-spin" style={{color:'rgba(255,255,255,.5)'}}/>}
        {q&&!src&&<i className="fas fa-times" style={{color:'rgba(255,255,255,.5)',cursor:'pointer'}} onClick={()=>{setQ('');setRes(null);}}/>}
      </div>
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {isDemo&&<span style={{background:'var(--org)',color:'#fff',padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700}}>DEMO</span>}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700}}>{(user?.name||'S').charAt(0)}</div>
          <span style={{fontSize:13}}>{user?.name||'Stefan Hoffmann'}</span>
        </div>
        {!isDemo&&<button onClick={onOut} style={{background:'rgba(255,255,255,.14)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',padding:'5px 10px',borderRadius:5,cursor:'pointer',fontSize:12}}><i className="fas fa-right-from-bracket"/></button>}
      </div>
    </div>

    <div className="toolbar">
      <button className="tbtn" onClick={()=>setModal('up')}><i className="fas fa-upload"/><span>Hochladen</span></button>
      <button className="tbtn" onClick={()=>setModal('mk')}><i className="fas fa-folder-plus"/><span>Neuer Ordner</span></button>
      <div className="tsep"/>
      <button className="tbtn" onClick={rf}><i className="fas fa-rotate-right"/><span>Aktualisieren</span></button>
      {sel&&<><div className="tsep"/>
        <button className="tbtn" onClick={()=>setBig(true)}><i className="fas fa-expand-alt"/><span>Groß</span></button>
        <button className="tbtn" onClick={()=>setModal('ren')}><i className="fas fa-pencil"/><span>Umbenennen</span></button>
        {!isDemo&&<button className="tbtn red" onClick={async()=>{if(window.confirm(`"${sel.name}" löschen?`)){try{await DR.del(sel.id);toast('Gelöscht','i');rf();setSel(null);}catch{toast('Fehler','e');}}}}>
          <i className="fas fa-trash"/><span>Löschen</span>
        </button>}
      </>}
      <div style={{marginLeft:'auto',fontSize:12,color:'var(--mut)',paddingRight:8}}>
        {disp.length} Element{disp.length!==1?'e':''}{res!==null&&` – Suche: „${q}"`}
      </div>
    </div>

    <div className="main-area">
      <div className="app-nav">
        {NI.map(n=><div key={n.id} className={`nav-item ${nav===n.id?'active':''}`} onClick={()=>setNav(n.id)} title={n.l}><i className={`fas ${n.ic}`}/><span>{n.l}</span>{n.b?<div className="nav-badge">{n.b}</div>:null}</div>)}
        <div style={{flex:1}}/>
        <div className="nav-item" style={{fontSize:15,marginBottom:4}} title="Info"><i className="fas fa-circle-info"/><span>Info</span></div>
      </div>

      {nav==='workflow'?<WF tasks={tasks} onAdd={t=>{const n={...t,id:Date.now()+'',done:false};swf([...tasks,n]);toast('Hinzugefügt','s');}} onTog={id=>swf(tasks.map(t=>t.id===id?{...t,done:!t.done}:t))} onDel={id=>{swf(tasks.filter(t=>t.id!==id));toast('Gelöscht','i');}}/>
      :nav==='settings'?(<div style={{flex:1,padding:32,background:'var(--bg)',overflow:'auto'}}>
        <h2 style={{fontSize:20,color:'var(--pri)',marginBottom:22}}><i className="fas fa-gear" style={{marginRight:8}}/>Einstellungen</h2>
        <div style={{background:'#fff',borderRadius:10,padding:24,maxWidth:500,border:'1px solid var(--bdr)'}}>
          <h3 style={{marginBottom:14,fontSize:14,fontWeight:700}}>Verbindung</h3>
          {[['Status',<span style={{color:isDemo?'var(--org)':'var(--grn)'}}><i className="fas fa-circle" style={{fontSize:9,marginRight:5}}/>{isDemo?'Demo-Modus':'Verbunden'}</span>],['Benutzer',user?.name||'Stefan Hoffmann'],['E-Mail',user?.email||'hoffmannstefan1962@googlemail.com']].map(([l,v])=>(
            <div key={l} style={{marginBottom:10}}><div style={{fontSize:10,color:'var(--mut)',textTransform:'uppercase',letterSpacing:'.6px',fontWeight:600,marginBottom:3}}>{l}</div><div style={{fontSize:13,fontWeight:500}}>{v}</div></div>
          ))}
          <div style={{display:'flex',gap:8,marginTop:14}}>
            {!isDemo&&<button className="btn bd" onClick={onOut}><i className="fas fa-right-from-bracket"/>Abmelden</button>}
            <button className="btn bs" onClick={()=>{localStorage.clear();window.location.reload();}}><i className="fas fa-rotate-right"/>Neu konfigurieren</button>
          </div>
        </div>
        <div style={{background:'#fff',borderRadius:10,padding:24,maxWidth:500,border:'1px solid var(--bdr)',marginTop:14}}>
          <h3 style={{marginBottom:12,fontSize:14,fontWeight:700}}>Über alysee DMS</h3>
          <p style={{fontSize:13,color:'var(--mut)',lineHeight:1.7}}>Dokumentenmanagement der <strong>alysee GmbH</strong> für Objekteinrichter, Architekten und Innenarchitekten.<br/>Backend: Google Drive · Version 1.1</p>
        </div>
      </div>)
      :nav==='inbox'?(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        <div style={{padding:'11px 16px',borderBottom:'1px solid var(--bdr)',background:'#fff',fontWeight:700,color:'var(--pri)',fontSize:14,flexShrink:0}}><i className="fas fa-inbox" style={{marginRight:8,color:'var(--blue)'}}/>E-Mail Posteingang</div>
        <div style={{flex:1,overflow:'auto',background:'var(--bg)'}}>
          {DF.filter(f=>f.mimeType==='message/rfc822').map(m=>{const ed=EMAILS[m.id];return(<div key={m.id} style={{background:'#fff',margin:'8px 12px',borderRadius:8,border:'1px solid var(--bdr)',padding:'14px 16px',cursor:'pointer'}} onClick={()=>{setSel(m);setNav('archive');}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontWeight:600,fontSize:13}}>{ed?ed.subject:m.name}</span><span style={{fontSize:12,color:'var(--mut)',flexShrink:0,marginLeft:8}}>{fd(m.modifiedTime)}</span></div>
            {ed&&<p style={{fontSize:12,color:'var(--mut)',marginBottom:6}}>{ed.from}</p>}
            <span className={`badge ${m.name.startsWith('RE_')||m.name.startsWith('AW_')?'b-grn':'b-org'}`}>{m.name.startsWith('RE_')||m.name.startsWith('AW_')?'Beantwortet':'Eingehend'}</span>
          </div>);})}
        </div>
      </div>)
      :(<>
        <div className="folder-tree">
          <div className="tree-head"><i className="fas fa-sitemap" style={{marginRight:6}}/>Strukturbaum</div>
          <div className="tree-body">
            {(isDemo?DTREE:[{id:'root',name:'Mein Drive',icon:'fa-hdd',color:'#F7941D',ch:files.filter(f=>f.mimeType==='application/vnd.google-apps.folder').map(f=>({...f,icon:'fa-folder',color:'#F7941D'}))}]).map(nd=>(
              <div key={nd.id}>
                <div className={`tree-item ${cur.id===nd.id?'active':''}`} onClick={()=>{go(nd);setExp(e=>({...e,[nd.id]:!e[nd.id]}));}}>
                  {nd.ch?.length?<i className={`fas fa-chevron-${exp[nd.id]?'down':'right'}`} style={{fontSize:10,color:'var(--mut)',width:10}}/>:<span style={{width:10,display:'inline-block'}}/>}
                  <i className={`fas ${nd.icon}`} style={{color:nd.color||'var(--org)'}}/>{nd.name}
                </div>
                {exp[nd.id]&&nd.ch?.map(c=><div key={c.id} className={`tree-item ${cur.id===c.id?'active':''}`} style={{paddingLeft:26}} onClick={()=>go(c)}><i className={`fas ${c.icon||'fa-folder'}`} style={{color:c.color||'var(--org)'}}/>{c.name}</div>)}
              </div>
            ))}
          </div>
        </div>

        <div className="doc-panel">
          <div className="breadcrumb">
            {res!==null?<><i className="fas fa-search" style={{marginRight:4}}/><strong>Suche:</strong>&nbsp;„{q}"&nbsp;<span style={{color:'var(--mut)'}}>({res.length} Treffer)</span></>:(
              path.map((f,i)=><React.Fragment key={f.id}>{i>0&&<i className="fas fa-chevron-right" style={{fontSize:9,color:'var(--mut)'}}/>}<span className={`bc ${i===path.length-1?'cur':''}`} onClick={()=>i<path.length-1&&go(f)}>{f.name}</span></React.Fragment>)
            )}
          </div>
          <div className="doc-list-head"><div className="doc-hrow"><span/><span>Name</span><span>Geändert am</span><span>Typ</span><span style={{textAlign:'right'}}>Größe</span></div></div>
          <div className="doc-list">
            {loading?<div className="ctr"><div className="spin"/><p>Lade…</p></div>
            :disp.length===0?<div className="ctr"><i className="fas fa-folder-open" style={{fontSize:52,color:'#D0D9E4'}}/><p style={{fontSize:13}}>{res!==null?'Keine Treffer':'Ordner leer'}</p></div>
            :disp.map(f=>{
              const {i,c,l}=mi(f.mimeType,f.name),isFd=f.mimeType==='application/vnd.google-apps.folder';
              return(<div key={f.id} className={`doc-row ${sel?.id===f.id?'active':''}`} onClick={()=>click(f)} onDoubleClick={()=>dbl(f)} onContextMenu={e=>{e.preventDefault();e.stopPropagation();setSel(f);setCtx({x:Math.min(e.clientX,window.innerWidth-180),y:Math.min(e.clientY,window.innerHeight-160),f});}}>
                <i className={`fas ${i}`} style={{color:c,fontSize:18,textAlign:'center'}}/>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:isFd?600:400}}>{f.name}</span>
                <span style={{color:'var(--mut)',fontSize:12}}>{fd(f.modifiedTime)}</span>
                <span><span className={`badge ${isFd?'b-org':'b-blue'}`}>{l}</span></span>
                <span style={{textAlign:'right',color:'var(--mut)',fontSize:12}}>{isFd?'–':fs(f.size)}</span>
              </div>);
            })}
          </div>
        </div>

        <div className={`resizer ${resizing?'drag':''}`} onMouseDown={startResize} title="Vorschau-Breite anpassen"/>
        <PrevPanel file={sel} isDemo={isDemo} onExpand={()=>sel&&setBig(true)} width={prevW}/>
      </>)}
    </div>

    <div className="status-bar">
      <span><i className="fas fa-circle" style={{color:isDemo?'var(--org)':'var(--grn)',fontSize:8,marginRight:5}}/>{isDemo?'Demo-Modus':'Google Drive verbunden'}</span>
      <span>{disp.length} Elemente</span>
      {sel&&<span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:260}}>Ausgewählt: {sel.name}</span>}
      <span style={{marginLeft:'auto'}}>alysee DMS v1.1 · alysee GmbH · {new Date().getFullYear()}</span>
    </div>

    {ctx&&<div className="ctx" style={{top:ctx.y,left:ctx.x}} onClick={e=>e.stopPropagation()}>
      <div className="cxi" onClick={()=>{setSel(ctx.f);setCtx(null);}}><i className="fas fa-eye"/>Vorschau</div>
      <div className="cxi" onClick={()=>{setSel(ctx.f);setBig(true);setCtx(null);}}><i className="fas fa-expand-alt"/>Groß öffnen</div>
      {ctx.f.mimeType==='application/vnd.google-apps.folder'&&<div className="cxi" onClick={()=>{go(ctx.f);setCtx(null);}}><i className="fas fa-folder-open"/>Ordner öffnen</div>}
      {ctx.f.webViewLink&&ctx.f.webViewLink!=='#'&&<div className="cxi" onClick={()=>{window.open(ctx.f.webViewLink,'_blank');setCtx(null);}}><i className="fas fa-external-link-alt"/>In Drive öffnen</div>}
      <div className="cxs"/>
      <div className="cxi" onClick={()=>{setSel(ctx.f);setModal('ren');setCtx(null);}}><i className="fas fa-pencil"/>Umbenennen</div>
      {!isDemo&&<div className="cxi danger" onClick={async()=>{if(window.confirm(`"${ctx.f.name}" löschen?`)){try{await DR.del(ctx.f.id);toast('Gelöscht','i');rf();if(sel?.id===ctx.f.id)setSel(null);}catch{toast('Fehler','e');}}setCtx(null);}}>
        <i className="fas fa-trash"/>Löschen
      </div>}
    </div>}

    {big&&sel&&<ExpandMod file={sel} isDemo={isDemo} onClose={()=>setBig(false)}/>}
    {modal==='up'&&<UpMod fid={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='mk'&&<MkMod par={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='ren'&&sel&&<RenMod file={sel} onClose={()=>setModal(null)} onDone={()=>{rf();setModal(null);}} isDemo={isDemo}/>}
  </div>);
}

/* BUG FIX 4: App Root – robuste Initialisierung, wartet auf beide APIs */
const DEF_CID='633536117262-28memlfds8btpdk8facskab8aq9msjdq.apps.googleusercontent.com';
const DEF_KEY='AIzaSyCNXwOka6MinW9ZoCFDuwsSnOD9NGfyIg0';

function App(){
  const [state,setState]=useState('init'); // init | login | app
  const [isDemo,setIsDemo]=useState(false);
  const [gapiOk,setGapiOk]=useState(_gapiReady);
  const [gisOk,setGisOk]=useState(_gisReady);
  const tokRef=useRef(null);
  const toast=useContext(TC);

  // API-Bereitschaft überwachen
  useEffect(()=>{
    const a=()=>setGapiOk(true);
    const b=()=>setGisOk(true);
    window.addEventListener('gapiOk',a);
    window.addEventListener('gisOk',b);
    return()=>{window.removeEventListener('gapiOk',a);window.removeEventListener('gisOk',b);};
  },[]);

  // Initialisierung sobald beide APIs bereit sind
  useEffect(()=>{
    if(!gapiOk||!gisOk)return;
    // DEMO-Modus Check
    const stored=localStorage.getItem('alysee_cid');
    if(stored==='DEMO'){localStorage.removeItem('alysee_cid');}

    DR.init(DEF_CID,DEF_KEY)
      .then(()=>{
        tokRef.current=DR.mkT(DEF_CID,r=>{
          if(r.error){
            console.error('OAuth error:',r.error);
            toast('Anmeldung fehlgeschlagen: '+r.error,'e');
          }else{
            setState('app');
          }
        });
        setState('login');
      })
      .catch(e=>{
        console.error('gapi init error:',e);
        setState('login');
      });
  },[gapiOk,gisOk]);

  const signIn=()=>{
    if(!tokRef.current){toast('Google APIs noch nicht bereit, bitte warten…','e');return;}
    tokRef.current.requestAccessToken({prompt:''});
  };

  const signOut=()=>{
    try{
      if(window.gapi?.client?.getToken()){
        google.accounts.oauth2.revoke(gapi.client.getToken().access_token,()=>{});
        gapi.client.setToken('');
      }
    }catch(e){console.warn(e);}
    setState('login');
  };

  const goDemo=()=>{setIsDemo(true);setState('app');};

  if(state==='init')return(
    <div className="setup-bg">
      <div style={{textAlign:'center',color:'#fff'}}>
        <AlyseeLogo size={80} radius={14}/>
        <div style={{marginTop:20}}><div className="spin" style={{margin:'0 auto',borderTopColor:'#fff',borderColor:'rgba(255,255,255,.3)'}}/></div>
        <p style={{marginTop:16,fontSize:14,opacity:.7}}>Lade alysee DMS…</p>
      </div>
    </div>
  );

  if(state==='login')return(
    <Login onIn={signIn} onDemo={goDemo} gapiOk={gapiOk} gisOk={gisOk}/>
  );

  return<Main creds={{cid:DEF_CID,key:DEF_KEY}} onOut={signOut} isDemo={isDemo}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProv><App/></ToastProv>);
</script>
</body>
</html>
