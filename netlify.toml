[build]
  publish = "."

# Service Worker - kein Cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Add-In HTML - KEIN X-Frame-Options, CORS für Outlook
[[headers]]
  for = "/addin.html"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Content-Security-Policy = "frame-ancestors https://*.office.com https://*.outlook.com https://*.microsoft.com https://alydoc.netlify.app https://alydoc.alysee.de"

# Auth Dialog für Outlook Add-in
[[headers]]
  for = "/auth.html"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "frame-ancestors https://*.office.com https://*.outlook.com https://*.microsoft.com https://alydoc.netlify.app https://alydoc.alysee.de"

# Haupt-App HTML
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Icons
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
