<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>alyDoc – Google Anmeldung</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F5F7FA;margin:0}
    .card{background:#fff;border-radius:10px;padding:32px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1);max-width:360px;width:90%}
    .card h2{color:#003D7A;font-size:16px;margin-bottom:8px}
    .card p{color:#7F8C8D;font-size:13px;margin-bottom:20px;line-height:1.5}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:7px;border:none;cursor:pointer;font-size:14px;font-weight:500;background:#0072CE;color:#fff;transition:background .15s;width:100%;justify-content:center}
    .btn:hover{background:#005faa}
    .btn:disabled{background:#9bb3cc;cursor:not-allowed}
    .btn+.btn{margin-top:8px}
    .status{margin-top:16px;font-size:12px;color:#7F8C8D}
    .spin{animation:sp .8s linear infinite;display:inline-block}
    @keyframes sp{to{transform:rotate(360deg)}}
    .success{color:#00A651;font-size:36px;margin-bottom:12px}
  </style>
</head>
<body>
<div class="card" id="card">
  <h2>Mit Google verbinden</h2>
  <p>Du wirst automatisch zu Google weitergeleitet…</p>
  <div class="status" id="status"><span class="spin">⏳</span> Weiterleitung…</div>
</div>

<script>
const CLIENT_ID='633536117262-28memlfds8btpdk8facskab8aq9msjdq.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive';
// Redirect-URI muss EXAKT auth.html sein (ohne Query-Parameter)
const REDIRECT_URI=window.location.origin+'/auth.html';

let officeReady=false;

// ── Office.js Init ──
Office.onReady(()=>{officeReady=true;checkRedirectReturn();});

// ── Prüfe ob wir von einem Google-Redirect zurückkommen ──
function checkRedirectReturn(){
  const hash=window.location.hash.substring(1);
  if(!hash||!hash.includes('access_token'))return;

  const params=new URLSearchParams(hash);
  const token=params.get('access_token');
  const expiresIn=params.get('expires_in')||'3600';

  if(!token)return;

  // URL aufräumen
  history.replaceState(null,'',window.location.pathname);

  sendToken(token,expiresIn);
}

function sendToken(token,expiresIn){
  document.getElementById('card').innerHTML='<div class="success">✓</div><h2>Verbunden!</h2><p style="color:#7F8C8D;font-size:13px">Anmeldung erfolgreich.<br>Dieses Fenster schliesst sich automatisch.</p>';

  const msg=JSON.stringify({type:'auth_success',token:token,expires_in:parseInt(expiresIn)});

  // Office Dialog → messageParent sendet Token zurück an addin.html
  try{
    if(officeReady&&Office.context&&Office.context.ui){
      Office.context.ui.messageParent(msg);
      return;
    }
  }catch(e){console.warn('messageParent err:',e);}

  // Fallback: postMessage (falls außerhalb Office geöffnet)
  if(window.opener){
    try{window.opener.postMessage(msg,'*');}catch{}
  }
}

// ── Google OAuth Redirect starten ──
function startAuth(){
  const status=document.getElementById('status');
  status.innerHTML='<span class="spin">⏳</span> Weiterleitung zu Google…';

  const authUrl='https://accounts.google.com/o/oauth2/v2/auth'
    +'?client_id='+encodeURIComponent(CLIENT_ID)
    +'&redirect_uri='+encodeURIComponent(REDIRECT_URI)
    +'&response_type=token'
    +'&scope='+encodeURIComponent(SCOPES)
    +'&include_granted_scopes=true'
    +'&prompt=consent';

  window.location.href=authUrl;
}

// ── Auto-Start: Wenn kein Token im Hash, direkt zu Google weiterleiten ──
(function init(){
  const hash=window.location.hash.substring(1);
  if(hash&&hash.includes('access_token')){
    // Wir kommen vom Google-Redirect zurück → Token wird in Office.onReady verarbeitet
    return;
  }
  // Kein Token → nach kurzer Verzögerung automatisch weiterleiten
  setTimeout(startAuth,600);
})();
</script>
</body>
</html>
