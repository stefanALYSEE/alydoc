<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>alyDoc – Google Anmeldung</title>
  <script>
  // WICHTIG: Vor Office.js laden – _host_Info aus sessionStorage wiederherstellen
  // Google-Redirect entfernt den _host_Info Parameter, den Office.js braucht
  (function restoreHostInfo(){
    const url=new URL(window.location.href);
    const hash=url.hash.substring(1);
    const hasToken=hash&&hash.includes('access_token');

    if(hasToken&&!url.searchParams.get('_host_Info')){
      // Wir kommen vom Google-Redirect zurueck – _host_Info fehlt
      const saved=sessionStorage.getItem('office_host_info');
      if(saved){
        // Token im sessionStorage zwischenspeichern
        const params=new URLSearchParams(hash);
        sessionStorage.setItem('oauth_token',params.get('access_token'));
        sessionStorage.setItem('oauth_expires',params.get('expires_in')||'3600');
        // Seite MIT _host_Info neu laden – Office.js erkennt den Dialog-Kontext
        url.searchParams.set('_host_Info',saved);
        url.hash='';
        window.location.replace(url.toString());
        return; // Seite wird neu geladen
      }
    }
  })();
  </script>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F5F7FA;margin:0}
    .card{background:#fff;border-radius:10px;padding:32px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1);max-width:360px;width:90%}
    .card h2{color:#003D7A;font-size:16px;margin-bottom:8px}
    .card p{color:#7F8C8D;font-size:13px;margin-bottom:20px;line-height:1.5}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:7px;border:none;cursor:pointer;font-size:14px;font-weight:500;background:#0072CE;color:#fff;transition:background .15s}
    .btn:hover{background:#005faa}
    .btn:disabled{background:#9bb3cc;cursor:not-allowed}
    .status{margin-top:16px;font-size:12px;color:#7F8C8D}
    .spin{animation:sp .8s linear infinite;display:inline-block}
    @keyframes sp{to{transform:rotate(360deg)}}
    .success{color:#00A651;font-size:36px;margin-bottom:12px}
    .error{color:#CC0000;font-size:13px;margin-top:12px}
  </style>
</head>
<body>
<div class="card" id="card">
  <h2>Mit Google verbinden</h2>
  <p>Melde dich an, um Mails in Google Drive abzulegen.</p>
  <button class="btn" id="btn-login" onclick="startLogin()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google Anmeldung
  </button>
  <div class="status" id="status"></div>
</div>

<script>
const CLIENT_ID='633536117262-28memlfds8btpdk8facskab8aq9msjdq.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive';
const REDIRECT_URI=window.location.origin+window.location.pathname;

// ── Prüfe ob Token im sessionStorage liegt (nach _host_Info Restore) ──
(function checkForToken(){
  const token=sessionStorage.getItem('oauth_token');
  if(!token)return;
  const expiresIn=sessionStorage.getItem('oauth_expires')||'3600';
  // Token aufraumen
  sessionStorage.removeItem('oauth_token');
  sessionStorage.removeItem('oauth_expires');
  sessionStorage.removeItem('office_host_info');

  const msg=JSON.stringify({type:'auth_success',token:token,expires_in:parseInt(expiresIn)});

  document.getElementById('card').innerHTML='<div class="success">✓</div><h2>Verbunden!</h2><p style="color:#7F8C8D;font-size:13px">Anmeldung erfolgreich.</p>';

  // Warte auf Office.js, dann Token an Add-in senden
  if(typeof Office!=='undefined'){
    Office.onReady(()=>{
      try{
        Office.context.ui.messageParent(msg);
      }catch(e){
        console.warn('messageParent err:',e);
      }
    });
  }
})();

// ── Login: _host_Info sichern, dann zu Google redirecten ──
function startLogin(){
  const status=document.getElementById('status');
  const btn=document.getElementById('btn-login');
  btn.disabled=true;
  status.innerHTML='<span class="spin">⏳</span> Weiterleitung zu Google…';

  // _host_Info sichern (Office.js braucht diesen Parameter nach dem Redirect)
  const hostInfo=new URL(window.location.href).searchParams.get('_host_Info');
  if(hostInfo){
    sessionStorage.setItem('office_host_info',hostInfo);
  }

  // OAuth 2.0 Implicit Grant – Redirect in diesem Fenster
  const authUrl='https://accounts.google.com/o/oauth2/v2/auth'
    +'?client_id='+encodeURIComponent(CLIENT_ID)
    +'&redirect_uri='+encodeURIComponent(REDIRECT_URI)
    +'&response_type=token'
    +'&scope='+encodeURIComponent(SCOPES)
    +'&include_granted_scopes=true'
    +'&prompt=consent';

  window.location.href=authUrl;
}
</script>
</body>
</html>
