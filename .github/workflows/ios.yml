name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch: # Manuell auslösbar

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: iOS-Projekt erstellen
        run: npx cap add ios

      - name: Web-Code synchronisieren
        run: npx cap sync ios

      # -------------------------------------------------------
      # SIGNIERUNG — Aktivieren sobald Apple Developer Account vorhanden
      # Anleitung:
      # 1. Apple Developer Account registrieren (developer.apple.com)
      # 2. In Xcode ein Distribution-Zertifikat + Provisioning Profile erstellen
      # 3. Zertifikat als .p12 exportieren
