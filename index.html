<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alyDoc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F9A800'/><text x='7' y='91' font-family='Arial' font-size='27' font-weight='300' fill='white'>alysee</text></svg>">
  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="alyDoc">
  <meta name="theme-color" content="#003D7A">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    let _gapiReady=false,_gisReady=false,_gapiResolvers=[],_gisResolvers=[];
    function gapiLoaded(){gapi.load('client',()=>{_gapiReady=true;_gapiResolvers.forEach(r=>r());_gapiResolvers=[];window.dispatchEvent(new Event('gapiOk'));});}
    function gisLoaded(){_gisReady=true;_gisResolvers.forEach(r=>r());_gisResolvers=[];window.dispatchEvent(new Event('gisOk'));}
  </script>
  <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>
  <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#EDF2F7}
    #root{display:flex;flex-direction:column}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#f0f0f0}
    ::-webkit-scrollbar-thumb{background:#C5CDD9;border-radius:3px}
    :root{--pri:#003D7A;--blue:#0072CE;--grn:#00A651;--org:#F7941D;--red:#CC0000;--nav:#1B2B47;--navh:#253C5E;--bdr:#D0D9E4;--bg:#F5F7FA;--txt:#2C3E50;--mut:#7F8C8D}
    .top-bar{height:48px;background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .toolbar{background:#EEF3FA;border-bottom:1px solid var(--bdr);padding:4px 8px;display:flex;align-items:center;gap:2px;flex-shrink:0;flex-wrap:wrap}
    .main-area{flex:1;display:flex;overflow:hidden;min-height:0}
    .status-bar{background:var(--nav);color:#7A8FA8;padding:3px 14px;font-size:11px;display:flex;align-items:center;gap:18px;flex-shrink:0}
    .app-nav{width:54px;background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:8px 0;flex-shrink:0}
    .nav-item{width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8A9BB5;cursor:pointer;border-radius:8px;margin:2px 0;font-size:17px;transition:all .15s;position:relative;gap:2px;user-select:none}
    .nav-item span{font-size:9px}
    .nav-item:hover{background:var(--navh);color:#fff}
    .nav-item.active{background:var(--blue);color:#fff}
    .nav-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
    .folder-tree{width:220px;background:#fff;border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
    .tree-head{background:var(--nav);color:#9AAEC5;padding:10px 12px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;flex-shrink:0}
    .tree-body{flex:1;overflow-y:auto}
    .tree-item{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt);border-left:2px solid transparent;transition:background .1s;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tree-item:hover{background:#EEF4FF}
    .tree-item:hover .tree-add{opacity:1}
    .tree-add{opacity:0;margin-left:auto;background:none;border:none;cursor:pointer;color:var(--mut);font-size:11px;padding:0 4px;flex-shrink:0;transition:opacity .15s}
    .tree-add:hover{color:var(--blue)}
    .tree-inline-input{border:1px solid var(--blue);border-radius:3px;font-size:12px;padding:2px 6px;width:100%;outline:none;margin:2px 0}
    .tree-item.active{background:#E0EDFF;color:var(--blue);border-left-color:var(--blue);font-weight:500}
    .tree-item.drop-target{background:#E8F5E9 !important;border-left-color:var(--grn) !important;outline:2px dashed var(--grn)}
    .tree-item i{width:16px;text-align:center;font-size:13px;flex-shrink:0}
    .doc-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .breadcrumb{display:flex;align-items:center;gap:4px;padding:6px 14px;background:#F4F7FB;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--mut);flex-shrink:0;flex-wrap:wrap}
    .bc{cursor:pointer;color:var(--blue)}.bc:hover{text-decoration:underline}
    .bc.cur{color:var(--txt);cursor:default}.bc.cur:hover{text-decoration:none}
    .doc-list-head{background:#F4F7FB;border-bottom:2px solid var(--bdr);flex-shrink:0}
    .doc-hrow{display:grid;grid-template-columns:36px 1fr 120px 90px 78px;padding:7px 12px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;align-items:center}
    .doc-list{flex:1;overflow-y:auto}
    .doc-row{display:grid;grid-template-columns:36px 1fr 120px 90px 78px;padding:8px 12px;align-items:center;border-bottom:1px solid #F0F4F8;cursor:grab;font-size:13px;transition:background .1s;user-select:none;-webkit-user-drag:element}
    .doc-row:active{cursor:grabbing}
    .doc-row:hover{background:#EEF4FF}
    .doc-row.active{background:#E0EDFF;border-left:3px solid var(--blue);padding-left:9px}
    .doc-row.dragging{opacity:.4;background:#f0f0f0 !important}
    .doc-row.drop-target{background:#E8F5E9 !important;outline:2px dashed var(--grn);outline-offset:-2px}
    .prev-panel{background:#fff;border-left:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;min-height:0}
    .resizer{width:5px;background:var(--bdr);cursor:col-resize;flex-shrink:0;transition:background .15s;user-select:none;touch-action:none;position:relative}
    .resizer::before{content:'';position:absolute;top:0;bottom:0;left:-8px;right:-8px}
    .resizer:hover,.resizer.drag{background:var(--blue)}
    .prev-head{background:#F4F7FB;border-bottom:1px solid var(--bdr);padding:9px 12px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .prev-tabs{display:flex;gap:3px}
    .prev-tab{background:none;border:none;padding:3px 9px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--mut);font-weight:600}
    .prev-tab.active{background:#E0EDFF;color:var(--blue)}
    .prev-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
    .srch{flex:1;max-width:380px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:6px}
    .srch input{background:none;border:none;outline:none;color:#fff;font-size:13px;padding:7px 0;width:100%}
    .srch input::placeholder{color:rgba(255,255,255,.5)}
    .tbtn{padding:5px 10px;border:none;background:none;border-radius:5px;cursor:pointer;font-size:11px;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .1s;min-width:52px}
    .tbtn:hover{background:#D4E4F5}.tbtn:disabled{opacity:.4;cursor:default}
    .tbtn i{font-size:16px;color:var(--blue)}.tbtn.grn i{color:var(--grn)}.tbtn.red i{color:var(--red)}
    .tsep{width:1px;height:34px;background:var(--bdr);margin:0 3px}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
    .b-blue{background:#E0EDFF;color:var(--blue)}.b-grn{background:#E5F7ED;color:var(--grn)}
    .b-org{background:#FEF3E8;color:var(--org)}.b-red{background:#FDEAEA;color:var(--red)}.b-gray{background:#F0F4F8;color:var(--mut)}
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(2px)}
    .modal{background:#fff;border-radius:10px;padding:28px;width:500px;max-width:94vw;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:fin .2s ease}
    .modal-xl{width:82vw;max-width:1100px;height:82vh;display:flex;flex-direction:column}
    @keyframes fin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
    .modal h2{font-size:17px;margin-bottom:18px;color:var(--pri);display:flex;align-items:center;gap:8px}
    .fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    .fc{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;outline:none;transition:border .15s}
    .fc:focus{border-color:var(--blue)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:all .15s}
    .bp{background:var(--blue);color:#fff}.bp:hover{background:#005FAD}
    .bg{background:var(--grn);color:#fff}.bg:hover{background:#007A3D}
    .bs{background:#F0F4F8;color:var(--txt);border:1px solid var(--bdr)}.bs:hover{background:#E0E8F0}
    .btn:disabled{opacity:.45;cursor:default}
    .spin{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut)}
    .drop-zone{border:2px dashed var(--bdr);border-radius:8px;padding:32px;text-align:center;color:var(--mut);cursor:pointer;transition:all .2s;background:var(--bg)}
    .drop-zone:hover,.drop-zone.dov{border-color:var(--blue);background:#EEF4FF;color:var(--blue)}
    .toast-c{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{padding:10px 16px;border-radius:7px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;animation:fin .25s ease;max-width:340px}
    .toast.s{background:#E8F5E9;color:#007A3D;border:1px solid #b2dfdb}
    .toast.e{background:#FDEAEA;color:#990000;border:1px solid #ffcdd2}
    .toast.i{background:#E3F2FD;color:#005b9f;border:1px solid #bbdefb}
    .ctx{position:fixed;background:#fff;border:1px solid var(--bdr);border-radius:7px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:5px 0;z-index:3000;min-width:180px;animation:fin .12s ease}
    .cxi{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--txt);display:flex;align-items:center;gap:9px}
    .cxi:hover{background:#EEF4FF}.cxi i{width:16px;color:var(--mut);text-align:center}
    .cxi.danger{color:var(--red)}.cxi.danger i{color:var(--red)}
    .cxi.grn{color:var(--grn)}.cxi.grn i{color:var(--grn)}
    .cxs{height:1px;background:var(--bdr);margin:4px 0}
    .task-card{border:1px solid var(--bdr);border-radius:8px;padding:13px;margin-bottom:8px;background:#fff;transition:box-shadow .2s}
    .task-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}.task-card.done{opacity:.55}
    .setup-bg{height:100vh;background:linear-gradient(135deg,#003D7A,#0072CE);display:flex;align-items:center;justify-content:center}
    .setup-card{background:#fff;border-radius:14px;padding:40px;width:540px;max-width:94vw;box-shadow:0 24px 64px rgba(0,0,0,.35)}
    .move-tree{max-height:340px;overflow-y:auto;border:1px solid var(--bdr);border-radius:6px;background:#F9FAFB}
    .move-row{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);transition:background .1s;user-select:none;border-bottom:1px solid #f0f0f0}
    .move-row:last-child{border-bottom:none}
    .move-row:hover:not(.dis){background:#EEF4FF}
    .move-row.sel{background:#E0EDFF;color:var(--blue);font-weight:600}
    .move-row.dis{opacity:.38;cursor:not-allowed;background:#fafafa}
    .drag-bar{font-size:11px;color:#856404;padding:4px 14px;background:#FFF3CD;border-bottom:1px solid #FFE082;flex-shrink:0;display:flex;align-items:center;gap:6px}
    /* ── TABLET (iPad) ── */
    @media(max-width:1024px){
      .folder-tree{width:170px}
      .prev-panel{max-width:280px}
    }
    @media(max-width:900px){
      .doc-hrow,.doc-row{grid-template-columns:36px 1fr 90px 72px}
      .doc-hrow>*:nth-child(5),.doc-row>*:nth-child(5){display:none}
    }
    @media(max-width:768px){
      .prev-panel{display:none}
      .resizer{display:none}
      .folder-tree{width:180px}
    }
    /* ── MOBILE (iPhone) ── */
    @media(max-width:600px){
      html,body,#root{height:100%;height:100dvh}
      .top-bar{height:52px;padding:0 12px}
      .top-bar .srch{max-width:none}
      .toolbar{display:none}
      .folder-tree{display:none}
      .app-nav{display:none}
      .status-bar{display:none}
      .doc-hrow{display:none}
      .doc-row{grid-template-columns:40px 1fr 60px;padding:12px 14px;min-height:52px}
      .doc-row>*:nth-child(3),.doc-row>*:nth-child(4),.doc-row>*:nth-child(5){display:none}
      .doc-row>*:nth-child(2){font-size:14px}
      .doc-row>*:nth-child(3){display:block}
      .main-area{padding-bottom:64px}
      .resizer{display:none}
      .modal{padding:20px 16px;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%!important;max-width:100%!important;animation:slideup .25s ease}
      .ov{align-items:flex-end}
      @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
      .move-tree{max-height:50vh}
      .breadcrumb{font-size:12px;padding:5px 12px}
    }
    /* ── BOTTOM NAV (nur mobile) ── */
    .bottom-nav{display:none}
    @media(max-width:600px){
      .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--nav);border-top:1px solid rgba(255,255,255,.1);z-index:500;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}
      .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8A9BB5;font-size:10px;gap:3px;cursor:pointer;position:relative;transition:color .15s;padding:8px 0;-webkit-tap-highlight-color:transparent}
      .bn-item i{font-size:22px}
      .bn-item.active{color:#fff}
      .bn-item.active i{color:var(--org)}
      .bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
      /* FAB Upload Button */
      .fab{position:fixed;bottom:76px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,114,206,.5);cursor:pointer;z-index:600;-webkit-tap-highlight-color:transparent;transition:transform .15s}
      .fab:active{transform:scale(.92)}
      /* Mobile action sheet für Kontextmenu */
      .action-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));z-index:4000;animation:slideup .2s ease;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
      .as-handle{width:36px;height:4px;background:#D0D9E4;border-radius:2px;margin:8px auto 16px}
      .as-title{padding:0 20px 12px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .as-item{padding:16px 20px;display:flex;align-items:center;gap:14px;font-size:15px;color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:transparent}
      .as-item:active{background:#F0F4F8}
      .as-item i{width:22px;text-align:center;font-size:18px;color:var(--mut)}
      .as-item.danger{color:var(--red)}.as-item.danger i{color:var(--red)}
      .as-item.grn{color:var(--grn)}.as-item.grn i{color:var(--grn)}
    }
    .hide-mobile{display:block}
    @media(max-width:600px){.hide-mobile{display:none !important}}
    /* safe-area für notch */
    @supports(padding-top:env(safe-area-inset-top)){
      @media(max-width:600px){.top-bar{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;
const TC=createContext(()=>{});

const fd=s=>s?new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const fdt=s=>s?new Date(s).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
const fs=b=>{if(!b)return'–';b=+b;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';};
function mi(mt='',nm=''){
  if(mt==='application/vnd.google-apps.folder')return{i:'fa-folder',c:'#F7941D',l:'Ordner'};
  if(mt.includes('pdf'))return{i:'fa-file-pdf',c:'#CC0000',l:'PDF'};
  if(mt.includes('word')||mt.includes('wordprocessing'))return{i:'fa-file-word',c:'#2B579A',l:'Word'};
  if(mt.includes('sheet')||mt.includes('excel'))return{i:'fa-file-excel',c:'#217346',l:'Excel'};
  if(mt.includes('presentation')||mt.includes('powerpoint'))return{i:'fa-file-powerpoint',c:'#D24726',l:'PPT'};
  if(mt.includes('image'))return{i:'fa-file-image',c:'#8E44AD',l:'Bild'};
  if(mt.includes('video'))return{i:'fa-file-video',c:'#E74C3C',l:'Video'};
  if(mt.includes('zip')||mt.includes('archive'))return{i:'fa-file-zipper',c:'#F39C12',l:'Archiv'};
  if(mt.includes('email')||nm.endsWith('.eml')||nm.endsWith('.msg'))return{i:'fa-envelope',c:'#3498DB',l:'E-Mail'};
  const n2=nm.toLowerCase();
  if(['.stl','.3mf','.fbx','.obj','.glb','.gltf'].some(e=>n2.endsWith(e)))return{i:'fa-cube',c:'#7C3AED',l:'3D-Modell'};
  if(['.step','.stp','.3dm','.iges','.igs'].some(e=>n2.endsWith(e)))return{i:'fa-cube',c:'#059669',l:'CAD-3D'};
  if(['.dxf','.dwg'].some(e=>n2.endsWith(e)))return{i:'fa-drafting-compass',c:'#0EA5E9',l:'CAD-Zeichnung'};
  if(mt.startsWith('application/vnd.google-apps'))return{i:'fa-file-circle-check',c:'#4285F4',l:'Google'};
  return{i:'fa-file',c:'#7F8C8D',l:'Datei'};
}

const AlyseeLogo=({size=40,radius=6})=>(
  <svg width={size} height={size} viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style={{borderRadius:radius,flexShrink:0,display:'block'}}>
    <rect width="100" height="100" fill="#F9A800"/>
    <text x="7" y="91" fontFamily="'Arial','Helvetica',sans-serif" fontSize="27" fontWeight="300" letterSpacing="-0.5" fill="white">alysee</text>
  </svg>
);

/* ── GOOGLE DRIVE API ── */
const DR={
  async init(cid,key){await gapi.client.init({apiKey:key,discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']});},
  mkT(cid,cb){return google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',callback:cb});},
  async ls(fid='root'){const r=await gapi.client.drive.files.list({q:`'${fid}' in parents and trashed=false`,fields:'files(id,name,mimeType,modifiedTime,size,webViewLink,parents)',orderBy:'folder,name',pageSize:300});return r.result.files||[];},
  async find(q){const e=q.replace(/'/g,"\\'");const r=await gapi.client.drive.files.list({q:`(name contains '${e}' or fullText contains '${e}') and trashed=false`,fields:'files(id,name,mimeType,modifiedTime,size,webViewLink,parents)',pageSize:100});return r.result.files||[];},
  async mkdir(name,par='root'){const r=await gapi.client.drive.files.create({resource:{name,mimeType:'application/vnd.google-apps.folder',parents:[par]},fields:'id,name,mimeType'});return r.result;},
  async up(file,par,onP){
    const tok=gapi.client.getToken().access_token,fm=new FormData();
    fm.append('metadata',new Blob([JSON.stringify({name:file.name,parents:[par]})],{type:'application/json'}));
    fm.append('file',file);
    return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size');x.setRequestHeader('Authorization','Bearer '+tok);x.upload.onprogress=e=>e.lengthComputable&&onP&&onP(Math.round(e.loaded/e.total*100));x.onload=()=>x.status===200?res(JSON.parse(x.responseText)):rej(new Error(x.statusText));x.onerror=()=>rej(new Error('Fehler'));x.send(fm);});
  },
  async del(id){await gapi.client.drive.files.delete({fileId:id});},
  async ren(id,name){const r=await gapi.client.drive.files.update({fileId:id,resource:{name},fields:'id,name'});return r.result;},
  async move(fileId,newParentId,oldParentId){
    const r=await gapi.client.drive.files.update({fileId,addParents:newParentId,removeParents:oldParentId||'root',fields:'id,name,parents'});
    return r.result;
  },
  async listSubfolders(parentId='root'){
    const isElo=n=>/^[0-9A-Fa-f]{4,10}$/.test(n);
    try{
      const r=await gapi.client.drive.files.list({
        q:"'" + parentId + "' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false",
        fields:'files(id,name,parents)',orderBy:'name',pageSize:200
      });
      return (r.result.files||[]).filter(f=>!isElo(f.name)).map(f=>({...f,parentId}));
    }catch(e){console.warn('listSubfolders err:',e);return[];}
  },
  // Compat: allFolders fuer MoveMod – laedt flach alle Ordner (BFS, max 4 Ebenen)
  async allFolders(){
    const result=[];const queue=['root'];const visited=new Set(['root']);let depth=0;
    while(queue.length>0&&depth<4){
      const batch=queue.splice(0,queue.length);
      const lists=await Promise.all(batch.map(id=>this.listSubfolders(id)));
      lists.flat().forEach(f=>{if(!visited.has(f.id)){visited.add(f.id);result.push(f);queue.push(f.id);}});
      depth++;
    }
    return result.sort((a,b)=>a.name.localeCompare(b.name,'de'));
  },
  async prev(id){
    const tok=gapi.client.getToken()?.access_token;
    if(!tok)throw new Error('Nicht angemeldet');
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('Download fehlgeschlagen: '+r.status);
    const blob=await r.blob();
    return URL.createObjectURL(blob);
  },
  async me(){try{const r=await gapi.client.request({path:'https://www.googleapis.com/oauth2/v3/userinfo'});return r.result;}catch{return null;}},
  WF:'.alysee_wf.json',
  async loadWF(){try{const r=await gapi.client.drive.files.list({q:`name='${DR.WF}' and trashed=false`,fields:'files(id)',pageSize:1});if(r.result.files?.length){const c=await gapi.client.drive.files.get({fileId:r.result.files[0].id,alt:'media'});return typeof c.result==='string'?JSON.parse(c.result):c.result;}}catch{}return{tasks:[]};},
  async saveWF(data){const j=JSON.stringify(data),tok=gapi.client.getToken()?.access_token;if(!tok)return;try{const r=await gapi.client.drive.files.list({q:`name='${DR.WF}' and trashed=false`,fields:'files(id)',pageSize:1});const s=(url,m)=>{const x=new XMLHttpRequest();x.open(m,url);x.setRequestHeader('Authorization','Bearer '+tok);x.setRequestHeader('Content-Type','application/json');x.send(j);};if(r.result.files?.length)s(`https://www.googleapis.com/upload/drive/v3/files/${r.result.files[0].id}?uploadType=media`,'PATCH');else{const f=new FormData();f.append('metadata',new Blob([JSON.stringify({name:DR.WF})],{type:'application/json'}));f.append('file',new Blob([j],{type:'application/json'}));const x=new XMLHttpRequest();x.open('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart');x.setRequestHeader('Authorization','Bearer '+tok);x.send(f);}}catch(e){console.warn(e);}}
};

function ToastProv({children}){
  const [ts,setTs]=useState([]);
  const add=useCallback((msg,t='i')=>{const id=Date.now();setTs(p=>[...p,{id,msg,t}]);setTimeout(()=>setTs(p=>p.filter(x=>x.id!==id)),3500);},[]);

/* ── VERSCHIEBEN MODAL ── */
function MoveMod({file,curFolderId,onClose,onDone,isDemo,folders,onReloadFolders}){
  const [selId,setSelId]=useState(null);
  const [selName,setSelName]=useState('');
  const [busy,setBusy]=useState(false);
  const [reloading,setReloading]=useState(false);
  const [expandedIds,setExpandedIds]=useState({});
  const [search,setSearch]=useState('');
  const [newFolderParent,setNewFolderParent]=useState(null);
  const [localNewFolders,setLocalNewFolders]=useState([]); // sofort angezeigte neue Ordner
  const creatingRef=useRef(false); // verhindert Doppelaufruf
  const toast=useContext(TC);

  const isCur=id=>id===curFolderId||(id==='root'&&(!curFolderId||curFolderId==='root'));
  const isSelf=id=>file.mimeType==='application/vnd.google-apps.folder'&&id===file.id;

  const reloadFolders=async()=>{
    setReloading(true);
    try{if(onReloadFolders)await onReloadFolders();}catch(e){console.error(e);}
    setLocalNewFolders([]); // lokale Ordner nach Reload entfernen (jetzt in folders)
    setReloading(false);
  };

  // Alle Ordner inkl. Root aufbauen
  const rootEntry={id:'root',name:'Mein Drive',parentId:null};
  const allDirs=isDemo
    ?[rootEntry,
      {id:'f1',name:'Angebote',parentId:'root'},
      {id:'f2',name:'Rechnungen',parentId:'root'},
      {id:'f2a',name:'2024',parentId:'f2'},
      {id:'f2b',name:'2025',parentId:'f2'},
      {id:'f3',name:'Projekte',parentId:'root'},
      {id:'f3a',name:'Laufend',parentId:'f3'},
      {id:'f3b',name:'Abgeschlossen',parentId:'f3'},
    ]
    :[rootEntry,...(folders||[]).map(f=>({
        id:f.id,
        name:f.displayName?f.displayName.split(' / ').pop():f.name,
        fullName:f.displayName||f.name,
        parentId:f.parentId||(f.parents&&f.parents[0])||'root'
      })),...localNewFolders.filter(nf=>!(folders||[]).some(f=>f.id===nf.id))];

  // Kinder eines Ordners ermitteln
  const childrenOf=parentId=>allDirs.filter(d=>d.id!=='root'&&d.parentId===parentId);

  // Suchfilter: alle Ordner die den Suchbegriff enthalten (und ihre Eltern)
  const searchLower=search.toLowerCase().trim();
  const matchesSearch=d=>{
    if(!searchLower)return true;
    return(d.fullName||d.name).toLowerCase().includes(searchLower);
  };

  // Beim Suchen alle Eltern aufklappen
  useEffect(()=>{
    if(!searchLower)return;
    const newExp={};
    allDirs.forEach(d=>{
      if(matchesSearch(d)){
        // Alle Eltern aufklappen
        let cur=d;
        while(cur&&cur.parentId){
          newExp[cur.parentId]=true;
          cur=allDirs.find(x=>x.id===cur.parentId);
        }
      }
    });
    setExpandedIds(p=>({...p,...newExp}));
  },[search]);

  const select=(id,name)=>{setSelId(id);setSelName(name);};

  const createMoveFolder=async(name,parentId)=>{
    if(!name.trim()||isDemo||creatingRef.current)return;
    creatingRef.current=true;
    setNewFolderParent(null);
    try{
      const f=await DR.mkdir(name,parentId);
      toast('Ordner erstellt: '+name,'s');
      // Sofort lokal anzeigen und auswählen (ohne auf Reload zu warten)
      setLocalNewFolders(p=>[...p,{id:f.id,name:name,parentId:parentId}]);
      setSelId(f.id);setSelName(name);
      setExpandedIds(p=>({...p,[parentId]:true}));
      // Im Hintergrund alle Ordner neu laden
      reloadFolders();
    }catch(e){toast('Fehler beim Erstellen','e');console.error(e);}
    creatingRef.current=false;
  };

  const go=async()=>{
    if(!selId)return;
    setBusy(true);
    try{
      if(!isDemo){const oldPar=(file.parents||[])[0]||curFolderId||'root';await DR.move(file.id,selId,oldPar);}
      toast('"'+file.name+'" verschoben nach "'+selName+'"','s');
      onDone();
    }catch(e){console.error(e);toast('Verschieben fehlgeschlagen','e');}
    setBusy(false);onClose();
  };

  // Rekursive FolderRow Komponente - funktioniert für beliebige Tiefe
  const FolderRow=({d,depth=0})=>{
    const kids=childrenOf(d.id);
    const hasKids=kids.length>0;
    const isExp=d.id==='root'||expandedIds[d.id];
    const dis=isCur(d.id)||isSelf(d.id);
    const isSelected=selId===d.id;
    const indent=depth*18;
    const shortName=d.name;

    // Bei Suche: Zeige nur Ordner die matchen oder Kinder haben die matchen
    const hasMatchingDesc=fd=>{
      if(matchesSearch(fd))return true;
      return childrenOf(fd.id).some(c=>hasMatchingDesc(c));
    };
    if(searchLower&&!hasMatchingDesc(d))return null;

    return(
      <React.Fragment>
        <div
          style={{
            display:'flex',alignItems:'center',gap:6,
            padding:'7px 12px',paddingLeft:(12+indent)+'px',
            cursor:dis?'not-allowed':'pointer',
            background:isSelected?'#E0EDFF':dis?'#fafafa':'transparent',
            color:isSelected?'var(--blue)':dis?'#bbb':'var(--txt)',
            borderBottom:'1px solid #f0f4f8',
            userSelect:'none',
          }}
          onClick={()=>!dis&&select(d.id,d.fullName||d.name)}
        >
          {/* Expand/Collapse Button */}
          <span
            style={{width:16,height:16,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--mut)',fontSize:10,cursor:hasKids?'pointer':'default',borderRadius:3,background:hasKids?'rgba(0,0,0,.04)':'transparent'}}
            onClick={hasKids?e=>{e.stopPropagation();setExpandedIds(p=>({...p,[d.id]:!p[d.id]}));}:undefined}
          >
            {hasKids&&<i className={`fas fa-chevron-${isExp?'down':'right'}`}/>}
          </span>
          <i className={`fas ${d.id==='root'?'fa-hdd':'fa-folder'}`}
            style={{color:d.id==='root'?'#7F8C8D':'#F7941D',fontSize:13,width:16,flexShrink:0}}/>
          <span style={{flex:1,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{shortName}</span>
          {isCur(d.id)&&<span style={{fontSize:10,color:'var(--mut)',background:'#F0F4F8',padding:'1px 5px',borderRadius:3,flexShrink:0}}>aktuell</span>}
          {isSelected&&<i className="fas fa-check-circle" style={{color:'var(--blue)',fontSize:12,flexShrink:0}}/>}
          {!isDemo&&<button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--mut)',fontSize:11,padding:'2px 6px',flexShrink:0,opacity:.4}} title="Unterordner erstellen" onClick={e=>{e.stopPropagation();setNewFolderParent(d.id);setExpandedIds(p=>({...p,[d.id]:true}));}}><i className="fas fa-plus" style={{pointerEvents:'none'}}/></button>}
        </div>
        {/* Inline neuer Ordner */}
        {isExp&&newFolderParent===d.id&&<div style={{padding:'4px 12px',paddingLeft:(30+indent)+'px'}}>
          <input style={{border:'1px solid var(--blue)',borderRadius:3,fontSize:12,padding:'3px 6px',width:'100%',outline:'none'}} autoFocus placeholder="Ordnername…"
            onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();if(e.target.value.trim()){e.target.dataset.submitted='1';createMoveFolder(e.target.value.trim(),d.id);}}if(e.key==='Escape')setNewFolderParent(null);}}
            onBlur={e=>{if(e.target.dataset.submitted)return;if(e.target.value.trim())createMoveFolder(e.target.value.trim(),d.id);else setNewFolderParent(null);}}
          />
        </div>}
        {/* Kinder rekursiv rendern wenn aufgeklappt */}
        {isExp&&kids.map(child=>(
          <FolderRow key={child.id} d={child} depth={depth+1}/>
        ))}
      </React.Fragment>
    );
  };

  return(
    <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <h2><i className="fas fa-share-square" style={{color:'var(--grn)'}}/>Verschieben nach…</h2>

        {/* Dateiname */}
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'#F4F7FB',borderRadius:7,marginBottom:12,border:'1px solid var(--bdr)'}}>
          <i className={`fas ${mi(file.mimeType,file.name).i}`} style={{color:mi(file.mimeType,file.name).c,fontSize:18,flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{file.name}</span>
        </div>

        {/* Suchfeld + Neu laden */}
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1,position:'relative'}}>
            <i className="fas fa-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--mut)',fontSize:12}}/>
            <input
              type="text"
              placeholder="Ordner suchen…"
              value={search}
              onChange={e=>setSearch(e.target.value)}
              style={{width:'100%',padding:'7px 10px 7px 30px',border:'1px solid var(--bdr)',borderRadius:6,fontSize:13,outline:'none',boxSizing:'border-box'}}
            />
            {search&&<span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',cursor:'pointer',color:'var(--mut)',fontSize:12}} onClick={()=>setSearch('')}>✕</span>}
          </div>
          {!isDemo&&<button className="btn bs" style={{padding:'0 10px',fontSize:11,flexShrink:0}} onClick={reloadFolders} disabled={reloading}>
            <i className={`fas ${reloading?'fa-spinner fa-spin':'fa-rotate-right'}`}/>
          </button>}
        </div>

        {/* Ordner-Baum */}
        <div style={{border:'1px solid var(--bdr)',borderRadius:6,maxHeight:340,overflowY:'auto',background:'#fff'}}>
          <FolderRow d={rootEntry} depth={0}/>
        </div>

        {/* Ausgewählter Zielordner */}
        {selId&&(
          <div style={{marginTop:10,padding:'8px 14px',background:'#E8F5E9',borderRadius:6,fontSize:13,color:'#007A3D',display:'flex',alignItems:'center',gap:8,border:'1px solid #b2dfdb'}}>
            <i className="fas fa-arrow-right"/>
            <span>Ziel: <strong>{selName}</strong></span>
          </div>
        )}

        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14}}>
          <button className="btn bs" onClick={onClose} disabled={busy}>Abbrechen</button>
          <button className="btn bg" onClick={go} disabled={busy||!selId}>
            {busy?<><i className="fas fa-spinner fa-spin"/>Verschiebe…</>:<><i className="fas fa-share-square"/>Verschieben</>}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── CAD/3D ERKENNUNG & VIEWER ── */
const CAD3D_EXT=['.stl','.obj','.gltf','.glb','.3mf','.fbx','.step','.stp','.3dm','.iges','.igs','.dxf','.dwg','.ply','.wrl'];
function isCad3d(name){if(!name)return false;const n=name.toLowerCase();return CAD3D_EXT.some(e=>n.endsWith(e));}
function getCadExt(name){if(!name)return'';const n=name.toLowerCase();return CAD3D_EXT.find(e=>n.endsWith(e))||'';}

// Inline 3D-Viewer Komponente (Three.js fuer STL/OBJ/GLTF/GLB)
function Cad3DViewer({url,fileName}){
  const cRef=useRef(null);
  const [status,setStatus]=useState('loading');
  const ext=getCadExt(fileName);
  // Formate die Three.js direkt laden kann
  const threeFormats=['.stl','.obj','.gltf','.glb','.ply','.fbx'];
  const canThree=threeFormats.some(e=>ext===e);

  useEffect(()=>{
    if(!url||!cRef.current||!canThree)return;
    setStatus('loading');
    let disposed=false;
    const el=cRef.current;
    // Dynamisch Three.js laden
    const loadScript=(src)=>new Promise((res,rej)=>{
      if(document.querySelector(`script[src="${src}"]`)){res();return;}
      const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
    (async()=>{
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
        if(ext==='.stl')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js');
        if(ext==='.obj')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js');
        if(ext==='.gltf'||ext==='.glb'){
          await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js');
        }
        if(ext==='.ply')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js');
        if(ext==='.fbx')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js');
        await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
        if(disposed)return;
        const T=window.THREE;
        const w=el.clientWidth||400,h=el.clientHeight||300;
        const scene=new T.Scene();scene.background=new T.Color(0xf0f0f0);
        const camera=new T.PerspectiveCamera(50,w/h,0.01,10000);
        const renderer=new T.WebGLRenderer({antialias:true});
        renderer.setSize(w,h);renderer.setPixelRatio(window.devicePixelRatio);
        el.innerHTML='';el.appendChild(renderer.domElement);
        // Licht
        const amb=new T.AmbientLight(0xffffff,0.6);scene.add(amb);
        const dir=new T.DirectionalLight(0xffffff,0.8);dir.position.set(5,10,7);scene.add(dir);
        const dir2=new T.DirectionalLight(0xffffff,0.3);dir2.position.set(-5,-5,-5);scene.add(dir2);
        // Grid
        scene.add(new T.GridHelper(20,20,0xcccccc,0xe0e0e0));
        // Controls
        const ctrl=new T.OrbitControls(camera,renderer.domElement);ctrl.enableDamping=true;
        // Loader
        let loader;
        if(ext==='.stl')loader=new T.STLLoader();
        else if(ext==='.obj')loader=new T.OBJLoader();
        else if(ext==='.gltf'||ext==='.glb')loader=new T.GLTFLoader();
        else if(ext==='.ply')loader=new T.PLYLoader();
        else if(ext==='.fbx')loader=new T.FBXLoader();
        const addToScene=(obj)=>{
          const mesh=obj.scene||obj;
          if(mesh.isBufferGeometry){
            mesh.computeVertexNormals();
            const mat=new T.MeshPhongMaterial({color:0x3B82F6,flatShading:false});
            scene.add(new T.Mesh(mesh,mat));
          }else{
            if(!mesh.material){mesh.traverse(c=>{if(c.isMesh&&!c.material)c.material=new T.MeshPhongMaterial({color:0x3B82F6});});}
            scene.add(mesh);
          }
          // Kamera positionieren
          const box=new T.Box3().setFromObject(scene);
          const center=box.getCenter(new T.Vector3());
          const size=box.getSize(new T.Vector3()).length();
          camera.position.copy(center).add(new T.Vector3(size*0.6,size*0.4,size*0.6));
          ctrl.target.copy(center);ctrl.update();
          if(!disposed)setStatus('ok');
        };
        loader.load(url,addToScene,undefined,e=>{console.warn('3D load err:',e);if(!disposed)setStatus('error');});
        // Animation
        const anim=()=>{if(disposed)return;requestAnimationFrame(anim);ctrl.update();renderer.render(scene,camera);};
        anim();
        // Resize
        const ro=new ResizeObserver(()=>{
          const nw=el.clientWidth||400,nh=el.clientHeight||300;
          camera.aspect=nw/nh;camera.updateProjectionMatrix();renderer.setSize(nw,nh);
        });
        ro.observe(el);
        return()=>{disposed=true;ro.disconnect();renderer.dispose();};
      }catch(e){console.error('3D viewer err:',e);if(!disposed)setStatus('error');}
    })();
    return()=>{disposed=true;};
  },[url,ext,canThree]);

  // Fuer STEP/IGES/DWG/DXF/3DM – kein direkter Three.js Support, Fallback
  if(!canThree){
    return(<div className="ctr" style={{padding:16}}>
      <i className="fas fa-cube" style={{fontSize:52,color:'#7C3AED'}}/>
      <p style={{fontSize:13,fontWeight:600,marginTop:8}}>{fileName}</p>
      <p style={{fontSize:11,color:'var(--mut)',textAlign:'center'}}>Vorschau fuer {ext.toUpperCase()}-Dateien nicht direkt moeglich.</p>
      <p style={{fontSize:11,color:'var(--mut)',textAlign:'center',marginTop:4}}>Tipp: In STL/OBJ/GLTF exportieren fuer 3D-Vorschau.</p>
    </div>);
  }
  return(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
    {status==='loading'&&<div className="ctr" style={{position:'absolute',inset:0,zIndex:2,background:'rgba(255,255,255,.8)'}}><div className="spin"/><p style={{fontSize:12,color:'var(--mut)'}}>3D-Modell wird geladen…</p></div>}
    {status==='error'&&<div className="ctr"><i className="fas fa-exclamation-triangle" style={{fontSize:32,color:'var(--org)'}}/><p style={{fontSize:12,color:'var(--red)'}}>3D-Vorschau fehlgeschlagen</p></div>}
    <div ref={cRef} style={{flex:1,minHeight:0}}/>
  </div>);
}

function useBlobUrl(file,isDemo){
  const [url,setUrl]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    let revoke=null;
    setUrl(null);setErr(null);
    if(!file||isDemo||file.mimeType==='application/vnd.google-apps.folder')return;
    setLoading(true);
    DR.prev(file.id).then(u=>{revoke=u;setUrl(u);}).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
    return()=>{if(revoke)URL.revokeObjectURL(revoke);};
  },[file?.id,isDemo]);
  return{url,loading,err};
}

  },[]);

  const load=async fid=>{setLoading(true);setSel(null);try{setFiles(await DR.ls(fid));}catch(e){console.error(e);toast('Ladefehler','e');}setLoading(false);};
  const go=f=>{const idx=path.findIndex(x=>x.id===f.id);setPath(idx>=0?path.slice(0,idx+1):[...path,{id:f.id,name:f.name}]);setCur(f);setRes(null);setQ('');if(!isDemo){load(f.id);if(!treeCache[f.id])loadTreeChildren(f.id);}else setFiles(DF);};
  const click=f=>{if(f.mimeType==='application/vnd.google-apps.folder')go(f);else setSel(f);};
  const dbl=f=>{if(f.mimeType==='application/vnd.google-apps.folder')go(f);else{setSel(f);setBig(true);}};
  const search=async qry=>{if(!qry.trim()){setRes(null);return;}setSrc(true);try{if(isDemo)setRes(DF.filter(f=>f.name.toLowerCase().includes(qry.toLowerCase())));else setRes(await DR.find(qry));}catch{toast('Suche fehlgeschlagen','e');}setSrc(false);};
  const swf=t=>{setTasks(t);if(!isDemo)DR.saveWF({tasks:t});};
  const rf=()=>{if(isDemo)setFiles(DF);else load(cur.id);};
  const doMove=f=>{setSel(f);setMoveFile(f);if(!isDemo&&allFolders.length===0)DR.allFolders().then(fl=>setAllFolders(fl)).catch(e=>console.error(e));};
  const onMoveDone=()=>{rf();setMoveFile(null);setSel(null);};

  // Lazy-Load Unterordner fuer Strukturbaum
  const loadTreeChildren=async(parentId)=>{
    if(treeCache[parentId]||treeLoading[parentId])return;
    setTreeLoading(p=>({...p,[parentId]:true}));
    try{
      const kids=await DR.listSubfolders(parentId);
      setTreeCache(p=>({...p,[parentId]:kids}));
    }catch(e){console.warn('tree load err:',e);}
    setTreeLoading(p=>{const n={...p};delete n[parentId];return n;});
  };

  /* ── DRAG & DROP ── */
  // Wichtig: dragRef.current statt dragFile-State in Event-Handlern
  // damit kein veralteter Closure-Wert gelesen wird.
  const onDragStart=(e,f)=>{
    dragRef.current=f;
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',f.id);
  };
  const onDragEnd=()=>{
    dragRef.current=null;
    setDragOverId(null);
  };

  // Erstellt Drop-Handler-Props für ein Ordner-Element
  // Wird bei jedem Render neu erstellt – kein useCallback nötig da wir Ref verwenden
  const dropProps=(targetFolder)=>{
    if(!targetFolder)return{};
    return{
      onDragOver:(e)=>{
        if(!dragRef.current||dragRef.current.id===targetFolder.id)return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect='move';
        setDragOverId(targetFolder.id);
      },
      onDragLeave:(e)=>{
        // Nur reagieren wenn das Element wirklich verlassen wird (nicht ein Kindelement)
        if(!e.currentTarget.contains(e.relatedTarget)){
          setDragOverId(p=>p===targetFolder.id?null:p);
        }
      },
      onDrop:async(e)=>{
        e.preventDefault();
        e.stopPropagation();
        setDragOverId(null);
        const df=dragRef.current;
        dragRef.current=null;
        if(!df||df.id===targetFolder.id)return;
        const oldPar=(df.parents||[])[0]||cur.id||'root';
        if(oldPar===targetFolder.id){toast('Datei ist bereits in diesem Ordner','i');return;}
        try{
          if(!isDemo)await DR.move(df.id,targetFolder.id,oldPar);
          toast(`"${df.name}" nach "${targetFolder.name}" verschoben`,'s');
          rf();if(sel?.id===df.id)setSel(null);
        }catch(err){console.error(err);toast('Verschieben fehlgeschlagen','e');}
      }
    };
  };

  /* ── RESIZE VORSCHAU (Mouse + Touch) ── */
  const startResize=useCallback(e=>{
    e.preventDefault();setResizing(true);
    const isTouch=e.type==='touchstart';
    const x0=isTouch?e.touches[0].clientX:e.clientX;
    const w0=prevW;
    const clamp=x=>{const cx=isTouch?x.touches[0].clientX:x.clientX;setPrevW(Math.max(150,Math.min(window.innerWidth*0.8,w0-(cx-x0))));};
    const mm=ev=>{if(isTouch)ev.preventDefault();clamp(ev);};
    const mu=()=>{setResizing(false);document.removeEventListener(isTouch?'touchmove':'mousemove',mm);document.removeEventListener(isTouch?'touchend':'mouseup',mu);};
    document.addEventListener(isTouch?'touchmove':'mousemove',mm,isTouch?{passive:false}:undefined);
    document.addEventListener(isTouch?'touchend':'mouseup',mu);
  },[prevW]);

  const disp=res!==null?res:files;
  const pend=tasks.filter(t=>!t.done).length;
  const NI=[{id:'archive',ic:'fa-archive',l:'Archiv'},{id:'workflow',ic:'fa-tasks',l:'Aufgaben',b:pend||null},{id:'inbox',ic:'fa-inbox',l:'E-Mails'},{id:'settings',ic:'fa-gear',l:'Einstellungen'}];
  // Rekursiver Ordnerbaum aus treeCache (lazy loaded)
  const treeChildrenOf=parentId=>treeCache[parentId]||[];
  const folders4tree=isDemo?DTREE:[{id:'root',name:'Mein Drive',icon:'fa-hdd',color:'#F7941D'}];
  const isDragging=!!dragRef.current; // Wird nur für die Drag-Bar genutzt

  return(<div style={{height:'100%',display:'flex',flexDirection:'column'}}>

    {/* TOP BAR */}
    <div className="top-bar">
      <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <AlyseeLogo size={36} radius={6}/>
        <div><div style={{fontWeight:700,fontSize:15,lineHeight:1}}>alyDoc</div><div style={{fontSize:9,color:'rgba(255,255,255,.5)',letterSpacing:'.5px'}}>DOKUMENTENMANAGEMENT</div></div>
      </div>
      <div className="srch">
        <i className="fas fa-search" style={{color:'rgba(255,255,255,.5)',fontSize:13}}/>
        <input type="text" placeholder="Suchen…" value={q} onChange={e=>{setQ(e.target.value);if(e.target.value.length>2)search(e.target.value);else if(!e.target.value)setRes(null);}} onKeyDown={e=>e.key==='Enter'&&search(q)}/>
        {src&&<i className="fas fa-spinner fa-spin" style={{color:'rgba(255,255,255,.5)'}}/>}
        {q&&!src&&<i className="fas fa-times" style={{color:'rgba(255,255,255,.5)',cursor:'pointer'}} onClick={()=>{setQ('');setRes(null);}}/>}
      </div>
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {isDemo&&<span style={{background:'var(--org)',color:'#fff',padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700}}>DEMO</span>}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700}}>{(user?.name||'S').charAt(0)}</div>
          <span className='hide-mobile' style={{fontSize:13}}>{user?.name||'Stefan Hoffmann'}</span>
        </div>
        {!isDemo&&<button onClick={onOut} style={{background:'rgba(255,255,255,.14)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',padding:'5px 10px',borderRadius:5,cursor:'pointer',fontSize:12}}><i className="fas fa-right-from-bracket"/></button>}
      </div>
    </div>

    {/* TOOLBAR */}
    <div className="toolbar">
      <AlyseeLogo size={28} radius={4}/>
      <div className="tsep"/>
      <button className="tbtn" onClick={()=>setModal('up')}><i className="fas fa-upload"/><span>Hochladen</span></button>
      <button className="tbtn" onClick={()=>setModal('mk')}><i className="fas fa-folder-plus"/><span>Neuer Ordner</span></button>
      <div className="tsep"/>
      <button className="tbtn" onClick={rf}><i className="fas fa-rotate-right"/><span>Aktualisieren</span></button>
      {sel&&<><div className="tsep"/>
        <button className="tbtn" onClick={()=>setBig(true)}><i className="fas fa-expand-alt"/><span>Gross</span></button>
        <button className="tbtn" onClick={()=>setModal('ren')}><i className="fas fa-pencil"/><span>Umbenennen</span></button>
        <button className="tbtn grn" onClick={()=>doMove(sel)}><i className="fas fa-share-square"/><span>Verschieben</span></button>
        {!isDemo&&<button className="tbtn red" onClick={async()=>{if(window.confirm(`"${sel.name}" loeschen?`)){try{await DR.del(sel.id);toast('Geloescht','i');rf();setSel(null);}catch{toast('Fehler','e');}}}}>
          <i className="fas fa-trash"/><span>Loeschen</span>
        </button>}
      </>}
    </div>

    {/* DRAG HINWEIS-LEISTE */}
    <div id="dragbar" style={{display:'none'}} className="drag-bar">
      <i className="fas fa-hand-pointer"/> Auf einen Ordner ziehen zum Verschieben · ESC zum Abbrechen
    </div>

    {/* HAUPT-BEREICH */}
    <div className="main-area">
      {/* LINKE NAVIGATION */}
      <div className="app-nav">
        {NI.map(n=>(
          <div key={n.id} className={`nav-item ${nav===n.id?'active':''}`} onClick={()=>setNav(n.id)} title={n.l}>
            <i className={`fas ${n.ic}`}/>
            <span>{n.l}</span>
            {n.b&&<span className="nav-badge">{n.b}</span>}
          </div>
        ))}
      </div>

      {nav==='workflow'?(<WF tasks={tasks}
        onAdd={fm=>{const t={...fm,id:'t'+Date.now(),done:false};swf([...tasks,t]);}}
        onTog={id=>swf(tasks.map(t=>t.id===id?{...t,done:!t.done}:t))}
        onDel={id=>swf(tasks.filter(t=>t.id!==id))}/>)
      :nav==='settings'?(<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:'var(--mut)'}}>
        <i className="fas fa-gear" style={{fontSize:48,color:'#D0D9E4'}}/>
        <p style={{fontSize:14}}>Einstellungen</p>
        <p style={{fontSize:12}}>Version 1.3 · alysee GmbH</p>
      </div>)
      :nav==='inbox'?(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        <div style={{padding:'11px 16px',borderBottom:'1px solid var(--bdr)',background:'#fff',fontWeight:700,color:'var(--pri)',fontSize:14,flexShrink:0}}><i className="fas fa-inbox" style={{marginRight:8,color:'var(--blue)'}}/>E-Mail Posteingang</div>
        <div style={{flex:1,overflow:'auto',background:'var(--bg)'}}>
          {DF.filter(f=>f.mimeType==='message/rfc822').map(m=>(
            <div key={m.id} style={{background:'#fff',margin:'8px 12px',borderRadius:8,border:'1px solid var(--bdr)',padding:'14px 16px',cursor:'pointer'}} onClick={()=>{setSel(m);setNav('archive');}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontWeight:600,fontSize:13}}>{m.name}</span><span style={{fontSize:12,color:'var(--mut)'}}>{fd(m.modifiedTime)}</span></div>
              <span className="badge b-grn">E-Mail</span>
            </div>
          ))}
        </div>
      </div>)
      :(<>
        {/* STRUKTURBAUM */}
        <div className="folder-tree">
          <div className="tree-head"><i className="fas fa-sitemap" style={{marginRight:6}}/>Strukturbaum</div>
          <div className="tree-body">
            {folders4tree.map(nd=>{
              const TreeNode=({node,depth=0})=>{
                const kids=isDemo?(node.ch||[]):treeChildrenOf(node.id);
                const hasKids=kids.length>0;
                const isLoading=!!treeLoading[node.id];
                const isLoaded=!!treeCache[node.id];
                // Zeige Pfeil wenn Kinder da oder noch nicht geladen (koennte Kinder haben)
                const showChevron=hasKids||(!isLoaded&&!isDemo);
                const toggleExpand=(e)=>{
                  e.stopPropagation();
                  if(!isLoaded&&!isDemo)loadTreeChildren(node.id);
                  setExp(p=>({...p,[node.id]:!p[node.id]}));
                };
                return(<div key={node.id}>
                  <div
                    className={`tree-item ${cur.id===node.id?'active':''} ${dragOverId===node.id?'drop-target':''}`}
                    style={{paddingLeft:12+depth*14}}
                    onClick={()=>go({...node,mimeType:'application/vnd.google-apps.folder'})}
                    {...dropProps({...node,mimeType:'application/vnd.google-apps.folder'})}
                  >
                    {isLoading?<i className="fas fa-spinner fa-spin" style={{fontSize:10,color:'var(--mut)',width:10,flexShrink:0}}/>
                    :showChevron?<i className={`fas fa-chevron-${exp[node.id]?'down':'right'}`} style={{fontSize:10,color:'var(--mut)',width:10,flexShrink:0,cursor:'pointer'}} onClick={toggleExpand}/>
                    :<span style={{width:10,display:'inline-block',flexShrink:0}}/>}
                    <i className={`fas ${node.icon||'fa-folder'}`} style={{color:node.color||'var(--org)',flexShrink:0}}/>
                    <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{node.name}</span>
                    {!isDemo&&<button className="tree-add" title="Unterordner erstellen" onClick={e=>{e.stopPropagation();setTreeNewFolder(node.id);setExp(p=>({...p,[node.id]:true}));if(!isLoaded)loadTreeChildren(node.id);}}><i className="fas fa-plus"/></button>}
                  </div>
                  {exp[node.id]&&<>
                    {treeNewFolder===node.id&&<div style={{paddingLeft:26+depth*14,padding:'3px 8px 3px '+(26+depth*14)+'px'}}>
                      <input className="tree-inline-input" autoFocus placeholder="Ordnername…"
                        onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim())createTreeFolder(e.target.value.trim(),node.id);if(e.key==='Escape')setTreeNewFolder(null);}}
                        onBlur={e=>{if(e.target.value.trim())createTreeFolder(e.target.value.trim(),node.id);else setTreeNewFolder(null);}}
                      />
                    </div>}
                    {hasKids&&kids.map(c=><TreeNode key={c.id} node={c} depth={depth+1}/>)}
                  </>}
                </div>);
              };
              return <TreeNode key={nd.id} node={nd} depth={0}/>;
            })}
          </div>
        </div>

        {/* DATEILISTE */}
        <div className="doc-panel">
          <div className="breadcrumb">
            {res!==null?<><i className="fas fa-search" style={{marginRight:4}}/><strong>Suche:</strong>&nbsp;"{q}"&nbsp;<span style={{color:'var(--mut)'}}>({res.length} Treffer)</span></> :(
              path.map((f,i)=><React.Fragment key={f.id}>{i>0&&<i className="fas fa-chevron-right" style={{fontSize:9,color:'var(--mut)'}}/>}<span className={`bc ${i===path.length-1?'cur':''}`} onClick={()=>i<path.length-1&&go(f)}>{f.name}</span></React.Fragment>)
            )}
          </div>
          <div className="doc-list-head"><div className="doc-hrow"><span/><span>Name</span><span>Geaendert am</span><span>Typ</span><span style={{textAlign:'right'}}>Groesse</span></div></div>
          <div className="doc-list">
            {loading?<div className="ctr"><div className="spin"/><p>Lade…</p></div>
            :disp.length===0?<div className="ctr"><i className="fas fa-folder-open" style={{fontSize:52,color:'#D0D9E4'}}/><p style={{fontSize:13}}>{res!==null?'Keine Treffer':'Ordner leer'}</p></div>
            :disp.map(f=>{
              const {i,c,l}=mi(f.mimeType,f.name);
              const isFd=f.mimeType==='application/vnd.google-apps.folder';
              const isDragOver=dragOverId===f.id&&isFd;
              return(<div key={f.id}
                className={`doc-row ${sel?.id===f.id?'active':''} ${isDragOver?'drop-target':''}`}
                draggable
                onDragStart={e=>onDragStart(e,f)}
                onDragEnd={onDragEnd}
                {...(isFd?dropProps(f):{})}
                onClick={()=>click(f)}
                onDoubleClick={()=>dbl(f)}
                onContextMenu={e=>{e.preventDefault();e.stopPropagation();setSel(f);setCtx({x:Math.min(e.clientX,window.innerWidth-195),y:Math.min(e.clientY,window.innerHeight-220),f});}}
              >
                <i className={`fas ${i}`} style={{color:c,fontSize:18,textAlign:'center'}}/>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:isFd?600:400}}>{f.name}</span>
                <span style={{color:'var(--mut)',fontSize:12}}>{fd(f.modifiedTime)}</span>
                <span><span className={`badge ${isFd?'b-org':'b-blue'}`}>{l}</span></span>
                <span style={{textAlign:'right',color:'var(--mut)',fontSize:12}}>{isFd?'–':fs(f.size)}</span>
              </div>);
            })}
          </div>
        </div>

        <div className={`resizer ${resizing?'drag':''}`} onMouseDown={startResize} onTouchStart={startResize}/>
        <PrevPanel file={sel} isDemo={isDemo} onExpand={()=>sel&&setBig(true)} width={prevW}/>
      </>)}
    </div>

    {/* BOTTOM NAV – nur mobile */}
    <div className="bottom-nav">
      {NI.map(n=>(
        <div key={n.id} className={`bn-item ${nav===n.id?'active':''}`} onClick={()=>setNav(n.id)}>
          <i className={`fas ${n.ic}`}/>
          <span>{n.l}</span>
          {n.b&&<span className="bn-badge">{n.b}</span>}
        </div>
      ))}
    </div>

    {/* FAB Upload – nur mobile */}
    {isMobile&&nav==='archive'&&<button className="fab" onClick={()=>setModal('up')} title="Hochladen"><i className="fas fa-plus"/></button>}

    {/* ACTION SHEET – ersetzt Kontextmenü auf Mobile */}
    {isMobile&&showActionSheet&&sel&&(
      <div className="ov" style={{alignItems:'flex-end',background:'rgba(0,0,0,.4)'}} onClick={()=>setShowActionSheet(false)}>
        <div className="action-sheet" onClick={e=>e.stopPropagation()}>
          <div className="as-handle"/>
          <div className="as-title"><i className={`fas ${mi(sel.mimeType,sel.name).i}`} style={{marginRight:6,color:mi(sel.mimeType,sel.name).c}}/>{sel.name}</div>
          <div className="as-item" onClick={()=>{setBig(true);setShowActionSheet(false);}}><i className="fas fa-eye"/>Vorschau</div>
          <div className="as-item grn" onClick={()=>{doMove(sel);setShowActionSheet(false);}}><i className="fas fa-share-square"/>Verschieben nach…</div>
          <div className="as-item" onClick={()=>{setModal('ren');setShowActionSheet(false);}}><i className="fas fa-pencil"/>Umbenennen</div>
          <div className="as-item" onClick={()=>{setModal('up');setShowActionSheet(false);}}><i className="fas fa-upload"/>Hochladen</div>
          <div className="as-item" onClick={()=>{setModal('mk');setShowActionSheet(false);}}><i className="fas fa-folder-plus"/>Neuer Ordner</div>
          {!isDemo&&sel&&<div className="as-item danger" onClick={()=>{if(window.confirm('"'+sel.name+'" loeschen?')){DR.del(sel.id).then(()=>{toast('Geloescht','i');rf();setSel(null);}).catch(()=>toast('Fehler','e'));}setShowActionSheet(false);}}><i className="fas fa-trash"/>Loeschen</div>}
        </div>
      </div>
    )}

    {/* STATUS BAR */}
    <div className="status-bar">
      <span><i className="fas fa-folder" style={{marginRight:4}}/>{cur.name}</span>
      <span>{disp.length} Eintraege</span>
      {sel&&<span><i className="fas fa-file" style={{marginRight:4}}/>{sel.name}</span>}
      {dragOverId&&<span style={{color:'var(--grn)'}}><i className="fas fa-arrows-alt" style={{marginRight:4}}/>Auf Ordner ziehen zum Verschieben</span>}
    </div>

    {/* KONTEXT-MENU */}
    {ctx&&(
      <div className="ctx" style={{left:ctx.x,top:ctx.y}} onClick={e=>e.stopPropagation()}>
        <div className="cxi" onClick={()=>{setSel(ctx.f);setBig(true);setCtx(null);}}><i className="fas fa-eye"/>Vorschau</div>
        <div className="cxi" onClick={()=>{setSel(ctx.f);setModal('ren');setCtx(null);}}><i className="fas fa-pencil"/>Umbenennen</div>
        <div className="cxs"/>
        <div className="cxi grn" onClick={()=>{doMove(ctx.f);setCtx(null);}}><i className="fas fa-share-square"/>Verschieben nach…</div>
        <div className="cxs"/>
        {ctx.f.webViewLink&&ctx.f.webViewLink!=='#'&&<><div className="cxi" onClick={()=>{window.open(ctx.f.webViewLink,'_blank');setCtx(null);}}><i className="fas fa-external-link-alt"/>In Drive oeffnen</div><div className="cxs"/></>}
        {!isDemo&&<div className="cxi danger" onClick={()=>{if(window.confirm(`"${ctx.f.name}" loeschen?`)){DR.del(ctx.f.id).then(()=>{toast('Geloescht','i');rf();setSel(null);}).catch(()=>toast('Fehler','e'));}setCtx(null);}}><i className="fas fa-trash"/>Loeschen</div>}
      </div>
    )}

    {/* MODALS */}
    {big&&sel&&<ExpandMod file={sel} isDemo={isDemo} onClose={()=>setBig(false)}/>}
    {modal==='up'&&<UpMod fid={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='mk'&&<MkMod par={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='ren'&&sel&&<RenMod file={sel} onClose={()=>setModal(null)} onDone={()=>{rf();setModal(null);}} isDemo={isDemo}/>}
    {moveFile&&<MoveMod file={moveFile} curFolderId={cur.id} onClose={()=>setMoveFile(null)} onDone={onMoveDone} isDemo={isDemo} folders={allFolders} onReloadFolders={()=>DR.allFolders().then(f=>{console.log('reload:',f.length);setAllFolders(f);return f;})}/>}
  </div>);
}

function App(){
  const [state,setState]=useState('init');
  const [isDemo,setIsDemo]=useState(false);
  const [gapiOk,setGapiOk]=useState(_gapiReady);
  const [gisOk,setGisOk]=useState(_gisReady);
  const tokRef=useRef(null);
  const toast=useContext(TC);
  useEffect(()=>{const a=()=>setGapiOk(true),b=()=>setGisOk(true);window.addEventListener('gapiOk',a);window.addEventListener('gisOk',b);return()=>{window.removeEventListener('gapiOk',a);window.removeEventListener('gisOk',b);};}, []);
  useEffect(()=>{
    if(!gapiOk||!gisOk)return;

  const signIn=()=>{if(!tokRef.current){toast('APIs noch nicht bereit','e');return;}tokRef.current.requestAccessToken({prompt:''});};
  const signOut=()=>{try{if(window.gapi?.client?.getToken()){google.accounts.oauth2.revoke(gapi.client.getToken().access_token,()=>{});gapi.client.setToken('');}}catch{}setState('login');};
  if(state==='init')return(<div className="setup-bg"><div style={{textAlign:'center',color:'#fff'}}><AlyseeLogo size={80} radius={14}/><div style={{marginTop:20}}><div className="spin" style={{margin:'0 auto',borderTopColor:'#fff',borderColor:'rgba(255,255,255,.3)'}}/></div><p style={{marginTop:16,fontSize:14,opacity:.7}}>Lade alyDoc…</p></div></div>);
  if(state==='login')return <Login onIn={signIn} onDemo={()=>{setIsDemo(true);setState('app');}} gapiOk={gapiOk} gisOk={gisOk}/>;
  return <Main onOut={signOut} isDemo={isDemo}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ToastProv><App/></ToastProv>);
</script>
