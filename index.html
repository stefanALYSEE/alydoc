  <script>
    // Dropbox OAuth config
    const DROPBOX_APP_KEY='2gz5l15uzq63ppy';
    const DBX_API='https://api.dropboxapi.com/2';
    const DBX_CONTENT='https://content.dropboxapi.com/2';
    let _dbxToken=null,_dbxRefresh=null,_dbxExpires=0,_dbxRootNs=null;
    // Non-ASCII (z.B. Umlaute) im Dropbox-API-Arg Header zu \uXXXX escapen — HTTP-Header muessen ASCII sein
    function jsonHeaderSafe(obj){return JSON.stringify(obj).replace(/[-￿]/g,c=>'\\u'+('0000'+c.charCodeAt(0).toString(16)).slice(-4));}
    function _dbxPathRootHeader(){return _dbxRootNs?{'Dropbox-API-Path-Root':jsonHeaderSafe({'.tag':'namespace_id','namespace_id':_dbxRootNs})}:{};}
    async function _dbxEnsureToken(){if(_dbxExpires&&_dbxExpires-Date.now()<60000){await _dbxTryRefresh();}return _dbxToken;}
    async function _dbxTryRefresh(){if(!_dbxRefresh)return false;try{const b=new URLSearchParams();b.set('grant_type','refresh_token');b.set('refresh_token',_dbxRefresh);b.set('client_id',DROPBOX_APP_KEY);const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b.toString()});if(!r.ok)return false;const d=await r.json();if(!d.access_token)return false;_dbxToken=d.access_token;_dbxExpires=Date.now()+(d.expires_in||14400)*1000;try{localStorage.setItem('alydoc_dbx_token',_dbxToken);localStorage.setItem('alydoc_dbx_expires',_dbxExpires.toString());}catch{}return true;}catch{return false;}}
    async function dbxRpc(path,arg){await _dbxEnsureToken();const r=await fetch(DBX_API+path,{method:'POST',headers:{'Authorization':'Bearer '+_dbxToken,'Content-Type':'application/json',..._dbxPathRootHeader()},body:JSON.stringify(arg||null)});if(r.status===401){if(await _dbxTryRefresh())return dbxRpc(path,arg);throw new Error('401');}const t=await r.text();let d;try{d=t?JSON.parse(t):{};}catch{d={raw:t};}if(!r.ok)throw new Error('Dropbox '+path+' '+r.status+': '+(d.error_summary||t));return d;}
    async function dbxUploadRaw(dropboxPath,data,mode){await _dbxEnsureToken();const arg={path:dropboxPath,mode:mode||'add',autorename:true,mute:false};let body=data;if(typeof body==='string')body=new TextEncoder().encode(body);const r=await fetch(DBX_CONTENT+'/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+_dbxToken,'Dropbox-API-Arg':jsonHeaderSafe(arg),'Content-Type':'application/octet-stream',..._dbxPathRootHeader()},body});if(r.status===401){if(await _dbxTryRefresh())return dbxUploadRaw(dropboxPath,data,mode);throw new Error('401');}const t=await r.text();let d;try{d=t?JSON.parse(t):{};}catch{d={raw:t};}if(!r.ok)throw new Error('Upload '+r.status+': '+(d.error_summary||t));return d;}
    async function dbxDownloadBlob(dropboxPath){await _dbxEnsureToken();const r=await fetch(DBX_CONTENT+'/files/download',{method:'POST',headers:{'Authorization':'Bearer '+_dbxToken,'Dropbox-API-Arg':jsonHeaderSafe({path:dropboxPath}),..._dbxPathRootHeader()}});if(!r.ok)throw new Error('Download '+r.status);return r.blob();}
    // Load tokens from localStorage on startup
    try{_dbxToken=localStorage.getItem('alydoc_dbx_token')||null;_dbxRefresh=localStorage.getItem('alydoc_dbx_refresh')||null;_dbxExpires=parseInt(localStorage.getItem('alydoc_dbx_expires')||'0');_dbxRootNs=localStorage.getItem('alydoc_dbx_root_ns')||null;}catch{}
    // Microsoft OAuth config
    const MS_TENANT='a90aaebb-0744-4f82-b5fd-512e457d8c76';
    const MS_CLIENT='8a52a75f-667c-4829-ab0e-4a314852505d';
    let _msToken=null,_msRefresh=null,_msExpires=0;
    try{_msToken=localStorage.getItem('alydoc_ms_token')||null;_msRefresh=localStorage.getItem('alydoc_ms_refresh')||null;_msExpires=parseInt(localStorage.getItem('alydoc_ms_expires')||'0');}catch{}
    async function msTryRefresh(){if(!_msRefresh)return false;try{const b=new URLSearchParams();b.set('grant_type','refresh_token');b.set('refresh_token',_msRefresh);b.set('client_id',MS_CLIENT);b.set('scope','Mail.Send User.Read offline_access');const r=await fetch(`https://login.microsoftonline.com/${MS_TENANT}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b.toString()});if(!r.ok)return false;const d=await r.json();if(!d.access_token)return false;_msToken=d.access_token;_msExpires=Date.now()+(d.expires_in||3600)*1000;if(d.refresh_token)_msRefresh=d.refresh_token;try{localStorage.setItem('alydoc_ms_token',_msToken);localStorage.setItem('alydoc_ms_refresh',_msRefresh||'');localStorage.setItem('alydoc_ms_expires',_msExpires.toString());}catch{}return true;}catch{return false;}}
    async function msEnsureToken(){if(_msToken&&Date.now()<_msExpires-60000)return;if(await msTryRefresh())return;throw new Error('MS_LOGIN_REQUIRED');}
    async function msRpc(url,body){await msEnsureToken();const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+_msToken,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===401){if(await msTryRefresh()){return msRpc(url,body);}throw new Error('MS_LOGIN_REQUIRED');}if(!r.ok){const t=await r.text();throw new Error('Graph '+r.status+': '+t);}return r.status===202?null:r.json().catch(()=>null);}

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#F2F2F7;-webkit-font-smoothing:antialiased}
    #root{display:flex;flex-direction:column}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(60,60,67,.2);border-radius:3px}
    :root{--pri:#007AFF;--blue:#007AFF;--grn:#34C759;--org:#FF9F0A;--red:#FF3B30;--nav:#F2F2F7;--navh:#E5E5EA;--bdr:rgba(60,60,67,.18);--bg:#F2F2F7;--txt:#000;--mut:#636366;--surface:#fff}
    /* ── TOP BAR ── */
    .top-bar{height:48px;background:rgba(242,242,247,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#000;display:flex;align-items:center;gap:14px;padding:0 14px;flex-shrink:0;border-bottom:.5px solid var(--bdr);box-shadow:none}
    .srch{flex:1;max-width:380px;background:rgba(118,118,128,.12);border:none;border-radius:10px;display:flex;align-items:center;padding:0 10px;gap:6px}
    .srch input{background:none;border:none;outline:none;color:#000;font-size:14px;padding:7px 0;width:100%}
    .srch input::placeholder{color:var(--mut)}
    .srch i{color:var(--mut);font-size:12px}
    /* ── TOOLBAR ── */
    .toolbar{background:rgba(242,242,247,.8);border-bottom:.5px solid var(--bdr);padding:4px 8px;display:flex;align-items:center;gap:2px;flex-shrink:0;flex-wrap:wrap}
    .tbtn{padding:5px 10px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:11px;color:#000;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .1s;min-width:52px}
    .tbtn:hover{background:rgba(0,0,0,.06)}.tbtn:disabled{opacity:.3;cursor:default}
    .tbtn i{font-size:16px;color:var(--pri)}.tbtn.grn i{color:var(--grn)}.tbtn.red i{color:var(--red)}
    .tsep{width:.5px;height:34px;background:var(--bdr);margin:0 3px}
    /* ── MAIN ── */
    .main-area{flex:1;display:flex;overflow:hidden;min-height:0}
    /* ── STATUS BAR ── */
    .status-bar{background:rgba(242,242,247,.95);border-top:.5px solid var(--bdr);color:var(--mut);padding:4px 14px;font-size:11px;display:flex;align-items:center;gap:18px;flex-shrink:0}
    /* ── SIDE NAV ── */
    .app-nav{width:54px;background:rgba(242,242,247,.98);border-right:.5px solid var(--bdr);display:flex;flex-direction:column;align-items:center;padding:8px 0;flex-shrink:0}
    .nav-item{width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;border-radius:10px;margin:2px 0;font-size:17px;transition:all .15s;position:relative;gap:2px;user-select:none}
    .nav-item span{font-size:9px;color:var(--mut)}
    .nav-item:hover{background:rgba(0,0,0,.06);color:var(--txt)}
    .nav-item.active{background:rgba(0,122,255,.12);color:var(--pri)}
    .nav-item.active span{color:var(--pri)}
    .nav-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
    /* ── FOLDER TREE ── */
    .folder-tree{width:260px;background:#F7F7F7;border-right:.5px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
    .tree-head{background:#F7F7F7;padding:10px 12px 6px;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;flex-shrink:0;border-bottom:.5px solid var(--bdr)}
    .tree-body{flex:1;overflow-y:auto}
    .tree-item{padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);border-left:2px solid transparent;transition:background .1s;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tree-item:hover{background:rgba(0,122,255,.06)}
    .tree-item:hover .tree-add{opacity:1}
    .tree-add{opacity:0;margin-left:auto;background:none;border:none;cursor:pointer;color:var(--pri);font-size:13px;padding:4px 8px;flex-shrink:0;transition:opacity .15s}
    .tree-inline-input{border:.5px solid var(--pri);border-radius:6px;font-size:12px;padding:2px 6px;width:100%;outline:none;margin:2px 0}
    .tree-item.active{background:rgba(0,122,255,.1);color:var(--pri);border-left-color:var(--pri);font-weight:600}
    .tree-item.drop-target{background:rgba(52,199,89,.1)!important;border-left-color:var(--grn)!important;outline:2px dashed var(--grn)}
    .tree-item i{width:16px;text-align:center;font-size:13px;flex-shrink:0}
    /* ── DOC PANEL ── */
    .doc-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .breadcrumb{display:flex;align-items:center;gap:4px;padding:6px 14px;background:rgba(242,242,247,.7);border-bottom:.5px solid var(--bdr);font-size:12px;color:var(--mut);flex-shrink:0;flex-wrap:wrap}
    .bc{cursor:pointer;color:var(--pri)}.bc:hover{text-decoration:underline}
    .bc.cur{color:var(--txt);cursor:default}.bc.cur:hover{text-decoration:none}
    .doc-list-head{background:rgba(242,242,247,.7);border-bottom:.5px solid var(--bdr);flex-shrink:0}
    .doc-hrow{display:grid;grid-template-columns:36px 1fr 120px 90px 78px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;align-items:center}
    .doc-list{flex:1;overflow-y:auto;background:#fff}
    .doc-row{display:grid;grid-template-columns:36px 1fr 120px 90px 78px;padding:8px 12px;align-items:center;border-bottom:.5px solid var(--bdr);cursor:pointer;font-size:13px;transition:background .1s;user-select:none}
    .doc-row:active{cursor:grabbing}
    .doc-row:hover{background:rgba(0,122,255,.05)}
    .doc-row.active{background:rgba(0,122,255,.08);border-left:2px solid var(--pri);padding-left:10px}
    .doc-row.dragging{opacity:.4;background:#f0f0f0!important}
    .doc-row.drop-target{background:rgba(52,199,89,.08)!important;outline:2px dashed var(--grn);outline-offset:-2px}
    /* ── PREVIEW ── */
    .prev-panel{background:#fff;border-left:.5px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;min-height:0}
    .resizer{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;transition:background .15s;user-select:none;touch-action:none;position:relative;z-index:10}
    .resizer::before{content:'';position:absolute;top:0;bottom:0;left:-18px;right:-18px}
    .resizer:hover,.resizer.drag{background:var(--pri);opacity:.3}
    @media(pointer:coarse){.resizer{width:10px}.resizer::before{left:-20px;right:-20px}}
    .prev-head{background:rgba(242,242,247,.7);border-bottom:.5px solid var(--bdr);padding:9px 12px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .prev-tabs{display:flex;gap:3px}
    .prev-tab{background:none;border:none;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--mut);font-weight:600}
    .prev-tab.active{background:rgba(0,122,255,.1);color:var(--pri)}
    .prev-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
    /* ── DRAG BAR ── */
    .drag-bar{font-size:11px;color:var(--mut);padding:4px 14px;background:rgba(255,204,0,.15);border-bottom:.5px solid rgba(255,204,0,.4);flex-shrink:0;display:flex;align-items:center;gap:6px}
    /* ── BADGES ── */
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;white-space:nowrap}
    .b-blue{background:rgba(0,122,255,.12);color:var(--pri)}.b-grn{background:rgba(52,199,89,.15);color:#1c8c3e}
    .b-org{background:rgba(255,159,10,.15);color:#9a4e00}.b-red{background:rgba(255,59,48,.12);color:#c0200f}.b-gray{background:rgba(60,60,67,.1);color:var(--mut)}
    /* ── MODAL ── */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
    .modal{background:#fff;border-radius:14px;padding:24px;width:500px;max-width:94vw;box-shadow:0 24px 64px rgba(0,0,0,.22);animation:fin .2s ease}
    .modal-xl{width:82vw;max-width:1100px;height:82vh;display:flex;flex-direction:column}
    @keyframes fin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .modal h2{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--txt);display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
    .fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
    .fc{width:100%;padding:9px 12px;border:.5px solid var(--bdr);border-radius:8px;font-size:14px;outline:none;transition:border .15s;background:#fff}
    .fc:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer;border:none;font-weight:600;transition:all .15s;letter-spacing:-.1px}
    .bp{background:var(--pri);color:#fff}.bp:hover{background:#0066dd}
    .bg{background:var(--grn);color:#fff}.bg:hover{background:#28a541}
    .bs{background:rgba(0,0,0,.06);color:var(--txt)}.bs:hover{background:rgba(0,0,0,.1)}
    .btn:disabled{opacity:.35;cursor:default}
    /* ── SPINNER ── */
    .spin{width:28px;height:28px;border:2.5px solid var(--bdr);border-top-color:var(--pri);border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut)}
    /* ── DROP ZONE ── */
    .drop-zone{border:2px dashed rgba(0,122,255,.25);border-radius:12px;padding:32px;text-align:center;color:var(--mut);cursor:pointer;transition:all .2s;background:rgba(242,242,247,.5)}
    .drop-zone:hover,.drop-zone.dov{border-color:var(--pri);background:rgba(0,122,255,.05);color:var(--pri)}
    /* ── TOAST ── */
    .toast-c{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.14);display:flex;align-items:center;gap:8px;animation:fin .25s ease;max-width:340px}
    .toast.s{background:rgba(52,199,89,.12);color:#1c8c3e}.toast.e{background:rgba(255,59,48,.1);color:#c0200f}.toast.i{background:rgba(0,122,255,.1);color:#0055b8}
    /* ── CONTEXT MENU ── */
    .ctx{position:fixed;background:#fff;border:.5px solid var(--bdr);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.14);padding:5px 0;z-index:3000;min-width:180px;animation:fin .12s ease}
    .cxi{padding:9px 16px;cursor:pointer;font-size:14px;color:var(--txt);display:flex;align-items:center;gap:9px}
    .cxi:hover{background:rgba(0,122,255,.06)}.cxi i{width:16px;color:var(--mut);text-align:center}
    .cxi.danger{color:var(--red)}.cxi.danger i{color:var(--red)}
    .cxi.grn{color:var(--grn)}.cxi.grn i{color:var(--grn)}
    .cxs{height:.5px;background:var(--bdr);margin:4px 0}
    /* ── TASK CARDS ── */
    .task-card{background:#fff;border-radius:10px;padding:13px;margin-bottom:8px;transition:box-shadow .2s;border:.5px solid var(--bdr)}
    .task-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}.task-card.done{opacity:.5}
    /* ── SETUP ── */
    .setup-bg{height:100vh;background:#F2F2F7;display:flex;align-items:center;justify-content:center}
    .setup-card{background:#fff;border-radius:16px;padding:36px;width:540px;max-width:94vw;box-shadow:0 4px 24px rgba(0,0,0,.1)}
    /* ── MOVE TREE ── */
    .move-tree{max-height:340px;overflow-y:auto;border:.5px solid var(--bdr);border-radius:10px;background:#F7F7F7}
    .move-row{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);transition:background .1s;user-select:none;border-bottom:.5px solid var(--bdr)}
    .move-row:last-child{border-bottom:none}
    .move-row:hover:not(.dis){background:rgba(0,122,255,.06)}
    .move-row.sel{background:rgba(0,122,255,.1);color:var(--pri);font-weight:600}
    .move-row.dis{opacity:.3;cursor:not-allowed;background:#fafafa}
    /* ── TABLET ── */
    @media(max-width:1024px){.folder-tree{width:220px}.prev-panel{max-width:280px}}
    @media(max-width:900px){.doc-hrow,.doc-row{grid-template-columns:36px 1fr 90px 72px}.doc-hrow>*:nth-child(5),.doc-row>*:nth-child(5){display:none}}
    @media(max-width:768px){.folder-tree{width:200px}.prev-panel{max-width:220px}}
    @media(max-width:640px){.prev-panel{display:none}.resizer{display:none}.folder-tree{width:230px}}
    /* ── MOBILE ── */
    @media(max-width:600px){
      html,body,#root{height:100%;height:100dvh}
      .top-bar{height:52px;padding:0 12px}
      .top-bar .srch{max-width:none}
      .toolbar{display:none}.folder-tree{display:none}.app-nav{display:none}.status-bar{display:none}.doc-hrow{display:none}
      .doc-row{grid-template-columns:40px 1fr 60px;padding:12px 14px;min-height:52px}
      .doc-row>*:nth-child(3),.doc-row>*:nth-child(4),.doc-row>*:nth-child(5){display:none}
      .doc-row>*:nth-child(2){font-size:14px}.doc-row>*:nth-child(3){display:block}
      .main-area{padding-bottom:64px}.resizer{display:none}
      .modal{padding:20px 16px;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%!important;max-width:100%!important;animation:slideup .25s ease}
      .ov{align-items:flex-end}.move-tree{max-height:50vh}.breadcrumb{font-size:12px;padding:5px 12px}
    }
    /* ── BOTTOM NAV ── */
    .bottom-nav{display:none}
    @media(max-width:600px){
      .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(242,242,247,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--bdr);z-index:500;align-items:stretch;padding-bottom:env(safe-area-inset-bottom)}

/* ── DROPBOX API ── */
// path-based: '' = root, '/Ordner/Unterordner' = subfolder
// file objects: {id: path_lower, name, mimeType (synthetic), modifiedTime, size, path_lower, path_display}
function _dbxToFile(e){
  const isFolder=e['.tag']==='folder';
  return{
    id:e.path_lower,
    name:e.name,
    mimeType:isFolder?'application/vnd.dropbox.folder':(e.media_info?.metadata?.['.tag']==='photo'?'image/jpeg':_mimeFromName(e.name)),
    modifiedTime:e.client_modified||e.server_modified||null,
    size:e.size||0,
    path_lower:e.path_lower,
    path_display:e.path_display,
  };
}
function _mimeFromName(n){
  if(!n)return'application/octet-stream';
  const ext=n.toLowerCase().split('.').pop();
  const m={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',mov:'video/quicktime',avi:'video/x-msvideo',mp3:'audio/mpeg',zip:'application/zip',eml:'message/rfc822',msg:'message/rfc822',txt:'text/plain',csv:'text/csv',html:'text/html',stl:'model/stl',obj:'model/obj',gltf:'model/gltf+json',glb:'model/gltf-binary','3mf':'application/3mf',fbx:'application/octet-stream',step:'application/step',stp:'application/step',dxf:'application/dxf',dwg:'application/dwg',ply:'application/ply'};
  return m[ext]||'application/octet-stream';
}
const DR={
  async ls(folderPath=''){
    // folderPath: '' = root, else '/path'
    const out=[];
    let res=await dbxRpc('/files/list_folder',{path:folderPath,recursive:false,include_non_downloadable_files:false});
    while(true){
      for(const e of(res.entries||[]))out.push(_dbxToFile(e));
      if(!res.has_more)break;
      res=await dbxRpc('/files/list_folder/continue',{cursor:res.cursor});
    }
    out.sort((a,b)=>{if(a.mimeType==='application/vnd.dropbox.folder'&&b.mimeType!=='application/vnd.dropbox.folder')return -1;if(b.mimeType==='application/vnd.dropbox.folder'&&a.mimeType!=='application/vnd.dropbox.folder')return 1;return a.name.localeCompare(b.name,'de');});
    return out;
  },
  async find(q){
    try{
      const r=await dbxRpc('/files/search_v2',{query:q,options:{max_results:100,file_status:'active'}});
      return(r.matches||[]).map(m=>_dbxToFile(m.metadata.metadata));
    }catch(e){console.warn('find err:',e);return[];}
  },
  async mkdir(name,parentPath=''){
    const newPath=(parentPath||'')+'/'+name;
    const r=await dbxRpc('/files/create_folder_v2',{path:newPath,autorename:false});
    const meta=r.metadata;
    return{id:meta.path_lower,name:meta.name,mimeType:'application/vnd.dropbox.folder',path_lower:meta.path_lower,path_display:meta.path_display};
  },
  async up(file,parentPath,onP){
    const targetPath=(parentPath||'')+'/'+file.name;
    await _dbxEnsureToken();
    const arg={path:targetPath,mode:'add',autorename:true,mute:false};
    return new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST',DBX_CONTENT+'/files/upload');
      x.setRequestHeader('Authorization','Bearer '+_dbxToken);
      x.setRequestHeader('Dropbox-API-Arg',jsonHeaderSafe(arg));
      x.setRequestHeader('Content-Type','application/octet-stream');
      if(_dbxRootNs)x.setRequestHeader('Dropbox-API-Path-Root',jsonHeaderSafe({'.tag':'namespace_id','namespace_id':_dbxRootNs}));
      x.upload.onprogress=e=>e.lengthComputable&&onP&&onP(Math.round(e.loaded/e.total*100));
      x.onload=()=>x.status===200?res(JSON.parse(x.responseText)):rej(new Error(x.statusText));
      x.onerror=()=>rej(new Error('Upload-Fehler'));
      x.send(file);
    });
  },
  async del(path){await dbxRpc('/files/delete_v2',{path});},
  async ren(path,newName){
    const parentPath=path.substring(0,path.lastIndexOf('/'));
    const newPath=(parentPath||'')+'/'+newName;
    const r=await dbxRpc('/files/move_v2',{from_path:path,to_path:newPath,autorename:false,allow_ownership_transfer:false});
    return _dbxToFile(r.metadata);
  },
  async move(filePath,newParentPath){
    const name=filePath.split('/').pop();
    const toPath=(newParentPath||'')+'/'+name;
    const r=await dbxRpc('/files/move_v2',{from_path:filePath,to_path:toPath,autorename:true,allow_ownership_transfer:false});
    return _dbxToFile(r.metadata);
  },
  async listSubfolders(parentPath=''){
    try{
      const out=[];
      let res=await dbxRpc('/files/list_folder',{path:parentPath,recursive:false,include_non_downloadable_files:false});
      while(true){
        for(const e of(res.entries||[])){if(e['.tag']==='folder')out.push({id:e.path_lower,name:e.name,path_lower:e.path_lower,path_display:e.path_display,parentId:parentPath});}
        if(!res.has_more)break;
        res=await dbxRpc('/files/list_folder/continue',{cursor:res.cursor});
      }
      out.sort((a,b)=>a.name.localeCompare(b.name,'de'));
      return out;
    }catch(e){console.warn('listSubfolders err:',e);return[];}
  },
  async allFolders(){
    const result=[];const queue=[''];const visited=new Set(['']);let depth=0;
    while(queue.length>0&&depth<4){
      const batch=queue.splice(0,queue.length);
      const lists=await Promise.all(batch.map(p=>this.listSubfolders(p)));
      lists.flat().forEach(f=>{if(!visited.has(f.id)){visited.add(f.id);result.push(f);queue.push(f.id);}});
      depth++;
    }
    return result.sort((a,b)=>a.name.localeCompare(b.name,'de'));
  },
  async prev(path){
    if(!path)throw new Error('Kein Pfad');
    const blob=await dbxDownloadBlob(path);
    return URL.createObjectURL(blob);
  },
  async prevBlob(path){
    await _dbxEnsureToken();
    const r=await fetch(DBX_CONTENT+'/files/download',{method:'POST',headers:{'Authorization':'Bearer '+_dbxToken,'Dropbox-API-Arg':jsonHeaderSafe({path}),..._dbxPathRootHeader()}});
    if(!r.ok)throw new Error('Download '+r.status);
    return r.blob();
  },
  async me(){
    try{
      const r=await dbxRpc('/users/get_current_account',null);
      const name=(r.name&&r.name.display_name)||r.email||'';
      // Team-Account-Erkennung
      if(r.root_info&&r.root_info.root_namespace_id){
        _dbxRootNs=String(r.root_info.root_namespace_id);
        try{localStorage.setItem('alydoc_dbx_root_ns',_dbxRootNs);}catch{}
      } else {
        _dbxRootNs=null;
        try{localStorage.removeItem('alydoc_dbx_root_ns');}catch{}
      }
      return{name,email:r.email};
    }catch{return null;}
  },
  WF:'/.alysee_wf.json',
  async loadWF(){
    try{
      const blob=await dbxDownloadBlob(DR.WF);
      const text=await blob.text();
      return JSON.parse(text);
    }catch{return{tasks:[]};}
  },
  async saveWF(data){
    const j=JSON.stringify(data);
    try{await dbxUploadRaw(DR.WF,j,'overwrite');}catch(e){console.warn('saveWF err:',e);}
  },
};

/* ── TOAST ── */
function ToastProv({children}){
  const [ts,setTs]=useState([]);
  const add=useCallback((msg,t='i')=>{const id=Date.now();setTs(p=>[...p,{id,msg,t}]);setTimeout(()=>setTs(p=>p.filter(x=>x.id!==id)),3500);},[]);
  return <TC.Provider value={add}>{children}<div className="toast-c">{ts.map(x=><div key={x.id} className={`toast ${x.t}`}><i className={`fas ${x.t==='s'?'fa-check-circle':x.t==='e'?'fa-times-circle':'fa-info-circle'}`}/>{x.msg}</div>)}</div></TC.Provider>;
}

/* ── VERSCHIEBEN MODAL ── */
function MoveMod({file,curFolderId,onClose,onDone,isDemo,folders,onReloadFolders}){
  const [selId,setSelId]=useState(null);
  const [selName,setSelName]=useState('');
  const [busy,setBusy]=useState(false);
  const [reloading,setReloading]=useState(false);
  const [expandedIds,setExpandedIds]=useState({});
  const [search,setSearch]=useState('');
  const [localNewFolders,setLocalNewFolders]=useState([]); // sofort angezeigte neue Ordner
  const creatingRef=useRef(false); // verhindert Doppelaufruf
  const toast=useContext(TC);

  const isMulti=Array.isArray(file);
  const isCur=id=>id===curFolderId||(id===''&&(!curFolderId||curFolderId===''));
  const isSelf=id=>!isMulti&&file.mimeType==='application/vnd.dropbox.folder'&&id===file.id;

  const reloadFolders=async()=>{
    setReloading(true);
    try{if(onReloadFolders)await onReloadFolders();}catch(e){console.error(e);}
    setLocalNewFolders([]); // lokale Ordner nach Reload entfernen (jetzt in folders)
    setReloading(false);
  };

  // Alle Ordner inkl. Root aufbauen
  const rootEntry={id:'',name:'Dropbox',parentId:null};
  const allDirs=isDemo
    ?[rootEntry,
      {id:'/angebote',name:'Angebote',parentId:''},
      {id:'/rechnungen',name:'Rechnungen',parentId:''},
      {id:'/rechnungen/2024',name:'2024',parentId:'/rechnungen'},
      {id:'/rechnungen/2025',name:'2025',parentId:'/rechnungen'},
      {id:'/projekte',name:'Projekte',parentId:''},
      {id:'/projekte/laufend',name:'Laufend',parentId:'/projekte'},
      {id:'/projekte/abgeschlossen',name:'Abgeschlossen',parentId:'/projekte'},
    ]
    :[rootEntry,...(folders||[]).map(f=>({
        id:f.id,
        name:f.displayName?f.displayName.split(' / ').pop():f.name,
        fullName:f.displayName||f.name,
        parentId:f.parentId||''
      })),...localNewFolders.filter(nf=>!(folders||[]).some(f=>f.id===nf.id))];

  // Kinder eines Ordners ermitteln
  const childrenOf=parentId=>allDirs.filter(d=>d.id!==''&&d.parentId===parentId);

  // Suchfilter: alle Ordner die den Suchbegriff enthalten (und ihre Eltern)
  const searchLower=search.toLowerCase().trim();
  const matchesSearch=d=>{
    if(!searchLower)return true;
    return(d.fullName||d.name).toLowerCase().includes(searchLower);
  };

  // Beim Suchen alle Eltern aufklappen
  useEffect(()=>{
    if(!searchLower)return;
    const newExp={};
    allDirs.forEach(d=>{
      if(matchesSearch(d)){
        // Alle Eltern aufklappen
        let cur=d;
        while(cur&&cur.parentId){
          newExp[cur.parentId]=true;
          cur=allDirs.find(x=>x.id===cur.parentId);
        }
      }
    });
    setExpandedIds(p=>({...p,...newExp}));
  },[search]);

  const select=(id,name)=>{setSelId(id);setSelName(name);};

  const createMoveFolder=async(parentId)=>{
    const name=window.prompt('Neuer Ordnername:');
    if(!name||!name.trim()||isDemo||creatingRef.current)return;
    creatingRef.current=true;
    try{
      const f=await DR.mkdir(name.trim(),parentId);
      toast('Ordner erstellt: '+name.trim(),'s');
      // Sofort lokal anzeigen und auswählen
      setLocalNewFolders(p=>[...p,{id:f.id,name:name.trim(),parentId:parentId,path_lower:f.path_lower}]);
      setSelId(f.id);setSelName(name.trim());
      setExpandedIds(p=>({...p,[parentId]:true}));
      // Im Hintergrund alle Ordner neu laden
      reloadFolders();
    }catch(e){toast('Fehler beim Erstellen','e');console.error(e);}
    creatingRef.current=false;
  };

  const go=async()=>{
    if(!selId)return;
    setBusy(true);
    try{
      if(isMulti){
        if(!isDemo){for(const f of file){await DR.move(f.id,selId);}}
        toast(file.length+' Dateien verschoben nach "'+selName+'"','s');
      }else{
        if(!isDemo){await DR.move(file.id,selId);}
        toast('"'+file.name+'" verschoben nach "'+selName+'"','s');
      }
      onDone();
    }catch(e){console.error(e);toast('Verschieben fehlgeschlagen','e');}
    setBusy(false);onClose();
  };

  // Rekursive FolderRow Komponente - funktioniert für beliebige Tiefe
  const FolderRow=({d,depth=0})=>{
    const kids=childrenOf(d.id);
    const hasKids=kids.length>0;
    const isExp=d.id===''||expandedIds[d.id];
    const dis=isCur(d.id)||isSelf(d.id);
    const isSelected=selId===d.id;
    const indent=depth*18;
    const shortName=d.name;

    // Bei Suche: Zeige nur Ordner die matchen oder Kinder haben die matchen
    const hasMatchingDesc=fd=>{
      if(matchesSearch(fd))return true;
      return childrenOf(fd.id).some(c=>hasMatchingDesc(c));
    };
    if(searchLower&&!hasMatchingDesc(d))return null;

    return(
      <React.Fragment>
        <div
          style={{
            display:'flex',alignItems:'center',gap:6,
            padding:'7px 12px',paddingLeft:(12+indent)+'px',
            cursor:dis?'not-allowed':'pointer',
            background:isSelected?'#E0EDFF':dis?'#fafafa':'transparent',
            color:isSelected?'var(--blue)':dis?'#bbb':'var(--txt)',
            borderBottom:'1px solid #f0f4f8',
            userSelect:'none',
          }}
          onClick={()=>!dis&&select(d.id,d.fullName||d.name)}
        >
          {/* Expand/Collapse Button */}
          <span
            style={{width:16,height:16,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--mut)',fontSize:10,cursor:hasKids?'pointer':'default',borderRadius:3,background:hasKids?'rgba(0,0,0,.04)':'transparent'}}
            onClick={hasKids?e=>{e.stopPropagation();setExpandedIds(p=>({...p,[d.id]:!p[d.id]}));}:undefined}
          >
            {hasKids&&<i className={`fas fa-chevron-${isExp?'down':'right'}`}/>}
          </span>
          <i className={`fas ${d.id===''?'fa-dropbox':'fa-folder'}`}
            style={{color:d.id===''?'#0061FF':'#F7941D',fontSize:13,width:16,flexShrink:0}}/>
          <span style={{flex:1,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{shortName}</span>
          {isCur(d.id)&&<span style={{fontSize:10,color:'var(--mut)',background:'#F0F4F8',padding:'1px 5px',borderRadius:3,flexShrink:0}}>aktuell</span>}
          {isSelected&&<i className="fas fa-check-circle" style={{color:'var(--blue)',fontSize:12,flexShrink:0}}/>}
          {!isDemo&&<button style={{marginLeft:'auto',background:'none',border:'1px solid var(--bdr)',cursor:'pointer',color:'var(--blue)',fontSize:12,padding:'3px 8px',flexShrink:0,borderRadius:4,lineHeight:1}} title="Unterordner erstellen" onClick={e=>{e.stopPropagation();createMoveFolder(d.id);}}><i className="fas fa-folder-plus" style={{pointerEvents:'none'}}/></button>}
        </div>
        {/* Kinder rekursiv rendern wenn aufgeklappt */}
        {isExp&&kids.map(child=>(
          <FolderRow key={child.id} d={child} depth={depth+1}/>
        ))}
      </React.Fragment>
    );
  };

  return(
    <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <h2><i className="fas fa-share-square" style={{color:'var(--grn)'}}/>Verschieben nach…</h2>

        {/* Dateiname */}
        {isMulti?<div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'#F4F7FB',borderRadius:7,marginBottom:12,border:'1px solid var(--bdr)'}}>
          <i className="fas fa-check-double" style={{color:'var(--blue)',fontSize:18,flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:500,flex:1}}>{file.length} Dateien ausgewaehlt</span>
        </div>:<div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'#F4F7FB',borderRadius:7,marginBottom:12,border:'1px solid var(--bdr)'}}>
          <i className={`fas ${mi(file.mimeType,file.name).i}`} style={{color:mi(file.mimeType,file.name).c,fontSize:18,flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{file.name}</span>
        </div>}

        {/* Suchfeld + Neu laden */}
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <div style={{flex:1,position:'relative'}}>
            <i className="fas fa-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--mut)',fontSize:12}}/>
            <input
              type="text"
              placeholder="Ordner suchen…"
              value={search}
              onChange={e=>setSearch(e.target.value)}
              style={{width:'100%',padding:'7px 10px 7px 30px',border:'1px solid var(--bdr)',borderRadius:6,fontSize:13,outline:'none',boxSizing:'border-box'}}
            />
            {search&&<span style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',cursor:'pointer',color:'var(--mut)',fontSize:12}} onClick={()=>setSearch('')}>✕</span>}
          </div>
          {!isDemo&&<button className="btn bp" style={{padding:'0 10px',fontSize:11,flexShrink:0,whiteSpace:'nowrap'}} onClick={()=>createMoveFolder(selId||'')}>
            <i className="fas fa-folder-plus"/> Neu
          </button>}
          {!isDemo&&<button className="btn bs" style={{padding:'0 10px',fontSize:11,flexShrink:0}} onClick={reloadFolders} disabled={reloading}>
            <i className={`fas ${reloading?'fa-spinner fa-spin':'fa-rotate-right'}`}/>
          </button>}
        </div>

        {/* Ordner-Baum */}
        <div style={{border:'1px solid var(--bdr)',borderRadius:6,maxHeight:340,overflowY:'auto',background:'#fff'}}>
          <FolderRow d={rootEntry} depth={0}/>
        </div>

        {/* Ausgewählter Zielordner */}
        {selId&&(
          <div style={{marginTop:10,padding:'8px 14px',background:'#E8F5E9',borderRadius:6,fontSize:13,color:'#007A3D',display:'flex',alignItems:'center',gap:8,border:'1px solid #b2dfdb'}}>
            <i className="fas fa-arrow-right"/>
            <span>Ziel: <strong>{selName}</strong></span>
          </div>
        )}

        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14}}>
          <button className="btn bs" onClick={onClose} disabled={busy}>Abbrechen</button>
          <button className="btn bg" onClick={go} disabled={busy||!selId}>
            {busy?<><i className="fas fa-spinner fa-spin"/>Verschiebe…</>:<><i className="fas fa-share-square"/>Verschieben</>}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── CAD/3D ERKENNUNG & VIEWER ── */
const CAD3D_EXT=['.stl','.obj','.gltf','.glb','.3mf','.fbx','.step','.stp','.3dm','.iges','.igs','.dxf','.dwg','.ply','.wrl'];
function isCad3d(name){if(!name)return false;const n=name.toLowerCase();return CAD3D_EXT.some(e=>n.endsWith(e));}
function getCadExt(name){if(!name)return'';const n=name.toLowerCase();return CAD3D_EXT.find(e=>n.endsWith(e))||'';}

// Inline 3D-Viewer Komponente (Three.js fuer STL/OBJ/GLTF/GLB)
function Cad3DViewer({url,fileName}){
  const cRef=useRef(null);
  const ctrlRef=useRef(null);
  const sceneRef=useRef(null); // Helpers fuer Toolbar (setView, zoom)
  const [status,setStatus]=useState('loading');
  const [mode,setMode]=useState('rotate'); // rotate | pan | zoom — was die linke Maus tut
  const ext=getCadExt(fileName);

  // Mode-Wechsel: linke Maustaste / 1-Finger-Drag bekommt eine andere Aktion zugewiesen
  useEffect(()=>{
    const c=ctrlRef.current,T=window.THREE;
    if(!c||!T||status!=='ok')return;
    if(mode==='rotate'){c.mouseButtons={LEFT:T.MOUSE.ROTATE,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.PAN};c.enablePan=false;}
    else if(mode==='pan'){c.mouseButtons={LEFT:T.MOUSE.PAN,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.ROTATE};c.enablePan=true;}
    else if(mode==='zoom'){c.mouseButtons={LEFT:T.MOUSE.DOLLY,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.PAN};c.enablePan=false;}
  },[mode,status]);
  // Formate die Three.js direkt laden kann
  const threeFormats=['.stl','.obj','.gltf','.glb','.ply','.fbx','.3mf','.wrl','.3dm'];
  const canThree=threeFormats.some(e=>ext===e);

  useEffect(()=>{
    if(!url||!cRef.current||!canThree)return;
    setStatus('loading');
    let disposed=false;
    const el=cRef.current;
    // Dynamisch Three.js laden
    const loadScript=(src)=>new Promise((res,rej)=>{
      if(document.querySelector(`script[src="${src}"]`)){res();return;}
      const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
    (async()=>{
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
        // fflate wird von FBXLoader (binaere FBX) und 3MFLoader (ZIP-Container) zwingend benoetigt
        if(ext==='.fbx'||ext==='.3mf')await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js');
        if(ext==='.stl')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js');
        if(ext==='.obj')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js');
        if(ext==='.gltf'||ext==='.glb'){
          await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js');
        }
        if(ext==='.ply')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js');
        if(ext==='.fbx')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js');
        if(ext==='.3mf')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3MFLoader.js');
        if(ext==='.wrl')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/VRMLLoader.js');
        // Rhino3dmLoader (r128) laedt rhino3dm selbst per XHR vom libraryPath – KEIN script-tag
        // rhino3dm@0.16.1 ist die zur r128-Era getestete Version (8.x hat API-Aenderungen → Worker haengt)
        if(ext==='.3dm')await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/3DMLoader.js');
        await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
        if(disposed)return;
        const T=window.THREE;
        const w=el.clientWidth||400,h=el.clientHeight||300;
        const scene=new T.Scene();scene.background=new T.Color(0xf0f0f0);
        const camera=new T.PerspectiveCamera(50,w/h,0.01,10000);
        const renderer=new T.WebGLRenderer({antialias:true});
        renderer.setSize(w,h);renderer.setPixelRatio(window.devicePixelRatio);
        el.innerHTML='';el.appendChild(renderer.domElement);
        // Licht
        const amb=new T.AmbientLight(0xffffff,0.6);scene.add(amb);
        const dir=new T.DirectionalLight(0xffffff,0.8);dir.position.set(5,10,7);scene.add(dir);
        const dir2=new T.DirectionalLight(0xffffff,0.3);dir2.position.set(-5,-5,-5);scene.add(dir2);
        // Grid
        scene.add(new T.GridHelper(20,20,0xcccccc,0xe0e0e0));
        // Controls — Object-Inspection: Modell bleibt im Zentrum (kein Pan)
        const ctrl=new T.OrbitControls(camera,renderer.domElement);
        ctrl.enableDamping=true;
        ctrl.dampingFactor=0.08;
        ctrl.rotateSpeed=0.8;
        ctrl.zoomSpeed=1.4;
        ctrl.enablePan=false; // Modell bleibt im Zentrum, kein Verschieben
        ctrl.touches={ONE:T.TOUCH.ROTATE,TWO:T.TOUCH.DOLLY_PAN};
        ctrlRef.current=ctrl;
        // Loader
        let loader;
        if(ext==='.stl')loader=new T.STLLoader();
        else if(ext==='.obj')loader=new T.OBJLoader();
        else if(ext==='.gltf'||ext==='.glb')loader=new T.GLTFLoader();
        else if(ext==='.ply')loader=new T.PLYLoader();
        else if(ext==='.fbx')loader=new T.FBXLoader();
        else if(ext==='.3mf')loader=new T.ThreeMFLoader();
        else if(ext==='.wrl')loader=new T.VRMLLoader();
        else if(ext==='.3dm'){loader=new T.Rhino3dmLoader();loader.setLibraryPath('https://cdn.jsdelivr.net/npm/rhino3dm@0.16.1/');}
        const addToScene=(obj)=>{
          const mesh=obj.scene||obj;
          if(mesh.isBufferGeometry){
            mesh.computeVertexNormals();
            const mat=new T.MeshPhongMaterial({color:0x3B82F6,flatShading:false,side:T.DoubleSide});
            scene.add(new T.Mesh(mesh,mat));
          }else{
            // FBX/3DM/3MF/OBJ/GLTF: Materials oft mit fehlenden Texturen → blau-default forcen
            // Zusaetzlich Normals berechnen falls nicht vorhanden + Visibility sicherstellen
            const forceMat=ext==='.fbx'||ext==='.3dm';
            mesh.traverse(c=>{
              if(c.isMesh){
                c.visible=true;
                if(c.geometry&&!c.geometry.attributes.normal)c.geometry.computeVertexNormals();
                if(forceMat||!c.material||(Array.isArray(c.material)&&c.material.some(m=>!m||m.transparent&&m.opacity<.05))){
                  c.material=new T.MeshPhongMaterial({color:0x3B82F6,side:T.DoubleSide});
                }
              }
            });
            scene.add(mesh);
          }
          // Kamera positionieren — adaptiv an Modellgroesse
          const box=new T.Box3().setFromObject(scene);
          const center=box.isEmpty()?new T.Vector3():box.getCenter(new T.Vector3());
          const rawSize=box.isEmpty()?1:box.getSize(new T.Vector3()).length();
          const sz=rawSize>0?rawSize:1; // Fallback falls Bounding Box degeneriert
          // Camera Frustum an Modellgroesse anpassen — verhindert Clipping bei sehr grossen/kleinen CAD-Modellen
          camera.near=sz*0.001;
          camera.far=sz*100;
          camera.position.copy(center).add(new T.Vector3(sz*0.6,sz*0.4,sz*0.6));
          camera.updateProjectionMatrix();
          ctrl.target.copy(center);
          ctrl.minDistance=sz*0.05;
          ctrl.maxDistance=sz*10;
          ctrl.update();
          ctrl.saveState(); // Initial-Position als Reset-State
          // Toolbar-Helper: Standard-Ansichten + Zoom
          sceneRef.current={
            setView:(x,y,z)=>{
              const v=new T.Vector3(x,y,z).normalize().multiplyScalar(sz*1.2);
              camera.position.copy(center).add(v);
              ctrl.target.copy(center);
              ctrl.update();
            },
            zoom:(factor)=>{
              const offset=camera.position.clone().sub(ctrl.target);
              const newDist=offset.length()*factor;
              if(newDist<ctrl.minDistance||newDist>ctrl.maxDistance)return;
              offset.multiplyScalar(factor);
              camera.position.copy(ctrl.target).add(offset);
              ctrl.update();
            }
          };
          if(!disposed)setStatus('ok');
        };
        loader.load(url,addToScene,undefined,e=>{console.warn('3D load err:',e);if(!disposed)setStatus('error');});
        // Animation
        const anim=()=>{if(disposed)return;requestAnimationFrame(anim);ctrl.update();renderer.render(scene,camera);};
        anim();
        // Resize
        const ro=new ResizeObserver(()=>{
          const nw=el.clientWidth||400,nh=el.clientHeight||300;
          camera.aspect=nw/nh;camera.updateProjectionMatrix();renderer.setSize(nw,nh);
        });
        ro.observe(el);
        return()=>{disposed=true;ro.disconnect();renderer.dispose();};
      }catch(e){console.error('3D viewer err:',e);if(!disposed)setStatus('error');}
    })();
    return()=>{disposed=true;};
  },[url,ext,canThree]);

  // Fuer STEP/IGES/DWG/DXF/3DM – kein direkter Three.js Support, Fallback
  if(!canThree){
    return(<div className="ctr" style={{padding:16}}>
      <i className="fas fa-cube" style={{fontSize:52,color:'#7C3AED'}}/>
      <p style={{fontSize:13,fontWeight:600,marginTop:8}}>{fileName}</p>
      <p style={{fontSize:11,color:'var(--mut)',textAlign:'center'}}>Vorschau fuer {ext.toUpperCase()}-Dateien nicht direkt moeglich.</p>
      <p style={{fontSize:11,color:'var(--mut)',textAlign:'center',marginTop:4}}>Tipp: In STL/OBJ/GLTF exportieren fuer 3D-Vorschau.</p>
    </div>);
  }
  return(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
    {status==='loading'&&<div className="ctr" style={{position:'absolute',inset:0,zIndex:2,background:'rgba(255,255,255,.8)'}}><div className="spin"/><p style={{fontSize:12,color:'var(--mut)'}}>3D-Modell wird geladen…</p></div>}
    {status==='error'&&<div className="ctr"><i className="fas fa-exclamation-triangle" style={{fontSize:32,color:'var(--org)'}}/><p style={{fontSize:12,color:'var(--red)'}}>3D-Vorschau fehlgeschlagen</p></div>}
    {status==='ok'&&(()=>{
      const bs={background:'rgba(255,255,255,.95)',border:'1px solid #d0d0d0',borderRadius:6,padding:0,cursor:'pointer',fontSize:13,color:'var(--blue)',width:32,height:30,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 1px 3px rgba(0,0,0,.08)'};
      const ms=m=>mode===m?{...bs,background:'var(--blue)',color:'#fff',borderColor:'var(--blue)'}:bs;
      return(
      <div style={{position:'absolute',top:8,right:8,zIndex:3,display:'flex',flexDirection:'column',gap:4}}>
        <button title="Modus: Drehen (linke Maus)" onClick={()=>setMode('rotate')} style={ms('rotate')}><i className="fas fa-rotate"/></button>
        <button title="Modus: Verschieben (linke Maus)" onClick={()=>setMode('pan')} style={ms('pan')}><i className="fas fa-arrows-up-down-left-right"/></button>
        <button title="Modus: Zoomen (linke Maus, hoch/runter ziehen)" onClick={()=>setMode('zoom')} style={ms('zoom')}><i className="fas fa-magnifying-glass"/></button>
        <div style={{height:6}}/>
        <button title="Vergroessern" onClick={()=>sceneRef.current?.zoom(0.85)} style={bs}><i className="fas fa-magnifying-glass-plus"/></button>
        <button title="Verkleinern" onClick={()=>sceneRef.current?.zoom(1.18)} style={bs}><i className="fas fa-magnifying-glass-minus"/></button>
        <div style={{height:6}}/>
        <button title="Vorderansicht" onClick={()=>sceneRef.current?.setView(0,0,1)} style={bs}><i className="fas fa-square"/></button>
        <button title="Draufsicht" onClick={()=>sceneRef.current?.setView(0,1,0.001)} style={bs}><i className="fas fa-arrow-down"/></button>
        <button title="Seitenansicht" onClick={()=>sceneRef.current?.setView(1,0,0)} style={bs}><i className="fas fa-arrow-right"/></button>
        <div style={{height:6}}/>
        <button title="Ansicht zentrieren (Reset)" onClick={()=>{ctrlRef.current?.reset();setMode('rotate');}} style={bs}><i className="fas fa-house"/></button>
      </div>
    );})()}
    <div ref={cRef} style={{flex:1,minHeight:0}}/>
  </div>);
}

/* ── VORSCHAU ── */
function useBlobUrl(file,isDemo){
  const [url,setUrl]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    let revoke=null;
    setUrl(null);setErr(null);
    if(!file||isDemo||file.mimeType==='application/vnd.dropbox.folder')return;
    setLoading(true);
    DR.prev(file.id).then(u=>{revoke=u;setUrl(u);}).catch(e=>setErr(e.message)).finally(()=>setLoading(false));
    return()=>{if(revoke)URL.revokeObjectURL(revoke);};
  },[file?.id,isDemo]);
  return{url,loading,err};
}

/* ── PDF.js VIEWER ── */
function PdfViewer({url,blobUrl}){
  const containerRef=useRef(null);
  const [pg,setPg]=useState(1);
  const [total,setTotal]=useState(0);
  const [scale,setScale]=useState(1);
  const [loading,setLoading]=useState(true);
  const pdfRef=useRef(null);

  useEffect(()=>{
    if(!window.pdfjsLib)return;
    let cancelled=false;
    setLoading(true);setPg(1);setTotal(0);
    const src=blobUrl||url;
    if(!src)return;
    const loadTask=window.pdfjsLib.getDocument(src);
    loadTask.promise.then(pdf=>{
      if(cancelled)return;
      pdfRef.current=pdf;
      setTotal(pdf.numPages);
      setLoading(false);
    }).catch(e=>{console.error('PDF load err:',e);setLoading(false);});
    return()=>{cancelled=true;};
  },[url,blobUrl]);

  useEffect(()=>{
    if(!pdfRef.current||!containerRef.current||pg<1||pg>total)return;
    let cancelled=false;
    pdfRef.current.getPage(pg).then(page=>{
      if(cancelled)return;
      const container=containerRef.current;
      const cw=container.parentElement.clientWidth-20;
      const viewport=page.getViewport({scale:1});
      const fitScale=cw/viewport.width;
      const finalScale=fitScale*scale;
      const sv=page.getViewport({scale:finalScale});
      // Canvas erstellen/wiederverwenden
      let canvas=container.querySelector('canvas');
      if(!canvas){canvas=document.createElement('canvas');container.innerHTML='';container.appendChild(canvas);}
      canvas.width=sv.width;canvas.height=sv.height;
      canvas.style.width='100%';canvas.style.height='auto';canvas.style.display='block';
      page.render({canvasContext:canvas.getContext('2d'),viewport:sv});
    });
    return()=>{cancelled=true;};
  },[pg,total,scale]);

  if(loading)return(<div className="ctr"><div className="spin"/><p style={{fontSize:12,color:'var(--mut)'}}>PDF wird geladen…</p></div>);
  if(!total)return(<div className="ctr"><p style={{fontSize:12,color:'var(--red)'}}>PDF konnte nicht geladen werden</p></div>);

  const btnS={background:'none',border:'1px solid var(--bdr)',cursor:'pointer',padding:'3px 8px',borderRadius:4,fontSize:12,color:'var(--txt)',lineHeight:1};
  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'#F4F7FB',borderBottom:'1px solid var(--bdr)',flexShrink:0,flexWrap:'wrap'}}>
        <button style={btnS} onClick={()=>setPg(p=>Math.max(1,p-1))} disabled={pg<=1}><i className="fas fa-chevron-left"/></button>
        <span style={{fontSize:12,color:'var(--mut)',minWidth:60,textAlign:'center'}}>{pg} / {total}</span>
        <button style={btnS} onClick={()=>setPg(p=>Math.min(total,p+1))} disabled={pg>=total}><i className="fas fa-chevron-right"/></button>
        <span style={{width:1,height:16,background:'var(--bdr)',margin:'0 2px'}}/>
        <button style={btnS} onClick={()=>setScale(s=>Math.max(0.5,s-0.2))}>−</button>
        <span style={{fontSize:11,color:'var(--mut)',minWidth:36,textAlign:'center'}}>{Math.round(scale*100)}%</span>
        <button style={btnS} onClick={()=>setScale(s=>Math.min(3,s+0.2))}>+</button>
        <button style={{...btnS,marginLeft:'auto'}} onClick={()=>setScale(1)}>Anpassen</button>
      </div>
      <div style={{flex:1,overflow:'auto',padding:10,display:'flex',justifyContent:'center',minHeight:0}}>
        <div ref={containerRef}/>
      </div>
    </div>
  );
}

function isOfficeFile(f){
  if(!f||!f.name)return false;
  const n=f.name.toLowerCase();
  return n.endsWith('.docx')||n.endsWith('.doc')||n.endsWith('.xlsx')||n.endsWith('.xls')||n.endsWith('.pptx')||n.endsWith('.ppt');
}
function isEmlFile(f){
  if(!f)return false;
  return(f.mimeType&&f.mimeType.includes('rfc822'))||(f.name&&f.name.toLowerCase().endsWith('.eml'));
}
// ── EML/MIME Decoding Helpers ────────────────────────────────────────────────
function _binToBytes(bin){const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
function _safeDecode(bytes,charset){try{return new TextDecoder(charset||'utf-8').decode(bytes);}catch{return new TextDecoder('utf-8').decode(bytes);}}
function decodeBase64Bytes(b64,charset){try{return _safeDecode(_binToBytes(atob(b64.replace(/\s/g,''))),charset);}catch{return b64;}}
function decodeQPBytes(qp,charset){
  const cleaned=qp.replace(/=\r?\n/g,'');
  const arr=[];
  for(let i=0;i<cleaned.length;i++){
    const c=cleaned[i];
    if(c==='='&&i+2<cleaned.length&&/[0-9A-Fa-f]/.test(cleaned[i+1])&&/[0-9A-Fa-f]/.test(cleaned[i+2])){
      arr.push(parseInt(cleaned.substr(i+1,2),16));i+=2;
    }else arr.push(cleaned.charCodeAt(i)&0xFF);
  }
  return _safeDecode(new Uint8Array(arr),charset);
}
function _csFromCT(ctParams){const m=(ctParams||'').match(/charset\s*=\s*"?([\w-]+)"?/i);return m?m[1].toLowerCase():'utf-8';}
// RFC 2047 — =?charset?B?...?= oder =?charset?Q?...?=
function decodeMimeHeader(s){
  if(!s)return'';
  // benachbarte encoded-words mit Whitespace verbinden
  let r=s.replace(/\?=\s+=\?/g,'?==?');
  r=r.replace(/=\?([^?]+)\?([BQbq])\?([^?]*)\?=/g,(m,cs,enc,data)=>{
    try{
      if(enc.toUpperCase()==='B')return decodeBase64Bytes(data,cs);
      // Q-encoding: _ = space, =XX = byte
      const cleaned=data.replace(/_/g,' ');
      const arr=[];
      for(let i=0;i<cleaned.length;i++){
        if(cleaned[i]==='='&&i+2<cleaned.length){arr.push(parseInt(cleaned.substr(i+1,2),16));i+=2;}
        else arr.push(cleaned.charCodeAt(i)&0xFF);
      }
      return _safeDecode(new Uint8Array(arr),cs);
    }catch{return m;}
  });
  return r;
}
async function buildEmlHtml(text){
  // Header (mit Folding) extrahieren
  const headEnd=text.search(/\r?\n\r?\n/);
  const headRaw=headEnd>=0?text.slice(0,headEnd):text;
  const unfolded=headRaw.replace(/\r?\n[ \t]+/g,' ');
  const get=(name)=>{const m=unfolded.match(new RegExp('^'+name+':\\s*(.+)$','mi'));return m?m[1].trim():'';};
  const subj=decodeMimeHeader(get('Subject'));
  const from=decodeMimeHeader(get('From'));
  const to=decodeMimeHeader(get('To'));
  const cc=decodeMimeHeader(get('Cc'));
  const date=get('Date');
  // Body: HTML bevorzugt, sonst Plain
  let body='';
  const htmlMatch=text.match(/Content-Type:\s*text\/html([^\r\n]*)(?:\r?\n[ \t][^\r\n]*)*[\r\n]+(?:Content-Transfer-Encoding:\s*(\S+)[\r\n]+)?(?:[A-Za-z-]+:\s*[^\r\n]+[\r\n]+)*[\r\n]+([\s\S]*?)(?=\r?\n--|$)/i);
  if(htmlMatch){
    const cs=_csFromCT(htmlMatch[1]);
    const enc=(htmlMatch[2]||'').toLowerCase();
    const raw=htmlMatch[3];
    if(enc==='base64')body=decodeBase64Bytes(raw,cs);
    else if(enc==='quoted-printable')body=decodeQPBytes(raw,cs);
    else body=raw;
  }
  if(!body){
    const textMatch=text.match(/Content-Type:\s*text\/plain([^\r\n]*)(?:\r?\n[ \t][^\r\n]*)*[\r\n]+(?:Content-Transfer-Encoding:\s*(\S+)[\r\n]+)?(?:[A-Za-z-]+:\s*[^\r\n]+[\r\n]+)*[\r\n]+([\s\S]*?)(?=\r?\n--|$)/i);
    if(textMatch){
      const cs=_csFromCT(textMatch[1]);
      const enc=(textMatch[2]||'').toLowerCase();
      let raw=textMatch[3];
      if(enc==='base64')raw=decodeBase64Bytes(raw,cs);
      else if(enc==='quoted-printable')raw=decodeQPBytes(raw,cs);
      body='<pre style="font-family:sans-serif;white-space:pre-wrap;padding:12px;margin:0">'+raw.replace(/</g,'&lt;')+'</pre>';
    }else{
      body='<pre style="font-family:sans-serif;white-space:pre-wrap;padding:12px;margin:0">'+text.substring(0,5000).replace(/</g,'&lt;')+'</pre>';
    }
  }
  const esc=v=>(v||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const headerHtml='<div style="font-family:-apple-system,Segoe UI,sans-serif;padding:14px 18px;background:#f5f7fa;border-bottom:1px solid #ddd;font-size:13px;line-height:1.5"><div style="font-weight:600;font-size:15px;margin-bottom:6px">'+esc(subj)+'</div>'+(from?'<div style="color:#555"><b>Von:</b> '+esc(from)+'</div>':'')+(to?'<div style="color:#555"><b>An:</b> '+esc(to)+'</div>':'')+(cc?'<div style="color:#555"><b>Cc:</b> '+esc(cc)+'</div>':'')+(date?'<div style="color:#888;font-size:12px;margin-top:4px">'+esc(date)+'</div>':'')+'</div>';
  return'<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:-apple-system,Segoe UI,sans-serif;color:#222}img{max-width:100%}</style></head><body>'+headerHtml+body+'</body></html>';
}
function useEmlPreview(file,isDemo){
  const [html,setHtml]=useState(null);
  const [loading,setLoading]=useState(false);
  useEffect(()=>{
    setHtml(null);
    if(!file||isDemo||!isEmlFile(file)||file.mimeType==='application/vnd.dropbox.folder')return;
    setLoading(true);
    let revokeUrl=null;
    DR.prev(file.id).then(async blobUrl=>{
      // EML-Datei als ARRAY-BUFFER laden, danach UTF-8 dekodieren (statt Blob.text() das das Charset raten kann)
      const r=await fetch(blobUrl);
      const buf=await r.arrayBuffer();
      URL.revokeObjectURL(blobUrl);
      const text=new TextDecoder('utf-8').decode(new Uint8Array(buf));
      const fullHtml=await buildEmlHtml(text);
      const blob=new Blob([fullHtml],{type:'text/html;charset=utf-8'});
      revokeUrl=URL.createObjectURL(blob);
      setHtml(revokeUrl);
    }).catch(e=>{console.warn('EML preview err:',e);}).finally(()=>setLoading(false));
    return()=>{if(revokeUrl)URL.revokeObjectURL(revokeUrl);};
  },[file?.id,isDemo]);
  return{html,loading};
}

      await msRpc('https://graph.microsoft.com/v1.0/me/sendMail',{
        message:{
          subject:subj||file.name,
          body:{contentType:'Text',content:body||''},
          toRecipients:[{emailAddress:{address:to.trim()}}],

        },

      });

      onClose();
    }catch(e){
      if(e.message==='MS_LOGIN_REQUIRED'){setMsReady(false);toast('Bitte zuerst mit Microsoft anmelden','e');}
      else toast('Fehler: '+e.message,'e');
    }
    setBusy(false);
  };

  return(<div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>

        <span style={{flex:1}}>Microsoft-Konto noch nicht verbunden.</span>

      <div className="fg"><label>Betreff</label><input className="fc" value={subj} onChange={e=>setSubj(e.target.value)}/></div>
      <div className="fg"><label>Nachricht</label><textarea className="fc" rows={4} value={body} onChange={e=>setBody(e.target.value)} style={{resize:'vertical'}}/></div>

      </div>
    </div>
  </div>);
}
