/* ── HAUPT-APP ── */
function Main({onOut,isDemo}){
  const [nav,setNav]=useState('archive');
  const [cur,setCur]=useState({id:'',name:'Dropbox'});
  const [path,setPath]=useState([{id:'',name:'Dropbox'}]);
  const [files,setFiles]=useState([]);
  const [sel,setSel]=useState(null);
  const [multiSel,setMultiSel]=useState([]);
  const [loading,setLoading]=useState(false);
  const [q,setQ]=useState('');
  const [res,setRes]=useState(null);
  const [src,setSrc]=useState(false);
  const [tasks,setTasks]=useState([]);
  const [modal,setModal]=useState(null);
  const [ctx,setCtx]=useState(null);
  const [user,setUser]=useState(null);
  const [exp,setExp]=useState({'':true});
  const [big,setBig]=useState(false);
  const [prevW,setPrevW]=useState(()=>window.innerWidth>1200?480:window.innerWidth>1024?340:260);
  const [resizing,setResizing]=useState(false);
  const [treeW,setTreeW]=useState(()=>window.innerWidth>1200?260:window.innerWidth>1024?220:200);
  const [treeResizing,setTreeResizing]=useState(false);
  const [moveFile,setMoveFile]=useState(null);
  const [allFolders,setAllFolders]=useState([]);
  const [treeCache,setTreeCache]=useState({});  // {parentId: [folder, ...]} – lazy loaded
  const [treeLoading,setTreeLoading]=useState({});  // {parentId: true} – wird gerade geladen
  // Drag & Drop state
  const [dragOverId,setDragOverId]=useState(null);
  const [isMobile,setIsMobile]=useState(window.innerWidth<=600);
  const [isTouch]=useState(()=>'ontouchstart' in window||navigator.maxTouchPoints>0);
  const [showActionSheet,setShowActionSheet]=useState(false);
  const dragRef=useRef(null); // aktuell gezogene Datei (Ref statt State = kein Closure-Problem)
  const longPressRef=useRef(null);
  const toast=useContext(TC);
  const [treeNewFolder,setTreeNewFolder]=useState(null); // parentId fuer Inline-Ordner-Erstellung
  const createTreeFolder=async(name,parentId)=>{
    if(!name.trim()||isDemo)return;
    try{
      await DR.mkdir(name,parentId||'');
      toast('Ordner erstellt: '+name,'s');
      // Cache fuer parent invalidieren und neu laden
      setTreeCache(p=>{const n={...p};delete n[parentId];return n;});
      loadTreeChildren(parentId);
      if(cur.id===parentId)load(parentId); // Dateiliste aktualisieren
    }catch(e){toast('Fehler beim Erstellen','e');console.error(e);}
    setTreeNewFolder(null);
  };

  useEffect(()=>{
    if(isDemo){setFiles(DF);setTasks(DT);}
    else{
      // Race-Fix: erst DR.me() (setzt Team-Root-Namespace _dbxRootNs) awaiten,
      // damit Folder-Calls den korrekten Path-Root-Header bekommen.
      // Sonst laedt der Tree aus dem privaten Dropbox statt aus dem Team-Root.
      (async()=>{
        try{const u=await DR.me();if(u)setUser(u);}catch(e){console.warn('me err:',e);}
        load('');
        DR.loadWF().then(d=>setTasks(d.tasks||[]));
        // Strukturbaum: nur Root-Ebene sofort laden (Rest lazy)
        DR.listSubfolders('').then(f=>{setTreeCache(p=>({...p,'':f}));f.forEach(k=>loadTreeChildren(k.id,false));}).catch(e=>console.error('tree root FEHLER:',e));
      })();
    }
    const h=e=>{if(!e.target.closest('.ctx'))setCtx(null);};
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[]);
  useEffect(()=>{
    const onResize=()=>setIsMobile(window.innerWidth<=600);
    window.addEventListener('resize',onResize);
    return()=>window.removeEventListener('resize',onResize);
  },[]);

  const load=async fid=>{setLoading(true);setSel(null);setMultiSel([]);try{setFiles(await DR.ls(fid));}catch(e){console.error(e);toast('Ladefehler','e');}setLoading(false);};
  const go=f=>{const isSame=cur.id===f.id;if(isSame){setExp(p=>({...p,[f.id]:!p[f.id]}));return;}const idx=path.findIndex(x=>x.id===f.id);setPath(idx>=0?path.slice(0,idx+1):[...path,{id:f.id,name:f.name}]);setCur(f);setRes(null);setQ('');setExp(p=>({...p,[f.id]:true}));if(!isDemo){load(f.id);if(!treeCache[f.id])loadTreeChildren(f.id,true);}else setFiles(DF);};
  const click=(f,e)=>{
  if(f.mimeType==='application/vnd.dropbox.folder'){if(!e?.ctrlKey&&!e?.metaKey)go(f);return;}
  if(e?.ctrlKey||e?.metaKey){
    setMultiSel(prev=>{
      const exists=prev.find(s=>s.id===f.id);
      let next=exists?prev.filter(s=>s.id!==f.id):[...prev,f];
      if(!exists&&prev.length===0&&sel&&sel.id!==f.id)next=[sel,f];
      return next;
    });
    setSel(f);
  } else if(e?.shiftKey&&sel){
    const list=disp;
    const fromIdx=list.findIndex(x=>x.id===sel.id);
    const toIdx=list.findIndex(x=>x.id===f.id);
    if(fromIdx>=0&&toIdx>=0){
      const start=Math.min(fromIdx,toIdx),end=Math.max(fromIdx,toIdx);
      setMultiSel(list.slice(start,end+1).filter(x=>x.mimeType!=='application/vnd.dropbox.folder'));
    }
    setSel(f);
  } else {
    setMultiSel([]);
    setSel(f);
  }
};
  const dbl=f=>{if(f.mimeType==='application/vnd.dropbox.folder')go(f);else{setSel(f);setBig(true);}};
  const search=async qry=>{if(!qry.trim()){setRes(null);return;}setSrc(true);try{if(isDemo)setRes(DF.filter(f=>f.name.toLowerCase().includes(qry.toLowerCase())));else setRes(await DR.find(qry));}catch{toast('Suche fehlgeschlagen','e');}setSrc(false);};
  const swf=t=>{setTasks(t);if(!isDemo)DR.saveWF({tasks:t});};
  const rf=()=>{
    if(isDemo){setFiles(DF);return;}
    load(cur.id);
    // Strukturbaum komplett invalidieren + neu laden (sonst zeigt er evtl. alten Namespace)
    setTreeCache({});setTreeLoading({});
    DR.listSubfolders('').then(f=>{
      setTreeCache({'':f});
      f.forEach(k=>{DR.listSubfolders(k.id).then(kids=>setTreeCache(p=>({...p,[k.id]:kids}))).catch(()=>{});});
    }).catch(e=>console.error('tree refresh err:',e));
  };
  const doMove=f=>{setSel(f);setMoveFile(f);if(!isDemo)DR.allFolders().then(fl=>setAllFolders(fl)).catch(e=>console.error(e));};
  const onMoveDone=()=>{rf();setMoveFile(null);setSel(null);setMultiSel([]);};

  // Lazy-Load Unterordner fuer Strukturbaum
  const loadTreeChildren=async(parentId,preloadDeep=false)=>{
    if(treeCache[parentId]||treeLoading[parentId])return;
    setTreeLoading(p=>({...p,[parentId]:true}));
    try{
      const kids=await DR.listSubfolders(parentId);
      setTreeCache(p=>({...p,[parentId]:kids}));
      // Preload one level deeper for faster navigation (ELO-style)
      if(preloadDeep&&kids.length>0&&kids.length<=30){
        kids.forEach(k=>{if(!treeCache[k.id])loadTreeChildren(k.id,false);});
      }
    }catch(e){console.warn('tree load err:',e);}
    setTreeLoading(p=>{const n={...p};delete n[parentId];return n;});
  };

  /* ── DRAG & DROP ── */
  // Wichtig: dragRef.current statt dragFile-State in Event-Handlern
  // damit kein veralteter Closure-Wert gelesen wird.
  const onDragStart=(e,f)=>{
    dragRef.current=f;
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',f.id);
  };
  const onDragEnd=()=>{
    dragRef.current=null;
    setDragOverId(null);
  };

  // Erstellt Drop-Handler-Props für ein Ordner-Element
  // Wird bei jedem Render neu erstellt – kein useCallback nötig da wir Ref verwenden
  const dropProps=(targetFolder)=>{
    if(!targetFolder)return{};
    return{
      onDragOver:(e)=>{
        if(!dragRef.current||dragRef.current.id===targetFolder.id)return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect='move';
        setDragOverId(targetFolder.id);
      },
      onDragLeave:(e)=>{
        // Nur reagieren wenn das Element wirklich verlassen wird (nicht ein Kindelement)
        if(!e.currentTarget.contains(e.relatedTarget)){
          setDragOverId(p=>p===targetFolder.id?null:p);
        }
      },
      onDrop:async(e)=>{
        e.preventDefault();
        e.stopPropagation();
        setDragOverId(null);
        const df=dragRef.current;
        dragRef.current=null;
        if(!df||df.id===targetFolder.id)return;
        // Dropbox: derive parent from path_lower
        const dfParent=df.path_lower?df.path_lower.substring(0,df.path_lower.lastIndexOf('/'))||'':cur.id||'';
        if(dfParent===targetFolder.id){toast('Datei ist bereits in diesem Ordner','i');return;}
        try{
          if(!isDemo)await DR.move(df.id,targetFolder.id);
          toast(`"${df.name}" nach "${targetFolder.name}" verschoben`,'s');
          rf();if(sel?.id===df.id)setSel(null);
        }catch(err){console.error(err);toast('Verschieben fehlgeschlagen','e');}
      }
    };
  };

  /* ── RESIZE VORSCHAU (Mouse + Touch) ── */
  const startResize=useCallback(e=>{
    e.preventDefault();setResizing(true);
    const isTouch=e.type==='touchstart';
    const x0=isTouch?e.touches[0].clientX:e.clientX;
    const w0=prevW;
    const clamp=x=>{const cx=isTouch?x.touches[0].clientX:x.clientX;setPrevW(Math.max(150,Math.min(window.innerWidth*0.8,w0-(cx-x0))));};
    const mm=ev=>{if(isTouch)ev.preventDefault();clamp(ev);};
    const mu=()=>{setResizing(false);document.removeEventListener(isTouch?'touchmove':'mousemove',mm);document.removeEventListener(isTouch?'touchend':'mouseup',mu);};
    document.addEventListener(isTouch?'touchmove':'mousemove',mm,isTouch?{passive:false}:undefined);
    document.addEventListener(isTouch?'touchend':'mouseup',mu);
  },[prevW]);

  const startResizeTree=useCallback(e=>{
    e.preventDefault();setTreeResizing(true);
    const isTouch=e.type==='touchstart';
    const x0=isTouch?e.touches[0].clientX:e.clientX;
    const w0=treeW;
    const clamp=x=>{const cx=isTouch?x.touches[0].clientX:x.clientX;setTreeW(Math.max(120,Math.min(window.innerWidth*0.4,w0+(cx-x0))));};
    const mm=ev=>{if(isTouch)ev.preventDefault();clamp(ev);};
    const mu=()=>{setTreeResizing(false);document.removeEventListener(isTouch?'touchmove':'mousemove',mm);document.removeEventListener(isTouch?'touchend':'mouseup',mu);};
    document.addEventListener(isTouch?'touchmove':'mousemove',mm,isTouch?{passive:false}:undefined);
    document.addEventListener(isTouch?'touchend':'mouseup',mu);
  },[treeW]);

  const disp=res!==null?res:files;
  const pend=tasks.filter(t=>!t.done).length;
  const NI=[{id:'archive',ic:'fa-archive',l:'Archiv'},{id:'workflow',ic:'fa-tasks',l:'Aufgaben',b:pend||null},{id:'inbox',ic:'fa-inbox',l:'E-Mails'},{id:'settings',ic:'fa-gear',l:'Einstellungen'}];
  // Rekursiver Ordnerbaum aus treeCache (lazy loaded)
  const treeChildrenOf=parentId=>treeCache[parentId]||[];
  const folders4tree=isDemo?DTREE:[{id:'',name:'Dropbox',icon:'fa-dropbox',color:'#0061FF'}];
  const isDragging=!!dragRef.current; // Wird nur für die Drag-Bar genutzt

  return(<div style={{height:'100%',display:'flex',flexDirection:'column'}}>

    {/* TOP BAR */}
    <div className="top-bar">
      <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <AlyseeLogo size={36} radius={6}/>
        <div><div style={{fontWeight:700,fontSize:15,lineHeight:1}}>alyDoc</div><div style={{fontSize:9,color:'rgba(255,255,255,.5)',letterSpacing:'.5px'}}>DOKUMENTENMANAGEMENT</div></div>
      </div>
      <div className="srch">
        <i className="fas fa-search" style={{color:'rgba(255,255,255,.5)',fontSize:13}}/>
        <input type="text" placeholder="Suchen…" value={q} onChange={e=>{setQ(e.target.value);if(e.target.value.length>2)search(e.target.value);else if(!e.target.value)setRes(null);}} onKeyDown={e=>e.key==='Enter'&&search(q)}/>
        {src&&<i className="fas fa-spinner fa-spin" style={{color:'rgba(255,255,255,.5)'}}/>}
        {q&&!src&&<i className="fas fa-times" style={{color:'rgba(255,255,255,.5)',cursor:'pointer'}} onClick={()=>{setQ('');setRes(null);}}/>}
      </div>
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {isDemo&&<span style={{background:'var(--org)',color:'#fff',padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700}}>DEMO</span>}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700}}>{(user?.name||'S').charAt(0)}</div>
          <span className='hide-mobile' style={{fontSize:13}}>{user?.name||'Stefan Hoffmann'}</span>
        </div>
        {!isDemo&&<button onClick={onOut} title="Abmelden" style={{background:'rgba(0,122,255,.08)',border:'1px solid var(--blue)',color:'var(--blue)',padding:'5px 10px',borderRadius:5,cursor:'pointer',fontSize:13}}><i className="fas fa-right-from-bracket"/></button>}
      </div>
    </div>

    {/* TOOLBAR */}
    <div className="toolbar">
      <AlyseeLogo size={28} radius={4}/>
      <div className="tsep"/>
      <button className="tbtn" onClick={()=>setModal('up')}><i className="fas fa-upload"/><span>Hochladen</span></button>
      <button className="tbtn" onClick={()=>setModal('mk')}><i className="fas fa-folder-plus"/><span>Neuer Ordner</span></button>
      <div className="tsep"/>
      <button className="tbtn" onClick={rf}><i className="fas fa-rotate-right"/><span>Aktualisieren</span></button>
      {multiSel.length>0?<><div className="tsep"/>
        <span style={{fontSize:12,color:'var(--blue)',fontWeight:600,padding:'0 6px'}}>{multiSel.length} ausgewaehlt</span>
        <button className="tbtn grn" onClick={()=>{setMoveFile(multiSel);if(!isDemo)DR.allFolders().then(fl=>setAllFolders(fl)).catch(e=>console.error(e));}}><i className="fas fa-share-square"/><span>Verschieben</span></button>
        {!isDemo&&<button className="tbtn red" onClick={async()=>{if(window.confirm(multiSel.length+' Dateien loeschen?')){try{for(const f of multiSel)await DR.del(f.path_lower||f.id);toast(multiSel.length+' Dateien geloescht','i');rf();setSel(null);setMultiSel([]);}catch{toast('Fehler','e');}}}}><i className="fas fa-trash"/><span>Loeschen</span></button>}
        <button className="tbtn" onClick={()=>setMultiSel([])}><i className="fas fa-times"/><span>Aufheben</span></button>
      </>:sel&&<><div className="tsep"/>
        <button className="tbtn" onClick={()=>setBig(true)}><i className="fas fa-expand-alt"/><span>Gross</span></button>
        <button className="tbtn" onClick={()=>setModal('ren')}><i className="fas fa-pencil"/><span>Umbenennen</span></button>
        <button className="tbtn grn" onClick={()=>doMove(sel)}><i className="fas fa-share-square"/><span>Verschieben</span></button>
        {!sel.mimeType.includes('folder')&&<button className="tbtn" onClick={()=>setModal('mail')}><i className="fas fa-envelope"/><span>Senden</span></button>}
        {!isDemo&&<button className="tbtn red" onClick={async()=>{if(window.confirm(`"${sel.name}" loeschen?`)){try{await DR.del(sel.path_lower||sel.id);toast('Geloescht','i');rf();setSel(null);}catch{toast('Fehler','e');}}}}>
          <i className="fas fa-trash"/><span>Loeschen</span>
        </button>}
      </>}
    </div>

    {/* DRAG HINWEIS-LEISTE */}
    <div id="dragbar" style={{display:'none'}} className="drag-bar">
      <i className="fas fa-hand-pointer"/> Auf einen Ordner ziehen zum Verschieben · ESC zum Abbrechen
    </div>

    {/* HAUPT-BEREICH */}
    <div className="main-area">
      {/* LINKE NAVIGATION */}
      <div className="app-nav">
        {NI.map(n=>(
          <div key={n.id} className={`nav-item ${nav===n.id?'active':''}`} onClick={()=>setNav(n.id)} title={n.l}>
            <i className={`fas ${n.ic}`}/>
            <span>{n.l}</span>
            {n.b&&<span className="nav-badge">{n.b}</span>}
          </div>
        ))}
      </div>

      {nav==='workflow'?(<WF tasks={tasks}
        onAdd={fm=>{const t={...fm,id:'t'+Date.now(),done:false};swf([...tasks,t]);}}
        onTog={id=>swf(tasks.map(t=>t.id===id?{...t,done:!t.done}:t))}
        onDel={id=>swf(tasks.filter(t=>t.id!==id))}/>)
      :nav==='settings'?(<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:'var(--mut)'}}>
        <i className="fas fa-gear" style={{fontSize:48,color:'#D0D9E4'}}/>
        <p style={{fontSize:14}}>Einstellungen</p>
        <p style={{fontSize:12}}>Version 1.3 · alysee GmbH</p>
      </div>)
      :nav==='inbox'?(<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        <div style={{padding:'11px 16px',borderBottom:'1px solid var(--bdr)',background:'#fff',fontWeight:700,color:'var(--pri)',fontSize:14,flexShrink:0}}><i className="fas fa-inbox" style={{marginRight:8,color:'var(--blue)'}}/>E-Mail Posteingang</div>
        <div style={{flex:1,overflow:'auto',background:'var(--bg)'}}>
          {DF.filter(f=>f.mimeType==='message/rfc822').map(m=>(
            <div key={m.id} style={{background:'#fff',margin:'8px 12px',borderRadius:8,border:'1px solid var(--bdr)',padding:'14px 16px',cursor:'pointer'}} onClick={()=>{setSel(m);setNav('archive');}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontWeight:600,fontSize:13}}>{m.name}</span><span style={{fontSize:12,color:'var(--mut)'}}>{fd(m.modifiedTime)}</span></div>
              <span className="badge b-grn">E-Mail</span>
            </div>
          ))}
        </div>
      </div>)
      :(<>
        {/* STRUKTURBAUM */}
        <div className="folder-tree" style={{width:treeW}}>
          <div className="tree-head"><i className="fas fa-sitemap" style={{marginRight:6}}/>Strukturbaum</div>
          <div className="tree-body">
            {folders4tree.map(nd=>{
              const TreeNode=({node,depth=0})=>{
                const kids=isDemo?(node.ch||[]):treeChildrenOf(node.id);
                const hasKids=kids.length>0;
                const isLoading=!!treeLoading[node.id];
                const isLoaded=!!treeCache[node.id];
                // Zeige Pfeil wenn Kinder da oder noch nicht geladen (koennte Kinder haben)
                const showChevron=hasKids||(!isLoaded&&!isDemo);
                const toggleExpand=(e)=>{
                  e.stopPropagation();
                  if(!isLoaded&&!isDemo)loadTreeChildren(node.id);
                  setExp(p=>({...p,[node.id]:!p[node.id]}));
                };
                return(<div key={node.id}>
                  <div
                    className={`tree-item ${cur.id===node.id?'active':''} ${dragOverId===node.id?'drop-target':''}`}
                    style={{paddingLeft:12+depth*14}}
                    onClick={()=>go({...node,mimeType:'application/vnd.dropbox.folder'})}
                    {...dropProps({...node,mimeType:'application/vnd.dropbox.folder'})}
                  >
                    {isLoading?<i className="fas fa-spinner fa-spin" style={{fontSize:10,color:'var(--mut)',width:10,flexShrink:0}}/>
                    :showChevron?<i className={`fas fa-chevron-${exp[node.id]?'down':'right'}`} style={{fontSize:10,color:'var(--mut)',width:10,flexShrink:0,cursor:'pointer'}} onClick={toggleExpand}/>
                    :<span style={{width:10,display:'inline-block',flexShrink:0}}/>}
                    <i className={`fas ${node.icon||'fa-folder'}`} style={{color:node.color||'var(--org)',flexShrink:0}}/>
                    <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis'}}>{node.name}</span>
                    {isLoaded&&kids.length>0&&<span style={{fontSize:9,color:'var(--mut)',background:'#f0f4f8',borderRadius:8,padding:'0 5px',flexShrink:0}}>{kids.length}</span>}
                    {!isDemo&&<button className="tree-add" title="Unterordner erstellen" onClick={e=>{e.stopPropagation();setTreeNewFolder(node.id);setExp(p=>({...p,[node.id]:true}));if(!isLoaded)loadTreeChildren(node.id);}}><i className="fas fa-plus"/></button>}
                  </div>
                  {exp[node.id]&&<>
                    {treeNewFolder===node.id&&<div style={{paddingLeft:26+depth*14,padding:'3px 8px 3px '+(26+depth*14)+'px'}}>
                      <input className="tree-inline-input" autoFocus placeholder="Ordnername…"
                        onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim())createTreeFolder(e.target.value.trim(),node.id);if(e.key==='Escape')setTreeNewFolder(null);}}
                        onBlur={e=>{if(e.target.value.trim())createTreeFolder(e.target.value.trim(),node.id);else setTreeNewFolder(null);}}
                      />
                    </div>}
                    {hasKids&&kids.map(c=><TreeNode key={c.id} node={c} depth={depth+1}/>)}
                  </>}
                </div>);
              };
              return <TreeNode key={nd.id} node={nd} depth={0}/>;
            })}
          </div>
        </div>

        <div className={`resizer ${treeResizing?'drag':''}`} onMouseDown={startResizeTree} onTouchStart={startResizeTree}/>
        {/* DATEILISTE */}
        <div className="doc-panel">
          <div className="breadcrumb">
            {res!==null?<><i className="fas fa-search" style={{marginRight:4}}/><strong>Suche:</strong>&nbsp;"{q}"&nbsp;<span style={{color:'var(--mut)'}}>({res.length} Treffer)</span></> :(
              path.map((f,i)=><React.Fragment key={f.id}>{i>0&&<i className="fas fa-chevron-right" style={{fontSize:9,color:'var(--mut)'}}/>}<span className={`bc ${i===path.length-1?'cur':''}`} onClick={()=>i<path.length-1&&go(f)}>{f.name}</span></React.Fragment>)
            )}
          </div>
          <div className="doc-list-head"><div className="doc-hrow"><span/><span>Name</span><span>Geaendert am</span><span>Typ</span><span style={{textAlign:'right'}}>Groesse</span></div></div>
          <div className="doc-list">
            {loading?<div className="ctr"><div className="spin"/><p>Lade…</p></div>
            :disp.length===0?<div className="ctr"><i className="fas fa-folder-open" style={{fontSize:52,color:'#D0D9E4'}}/><p style={{fontSize:13}}>{res!==null?'Keine Treffer':'Ordner leer'}</p></div>
            :disp.map(f=>{
              const {i,c,l}=mi(f.mimeType,f.name);
              const isFd=f.mimeType==='application/vnd.dropbox.folder';
              const isDragOver=dragOverId===f.id&&isFd;
              const openCtx=(f,e)=>{setSel(f);if(isMobile||isTouch){setShowActionSheet(true);}else{setCtx({x:Math.min(e.clientX,window.innerWidth-195),y:Math.min(e.clientY,window.innerHeight-220),f});}};
              return(<div key={f.id}
                className={`doc-row ${sel?.id===f.id||multiSel.some(s=>s.id===f.id)?'active':''} ${isDragOver?'drop-target':''}`}
                draggable={!isTouch}
                onDragStart={e=>onDragStart(e,f)}
                onDragEnd={onDragEnd}
                {...(isFd?dropProps(f):{})}
                onClick={(e)=>click(f,e)}
                onDoubleClick={()=>dbl(f)}
                onContextMenu={e=>{e.preventDefault();e.stopPropagation();openCtx(f,e);}}
                onTouchStart={isTouch?e=>{longPressRef.current=setTimeout(()=>{longPressRef.current='fired';setSel(f);setShowActionSheet(true);},500);}:undefined}
                onTouchEnd={isTouch?()=>{if(longPressRef.current&&longPressRef.current!=='fired')clearTimeout(longPressRef.current);longPressRef.current=null;}:undefined}
                onTouchMove={isTouch?()=>{if(longPressRef.current&&longPressRef.current!=='fired')clearTimeout(longPressRef.current);longPressRef.current=null;}:undefined}
              >
                <i className={`fas ${i}`} style={{color:c,fontSize:18,textAlign:'center'}}/>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:isFd?600:400}}>{f.name}</span>
                <span style={{color:'var(--mut)',fontSize:12}}>{fd(f.modifiedTime)}</span>
                <span><span className={`badge ${isFd?'b-org':'b-blue'}`}>{l}</span></span>
                <span style={{textAlign:'right',color:'var(--mut)',fontSize:12}}>{isFd?'–':fs(f.size)}</span>
              </div>);
            })}
          </div>
        </div>

        <div className={`resizer ${resizing?'drag':''}`} onMouseDown={startResize} onTouchStart={startResize}/>
        <PrevPanel file={sel} isDemo={isDemo} onExpand={()=>sel&&setBig(true)} width={prevW} onWider={()=>setPrevW(w=>Math.min(window.innerWidth*0.7,w+80))} onNarrower={()=>setPrevW(w=>Math.max(150,w-80))}/>
      </>)}
    </div>

    {/* BOTTOM NAV – nur mobile */}
    <div className="bottom-nav">
      {NI.map(n=>(
        <div key={n.id} className={`bn-item ${nav===n.id?'active':''}`} onClick={()=>setNav(n.id)}>
          <i className={`fas ${n.ic}`}/>
          <span>{n.l}</span>
          {n.b&&<span className="bn-badge">{n.b}</span>}
        </div>
      ))}
    </div>

    {/* FAB Upload – nur mobile */}
    {isMobile&&nav==='archive'&&<button className="fab" onClick={()=>setModal('up')} title="Hochladen"><i className="fas fa-plus"/></button>}

    {/* ACTION SHEET – Kontextmenü auf Touch-Geräten (Mobile + iPad) */}
    {(isMobile||isTouch)&&showActionSheet&&sel&&(
      <div className="ov" style={{alignItems:'flex-end',background:'rgba(0,0,0,.4)'}} onClick={()=>setShowActionSheet(false)}>
        <div className="action-sheet" onClick={e=>e.stopPropagation()}>
          <div className="as-handle"/>
          <div className="as-title"><i className={`fas ${mi(sel.mimeType,sel.name).i}`} style={{marginRight:6,color:mi(sel.mimeType,sel.name).c}}/>{sel.name}</div>
          <div className="as-item" onClick={()=>{setBig(true);setShowActionSheet(false);}}><i className="fas fa-eye"/>Vorschau</div>
          <div className="as-item grn" onClick={()=>{doMove(sel);setShowActionSheet(false);}}><i className="fas fa-share-square"/>Verschieben nach…</div>
          <div className="as-item" onClick={()=>{setModal('ren');setShowActionSheet(false);}}><i className="fas fa-pencil"/>Umbenennen</div>
          <div className="as-item" onClick={()=>{setModal('up');setShowActionSheet(false);}}><i className="fas fa-upload"/>Hochladen</div>
          <div className="as-item" onClick={()=>{setModal('mk');setShowActionSheet(false);}}><i className="fas fa-folder-plus"/>Neuer Ordner</div>
          {!isDemo&&sel&&<div className="as-item danger" onClick={()=>{if(window.confirm('"'+sel.name+'" loeschen?')){DR.del(sel.path_lower||sel.id).then(()=>{toast('Geloescht','i');rf();setSel(null);}).catch(()=>toast('Fehler','e'));}setShowActionSheet(false);}}><i className="fas fa-trash"/>Loeschen</div>}
        </div>
      </div>
    )}

    {/* STATUS BAR */}
    <div className="status-bar">
      <span><i className="fas fa-folder" style={{marginRight:4}}/>{cur.name}</span>
      <span>{disp.length} Eintraege</span>
      {multiSel.length>0?<span style={{color:'var(--blue)'}}><i className="fas fa-check-double" style={{marginRight:4}}/>{multiSel.length} ausgewaehlt</span>:sel&&<span><i className="fas fa-file" style={{marginRight:4}}/>{sel.name}</span>}
      {dragOverId&&<span style={{color:'var(--grn)'}}><i className="fas fa-arrows-alt" style={{marginRight:4}}/>Auf Ordner ziehen zum Verschieben</span>}
      <span style={{marginLeft:'auto'}}><a href="privacy.html" target="_blank" rel="noopener" style={{color:'#7A8FA8',textDecoration:'none'}}>Datenschutz</a></span>
    </div>

    {/* KONTEXT-MENU */}
    {ctx&&(
      <div className="ctx" style={{left:ctx.x,top:ctx.y}} onClick={e=>e.stopPropagation()}>
        <div className="cxi" onClick={()=>{setSel(ctx.f);setBig(true);setCtx(null);}}><i className="fas fa-eye"/>Vorschau</div>
        <div className="cxi" onClick={()=>{setSel(ctx.f);setModal('ren');setCtx(null);}}><i className="fas fa-pencil"/>Umbenennen</div>
        <div className="cxs"/>
        <div className="cxi grn" onClick={()=>{doMove(ctx.f);setCtx(null);}}><i className="fas fa-share-square"/>Verschieben nach…</div>
        <div className="cxs"/>
        {!isDemo&&<div className="cxi danger" onClick={()=>{if(window.confirm(`"${ctx.f.name}" loeschen?`)){DR.del(ctx.f.path_lower||ctx.f.id).then(()=>{toast('Geloescht','i');rf();setSel(null);}).catch(()=>toast('Fehler','e'));}setCtx(null);}}><i className="fas fa-trash"/>Loeschen</div>}
      </div>
    )}

    {/* MODALS */}
    {big&&sel&&<ExpandMod file={sel} isDemo={isDemo} onClose={()=>setBig(false)}/>}
    {modal==='up'&&<UpMod fid={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='mk'&&<MkMod par={cur.id} onClose={()=>setModal(null)} onDone={rf} isDemo={isDemo}/>}
    {modal==='ren'&&sel&&<RenMod file={sel} onClose={()=>setModal(null)} onDone={()=>{rf();setModal(null);}} isDemo={isDemo}/>}
    {modal==='mail'&&sel&&<MailMod file={sel} onClose={()=>setModal(null)} isDemo={isDemo}/>}
    {moveFile&&<MoveMod file={moveFile} curFolderId={cur.id} onClose={()=>setMoveFile(null)} onDone={onMoveDone} isDemo={isDemo} folders={allFolders} onReloadFolders={async()=>{const f=await DR.allFolders();console.log('reload:',f.length);setAllFolders(f);return f;}}/>}
  </div>);
}

function App(){
  const [state,setState]=useState('init');
  const [isDemo,setIsDemo]=useState(false);
  const toast=useContext(TC);

  useEffect(()=>{
    // Check for auth callback params in URL (after Dropbox redirect)
    const params=new URLSearchParams(window.location.search);
    const urlToken=params.get('access_token');
    const urlRefresh=params.get('refresh_token');
    const urlExpires=params.get('expires_in');
    if(urlToken){
      _dbxToken=urlToken;
      _dbxRefresh=urlRefresh||null;
      _dbxExpires=Date.now()+(parseInt(urlExpires||14400))*1000;
      try{
        localStorage.setItem('alydoc_dbx_token',_dbxToken);
        if(_dbxRefresh)localStorage.setItem('alydoc_dbx_refresh',_dbxRefresh);
        localStorage.setItem('alydoc_dbx_expires',_dbxExpires.toString());
      }catch{}
      // Clean URL
      window.history.replaceState({},'',window.location.pathname);
      setState('app');
      return;
    }
    // Check message from auth popup
    const onMsg=(e)=>{
      try{
        const msg=typeof e.data==='string'?JSON.parse(e.data):e.data;
        if(msg&&msg.type==='auth_success'&&msg.token){
          window.removeEventListener('message',onMsg);
          _dbxToken=msg.token;
          _dbxRefresh=msg.refresh||null;
          _dbxExpires=Date.now()+(parseInt(msg.expires_in||14400))*1000;
          try{
            localStorage.setItem('alydoc_dbx_token',_dbxToken);
            if(_dbxRefresh)localStorage.setItem('alydoc_dbx_refresh',_dbxRefresh);
            localStorage.setItem('alydoc_dbx_expires',_dbxExpires.toString());
          }catch{}
          setState('app');
        }
      }catch{}
    };
    window.addEventListener('message',onMsg);
    // If token already in localStorage (set in global script block), go to app
    if(_dbxToken){setState('app');}
    else{setState('login');}
    return()=>window.removeEventListener('message',onMsg);
  },[]);

  const signIn=()=>{
    const baseUrl=window.location.href.replace(/\/[^/]*(\?.*)?$/,'/');
    const authUrl=baseUrl+'auth.html';
    const popup=window.open(authUrl,'alydoc_auth','width=480,height=650');
    if(!popup){toast('Popup wurde blockiert. Bitte Popup-Blocker deaktivieren.','e');}
  };

  const signOut=()=>{
    _dbxToken=null;_dbxRefresh=null;_dbxExpires=0;_dbxRootNs=null;
    try{
      localStorage.removeItem('alydoc_dbx_token');
      localStorage.removeItem('alydoc_dbx_refresh');
      localStorage.removeItem('alydoc_dbx_expires');
      localStorage.removeItem('alydoc_dbx_user');
      localStorage.removeItem('alydoc_dbx_root_ns');
    }catch{}
    setState('login');
  };

  if(state==='init')return(<div className="setup-bg"><div style={{textAlign:'center',color:'#fff'}}><AlyseeLogo size={80} radius={14}/><div style={{marginTop:20}}><div className="spin" style={{margin:'0 auto',borderTopColor:'#fff',borderColor:'rgba(255,255,255,.3)'}}/></div><p style={{marginTop:16,fontSize:14,opacity:.7}}>Lade alyDoc…</p></div></div>);
  if(state==='login')return <Login onIn={signIn} onDemo={()=>{setIsDemo(true);setState('app');}}/>;
  return <Main onOut={signOut} isDemo={isDemo}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ToastProv><App/></ToastProv>);
</script>

  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.log('SW error:', e));
      });
    }
  </script>
</body>
</html>
